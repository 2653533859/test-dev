<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="lp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">元素定位优先级：越靠上越抗改版</text>

  <!-- axis -->
  <line x1="52" y1="62" x2="52" y2="392" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#lp)"/>
  <text x="20" y="80" font-size="11.5" fill="#64748b">稳</text>
  <text x="20" y="98" font-size="11.5" fill="#64748b">定</text>
  <text x="20" y="380" font-size="11.5" fill="#64748b">脆</text>

  <!-- level 1 -->
  <rect x="80" y="56" width="560" height="46" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="96" y="76" font-size="13.5" font-weight="700" fill="#1b4a91">1. 语义属性 · role / label / aria-label / name</text>
  <text x="96" y="94" font-size="11.5" fill="#1b4a91">跟随需求而非实现；前端换标签换 class 都不受影响；顺带守住可访问性</text>

  <!-- level 2 -->
  <rect x="80" y="112" width="560" height="46" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="96" y="132" font-size="13.5" font-weight="700" fill="#1b4a91">2. 测试专用属性 · data-testid</text>
  <text x="96" y="150" font-size="11.5" fill="#1b4a91">与前端约定的契约：改动需评审；无业务含义，不会因样式重构而变</text>

  <!-- level 3 -->
  <rect x="80" y="168" width="560" height="46" rx="8" fill="#e8f1e8" stroke="#4b8b5a"/>
  <text x="96" y="188" font-size="13.5" font-weight="700" fill="#2f5d3a">3. 业务语义属性 · id / name / placeholder / href</text>
  <text x="96" y="206" font-size="11.5" fill="#2f5d3a">前提：id 是人工命名的静态值，不是框架生成的哈希或时间戳</text>

  <!-- level 4 -->
  <rect x="80" y="224" width="560" height="46" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="96" y="244" font-size="13.5" font-weight="700" fill="#8a4b0f">4. 稳定 class / 文本内容</text>
  <text x="96" y="262" font-size="11.5" fill="#8a4b0f">语义化 class（.order-row）可接受；文本会随文案与多语言改动，慎用</text>

  <!-- level 5 -->
  <rect x="80" y="280" width="560" height="46" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="96" y="300" font-size="13.5" font-weight="700" fill="#8a4b0f">5. 结构定位 · 短链 CSS / 相对 XPath（从最近锚点起）</text>
  <text x="96" y="318" font-size="11.5" fill="#8a4b0f">限定在 2~3 层内；表格行内操作用 ancestor::tr[1] 三段式</text>

  <!-- level 6 -->
  <rect x="80" y="336" width="560" height="56" rx="8" fill="#fdecec" stroke="#c94a4a"/>
  <text x="96" y="356" font-size="13.5" font-weight="700" fill="#9c2b2b">6. 禁止：绝对路径 / 哈希 class / 动态 id / 纯下标</text>
  <text x="96" y="374" font-size="11.5" fill="#9c2b2b">/html/body/div[3]/div/span · .btn_3f9a2 · #input_1690000000123 · nth(7)</text>
  <text x="96" y="388" font-size="11.5" fill="#9c2b2b">这类定位是 DOM 结构快照，一次改版全线崩，且报错看不出定位意图</text>

  <!-- footer note -->
  <rect x="30" y="410" width="620" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="430" font-size="11.5" fill="#1f2d3d">落地要点：把优先级写进前端与测试的共同规范，新增可交互元素必须带 data-testid，并纳入 code review。</text>
  <text x="44" y="448" font-size="11.5" fill="#1f2d3d">验证口径：写进代码前先在 DevTools 控制台执行 $$("选择器").length，必须等于 1。</text>
</svg>
