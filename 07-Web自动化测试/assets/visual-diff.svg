<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="470" fill="#f8fafc"/>
  <defs>
    <marker id="ar5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fd0"/>
    </marker>
    <marker id="arO5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98324"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1f2d3d">视觉对比测试流程（基线 vs 当前）</text>

  <!-- 基线 -->
  <rect x="40" y="70" width="170" height="56" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="125" y="94" font-size="12" text-anchor="middle" fill="#1f2d3d">首次运行</text>
  <text x="125" y="112" font-size="11" text-anchor="middle" fill="#5b6b7b">生成 baseline 截图</text>

  <!-- 当前 -->
  <rect x="40" y="170" width="170" height="56" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="125" y="194" font-size="12" text-anchor="middle" fill="#1f2d3d">每次运行</text>
  <text x="125" y="212" font-size="11" text-anchor="middle" fill="#5b6b7b">截取当前截图</text>

  <!-- 对齐 -->
  <rect x="270" y="120" width="150" height="56" rx="8" fill="#ffffff" stroke="#1f2d3d"/>
  <text x="345" y="144" font-size="12" text-anchor="middle" fill="#1f2d3d">像素级对齐</text>
  <text x="345" y="162" font-size="11" text-anchor="middle" fill="#5b6b7b">裁剪/遮罩动态区</text>

  <!-- diff -->
  <rect x="270" y="220" width="150" height="56" rx="8" fill="#ffffff" stroke="#1f2d3d"/>
  <text x="345" y="244" font-size="12" text-anchor="middle" fill="#1f2d3d">计算差异</text>
  <text x="345" y="262" font-size="11" text-anchor="middle" fill="#5b6b7b">diff 像素 / 百分比</text>

  <!-- 阈值判断 -->
  <rect x="470" y="215" width="160" height="66" rx="28" fill="#ffffff" stroke="#1f2d3d"/>
  <text x="550" y="240" font-size="12" text-anchor="middle" fill="#1f2d3d">差异 &lt; 阈值?</text>
  <text x="550" y="258" font-size="11" text-anchor="middle" fill="#5b6b7b">如 0.1%</text>

  <!-- 通过 -->
  <rect x="490" y="330" width="150" height="50" rx="8" fill="#c8f0d0" stroke="#2f9e44"/>
  <text x="565" y="358" font-size="13" text-anchor="middle" fill="#1f2d3d">视觉通过</text>

  <!-- 失败 -->
  <rect x="270" y="330" width="170" height="50" rx="8" fill="#ffd6d6" stroke="#c0392b"/>
  <text x="355" y="352" font-size="12" text-anchor="middle" fill="#1f2d3d">视觉回归</text>
  <text x="355" y="370" font-size="11" text-anchor="middle" fill="#5b6b7b">出 diff 图人工确认</text>

  <!-- edges -->
  <line x1="125" y1="126" x2="125" y2="168" stroke="#d98324" stroke-width="2" marker-end="url(#arO5)"/>
  <line x1="210" y1="98" x2="268" y2="138" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ar5)"/>
  <line x1="210" y1="198" x2="268" y2="158" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ar5)"/>
  <line x1="345" y1="176" x2="345" y2="218" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ar5)"/>
  <line x1="420" y1="248" x2="468" y2="248" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ar5)"/>
  <line x1="550" y1="281" x2="550" y2="328" stroke="#2f9e44" stroke-width="2" marker-end="url(#ar5)"/>
  <text x="560" y="310" font-size="11" fill="#2f9e44">是</text>
  <line x1="550" y1="281" x2="440" y2="335" stroke="#c0392b" stroke-width="2" marker-end="url(#arO5)"/>
  <text x="500" y="300" font-size="11" fill="#c0392b">否</text>
</svg>
