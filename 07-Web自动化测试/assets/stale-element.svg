<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="se" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#1f2d3d">StaleElementReferenceException 的成因与四种异常的分工</text>

  <!-- timeline -->
  <text x="24" y="56" font-size="13" font-weight="700" fill="#1b4a91">Stale 的产生：引用指向的是「那一个 DOM 节点」，不是「那个选择器」</text>

  <rect x="24" y="68" width="150" height="52" rx="7" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="99" y="88" font-size="12" fill="#1b4a91" text-anchor="middle">find_element</text>
  <text x="99" y="106" font-size="11" fill="#1b4a91" text-anchor="middle">拿到节点 #1 的引用</text>

  <rect x="196" y="68" width="160" height="52" rx="7" fill="#ffe0c2" stroke="#d98324"/>
  <text x="276" y="88" font-size="12" fill="#8a4b0f" text-anchor="middle">前端重渲染</text>
  <text x="276" y="106" font-size="11" fill="#8a4b0f" text-anchor="middle">节点 #1 被销毁</text>

  <rect x="378" y="68" width="150" height="52" rx="7" fill="#ffe0c2" stroke="#d98324"/>
  <text x="453" y="88" font-size="12" fill="#8a4b0f" text-anchor="middle">生成外观相同的</text>
  <text x="453" y="106" font-size="11" fill="#8a4b0f" text-anchor="middle">新节点 #2</text>

  <rect x="550" y="68" width="106" height="52" rx="7" fill="#fdecec" stroke="#c94a4a"/>
  <text x="603" y="88" font-size="12" fill="#9c2b2b" text-anchor="middle">用旧引用</text>
  <text x="603" y="106" font-size="11" fill="#9c2b2b" text-anchor="middle">→ Stale</text>

  <line x1="174" y1="94" x2="194" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#se)"/>
  <line x1="356" y1="94" x2="376" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#se)"/>
  <line x1="528" y1="94" x2="548" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#se)"/>

  <text x="24" y="146" font-size="11.5" fill="#334155">典型触发：列表刷新 / 表格排序分页 / Vue-React 状态更新 / 点击后局部 DOM 替换 / 页面跳转</text>
  <text x="24" y="164" font-size="11.5" fill="#2f5d3a">根治：不缓存 WebElement，用到时重新定位；Playwright 的 locator 惰性求值，天然没有这个问题。</text>

  <!-- four exceptions -->
  <text x="24" y="196" font-size="13" font-weight="700" fill="#1f2d3d">四种高频异常：先分清「找不到」「摸不着」「点不了」「过期了」</text>

  <rect x="24" y="208" width="312" height="98" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="228" font-size="12.5" font-weight="700" fill="#1b4a91">NoSuchElementException · 找不到</text>
  <text x="40" y="248" font-size="11" fill="#334155">选择器错 / 还没渲染 / 在 iframe 或 Shadow DOM 内</text>
  <text x="40" y="266" font-size="11" fill="#334155">/ 在另一个窗口</text>
  <text x="40" y="288" font-size="11" fill="#2f5d3a">→ 控制台验证选择器 · 加显式等待 · 检查上下文</text>

  <rect x="344" y="208" width="312" height="98" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="228" font-size="12.5" font-weight="700" fill="#8a4b0f">ElementNotInteractable · 摸不着</text>
  <text x="360" y="248" font-size="11" fill="#334155">元素存在但不可见 / 尺寸为 0 / disabled</text>
  <text x="360" y="266" font-size="11" fill="#334155">/ 在视口外</text>
  <text x="360" y="288" font-size="11" fill="#2f5d3a">→ 等 clickable · scrollIntoView · 点关联 label</text>

  <rect x="24" y="316" width="312" height="98" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="336" font-size="12.5" font-weight="700" fill="#9c2b2b">ElementClickIntercepted · 点不了</text>
  <text x="40" y="356" font-size="11" fill="#334155">被 loading 遮罩 / Toast / 固定顶栏 / 动画中的</text>
  <text x="40" y="374" font-size="11" fill="#334155">元素挡住（报错会给出拦截者）</text>
  <text x="40" y="396" font-size="11" fill="#2f5d3a">→ 等遮罩消失，而不是用 JS 点击绕过</text>

  <rect x="344" y="316" width="312" height="98" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="336" font-size="12.5" font-weight="700" fill="#5b3fa8">StaleElementReference · 过期了</text>
  <text x="360" y="356" font-size="11" fill="#334155">引用的 DOM 节点已被销毁重建</text>
  <text x="360" y="374" font-size="11" fill="#334155">（元素"看起来"还在页面上）</text>
  <text x="360" y="396" font-size="11" fill="#2f5d3a">→ 重新定位 · 封装 retry · 不缓存元素引用</text>

  <!-- footer -->
  <rect x="24" y="426" width="632" height="32" rx="7" fill="#fff8ef" stroke="#d98324"/>
  <text x="40" y="447" font-size="11.5" fill="#8a4b0f">排查口诀：先看报错类型定性 → 再看是时序、上下文还是选择器 → 最后才怀疑框架。绝大多数是时序。</text>
</svg>
