<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="470" fill="#f8fafc"/>
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fd0"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1f2d3d">Selenium Grid 拓扑与并行分发</text>

  <!-- 测试脚本/CI -->
  <rect x="40" y="70" width="150" height="56" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="115" y="94" font-size="13" text-anchor="middle" fill="#1f2d3d">测试脚本 / CI</text>
  <text x="115" y="112" font-size="11" text-anchor="middle" fill="#5b6b7b">多个 session 并发</text>

  <!-- Hub -->
  <rect x="270" y="60" width="140" height="76" rx="10" fill="#ffe0c2" stroke="#d98324"/>
  <text x="340" y="92" font-size="14" text-anchor="middle" fill="#1f2d3d" font-weight="bold">Grid Hub</text>
  <text x="340" y="112" font-size="11" text-anchor="middle" fill="#5b6b7b">分发 session</text>
  <text x="340" y="128" font-size="11" text-anchor="middle" fill="#5b6b7b">按 capability 路由</text>

  <!-- Nodes -->
  <rect x="500" y="40" width="150" height="60" rx="8" fill="#c8f0d0" stroke="#2f9e44"/>
  <text x="575" y="64" font-size="12" text-anchor="middle" fill="#1f2d3d">Node A · Chrome</text>
  <text x="575" y="82" font-size="11" text-anchor="middle" fill="#5b6b7b">Win / linux</text>

  <rect x="500" y="120" width="150" height="60" rx="8" fill="#c8f0d0" stroke="#2f9e44"/>
  <text x="575" y="144" font-size="12" text-anchor="middle" fill="#1f2d3d">Node B · Firefox</text>
  <text x="575" y="162" font-size="11" text-anchor="middle" fill="#5b6b7b">linux</text>

  <rect x="500" y="200" width="150" height="60" rx="8" fill="#c8f0d0" stroke="#2f9e44"/>
  <text x="575" y="224" font-size="12" text-anchor="middle" fill="#1f2d3d">Node C · Safari</text>
  <text x="575" y="242" font-size="11" text-anchor="middle" fill="#5b6b7b">mac</text>

  <!-- 横向边：脚本 -> Hub, Hub -> Nodes -->
  <line x1="190" y1="98" x2="268" y2="98" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="410" y1="90" x2="498" y2="66" stroke="#2f9e44" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="410" y1="98" x2="498" y2="148" stroke="#2f9e44" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="410" y1="110" x2="498" y2="228" stroke="#2f9e44" stroke-width="2" marker-end="url(#ar3)"/>

  <!-- 下方：单机多进程并行 对比 -->
  <text x="40" y="320" font-size="13" font-weight="bold" fill="#1f2d3d">对比：单机多进程并行（pytest-xdist）</text>
  <rect x="40" y="338" width="180" height="100" rx="8" fill="#ffffff" stroke="#1f2d3d"/>
  <text x="130" y="362" font-size="12" text-anchor="middle" fill="#1f2d3d">一个机器</text>
  <text x="130" y="382" font-size="11" text-anchor="middle" fill="#5b6b7b">多个 driver 进程</text>
  <text x="130" y="400" font-size="11" text-anchor="middle" fill="#5b6b7b">吃本机 CPU/内存</text>
  <text x="130" y="418" font-size="11" text-anchor="middle" fill="#5b6b7b">扩不了浏览器种类</text>

  <rect x="250" y="338" width="190" height="100" rx="8" fill="#ffffff" stroke="#1f2d3d"/>
  <text x="345" y="362" font-size="12" text-anchor="middle" fill="#1f2d3d">Selenium Grid</text>
  <text x="345" y="382" font-size="11" text-anchor="middle" fill="#5b6b7b">多机多浏览器</text>
  <text x="345" y="400" font-size="11" text-anchor="middle" fill="#5b6b7b">跨 OS / 跨浏览器</text>
  <text x="345" y="418" font-size="11" text-anchor="middle" fill="#5b6b7b">弹性扩容</text>

  <rect x="470" y="338" width="180" height="100" rx="8" fill="#ffffff" stroke="#1f2d3d"/>
  <text x="560" y="362" font-size="12" text-anchor="middle" fill="#1f2d3d">Playwright 并行</text>
  <text x="560" y="382" font-size="11" text-anchor="middle" fill="#5b6b7b">shard 分片</text>
  <text x="560" y="400" font-size="11" text-anchor="middle" fill="#5b6b7b">多进程 + Context 隔离</text>
  <text x="560" y="418" font-size="11" text-anchor="middle" fill="#5b6b7b">无需中心 Hub</text>

  <line x1="220" y1="388" x2="248" y2="388" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="440" y1="388" x2="468" y2="388" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ar3)"/>
</svg>
