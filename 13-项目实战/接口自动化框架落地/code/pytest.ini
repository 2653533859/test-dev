[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 注册标记，避免 PytestUnknownMarkWarning；也是 CI 分层触发的依据
markers =
    smoke: 冒烟用例，PR 阶段执行，要求 5 分钟内跑完
    p0: 核心链路，失败直接判定构建失败
    api: 接口全量用例，合入主干时执行
    flaky: 已知不稳定用例，移出门禁放到夜间执行

# 中文用例 ID 在 Allure 里不转义成 \uXXXX（选项名很劝退，但确实是官方选项）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

addopts =
    -ra
    --strict-markers
    --tb=short

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
