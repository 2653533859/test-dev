<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">接口自动化框架分层架构：上层只写业务，下层只管能力</text>

  <!-- L1 用例层 -->
  <rect x="30" y="52" width="430" height="58" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="46" y="76" font-size="14" font-weight="700" fill="#1e3a6f">① 用例层 tests/</text>
  <text x="46" y="98" font-size="12" fill="#1f2d3d">test_order.py · 只做「调业务方法 + 断言」，不出现 url / header / json 拼装</text>

  <!-- L2 业务封装层 -->
  <rect x="30" y="124" width="430" height="58" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="46" y="148" font-size="14" font-weight="700" fill="#1e3a6f">② 业务流层 flows/</text>
  <text x="46" y="170" font-size="12" fill="#1f2d3d">下单流程 = 登录 → 加购 → 结算 → 支付，串联多个接口对象并传递上下文</text>

  <!-- L3 接口对象层 -->
  <rect x="30" y="196" width="430" height="58" rx="8" fill="#ffe0c2" stroke="#d98324" stroke-width="1.5"/>
  <text x="46" y="220" font-size="14" font-weight="700" fill="#7c4a12">③ 接口对象层 apis/</text>
  <text x="46" y="242" font-size="12" fill="#1f2d3d">一个接口一个方法：路径、请求方法、必填参数、默认 header 就近收敛</text>

  <!-- L4 基础能力层 -->
  <rect x="30" y="268" width="430" height="76" rx="8" fill="#ffe0c2" stroke="#d98324" stroke-width="1.5"/>
  <text x="46" y="292" font-size="14" font-weight="700" fill="#7c4a12">④ 基础能力层 core/</text>
  <text x="46" y="313" font-size="12" fill="#1f2d3d">HttpClient（Session 复用 / 超时 / 重试）· 断言引擎 · JSONPath 提取</text>
  <text x="46" y="333" font-size="12" fill="#1f2d3d">日志埋点 · 加解密与签名 · 数据库校验 · 上下文变量池</text>

  <!-- L5 配置数据层 -->
  <rect x="30" y="358" width="430" height="58" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="46" y="382" font-size="14" font-weight="700" fill="#334155">⑤ 配置与数据层 config/ data/</text>
  <text x="46" y="404" font-size="12" fill="#1f2d3d">env.yaml 多环境 · YAML 用例数据 · 造数工厂 · 敏感信息走环境变量</text>

  <!-- 依赖箭头 -->
  <line x1="245" y1="110" x2="245" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="182" x2="245" y2="194" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="254" x2="245" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="344" x2="245" y2="356" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右侧横切关注点 -->
  <rect x="490" y="52" width="165" height="292" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="572" y="76" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">横切关注点</text>
  <text x="572" y="98" font-size="11.5" fill="#475569" text-anchor="middle">（conftest.py 注入）</text>

  <rect x="506" y="112" width="133" height="34" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="572" y="134" font-size="12" fill="#1e3a6f" text-anchor="middle">鉴权 token fixture</text>
  <rect x="506" y="154" width="133" height="34" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="572" y="176" font-size="12" fill="#1e3a6f" text-anchor="middle">环境切换 --env</text>
  <rect x="506" y="196" width="133" height="34" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="572" y="218" font-size="12" fill="#7c4a12" text-anchor="middle">Allure 步骤埋点</text>
  <rect x="506" y="238" width="133" height="34" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="572" y="260" font-size="12" fill="#7c4a12" text-anchor="middle">失败请求响应留档</text>
  <rect x="506" y="280" width="133" height="48" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="572" y="300" font-size="12" fill="#334155" text-anchor="middle">测试数据清理</text>
  <text x="572" y="318" font-size="12" fill="#334155" text-anchor="middle">（yield 后置）</text>

  <line x1="488" y1="198" x2="464" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 报告出口 -->
  <rect x="490" y="358" width="165" height="58" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="572" y="382" font-size="13" font-weight="700" fill="#1e3a6f" text-anchor="middle">Allure 报告 + CI</text>
  <text x="572" y="402" font-size="11.5" fill="#1f2d3d" text-anchor="middle">失败即通知 / 趋势留存</text>
  <line x1="464" y1="387" x2="486" y2="387" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="446" font-size="11.5" fill="#475569">分层准则：依赖只能自上而下；改一个接口字段只动 ③，换一套环境只动 ⑤，用例层永远不用改。</text>
  <text x="20" y="462" font-size="11.5" fill="#475569">反面案例：用例里直接 requests.post(url, json=...) —— 接口一改，几十个用例集体返工。</text>
</svg>
