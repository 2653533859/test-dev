<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="acd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fd0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">CI / 持续交付 / 持续部署：边界在哪一刀</text>

  <!-- stages -->
  <g>
    <rect x="18" y="66" width="96" height="56" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
    <text x="66" y="90" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">提交代码</text>
    <text x="66" y="108" font-size="10.5" fill="#5b7ea8" text-anchor="middle">push / PR</text>

    <rect x="130" y="66" width="96" height="56" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
    <text x="178" y="90" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">构建</text>
    <text x="178" y="108" font-size="10.5" fill="#5b7ea8" text-anchor="middle">编译 / 打包</text>

    <rect x="242" y="66" width="96" height="56" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
    <text x="290" y="90" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">单测 + 扫描</text>
    <text x="290" y="108" font-size="10.5" fill="#5b7ea8" text-anchor="middle">覆盖率 / Sonar</text>

    <rect x="354" y="66" width="96" height="56" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
    <text x="402" y="90" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">部署测试环境</text>
    <text x="402" y="108" font-size="10.5" fill="#5b7ea8" text-anchor="middle">Docker / K8s</text>

    <rect x="466" y="66" width="96" height="56" rx="8" fill="#ffe0c2" stroke="#d98324"/>
    <text x="514" y="90" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">自动化测试</text>
    <text x="514" y="108" font-size="10.5" fill="#b5762c" text-anchor="middle">接口 / UI / 报告</text>

    <rect x="578" y="66" width="84" height="56" rx="8" fill="#ffe0c2" stroke="#d98324"/>
    <text x="620" y="90" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">发布生产</text>
    <text x="620" y="108" font-size="10.5" fill="#b5762c" text-anchor="middle">上线</text>
  </g>

  <line x1="114" y1="94" x2="128" y2="94" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#acd)"/>
  <line x1="226" y1="94" x2="240" y2="94" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#acd)"/>
  <line x1="338" y1="94" x2="352" y2="94" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#acd)"/>
  <line x1="450" y1="94" x2="464" y2="94" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#acd)"/>
  <line x1="562" y1="94" x2="576" y2="94" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#acd)"/>

  <!-- scope brackets -->
  <path d="M22 146 L22 158 L334 158 L334 146" fill="none" stroke="#2f6fd0" stroke-width="1.6"/>
  <text x="178" y="178" font-size="12.5" font-weight="700" fill="#2f6fd0" text-anchor="middle">持续集成 CI</text>
  <text x="178" y="196" font-size="10.5" fill="#64748b" text-anchor="middle">每次提交都自动构建 + 自测，快速暴露集成问题</text>

  <path d="M22 214 L22 226 L558 226 L558 214" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <text x="290" y="246" font-size="12.5" font-weight="700" fill="#16a34a" text-anchor="middle">持续交付 CD（Delivery）</text>
  <text x="290" y="264" font-size="10.5" fill="#64748b" text-anchor="middle">产物随时「可发布」，但最后一步上线由人点按钮</text>

  <path d="M22 282 L22 294 L658 294 L658 282" fill="none" stroke="#d98324" stroke-width="1.6"/>
  <text x="340" y="314" font-size="12.5" font-weight="700" fill="#d98324" text-anchor="middle">持续部署 CD（Deployment）</text>
  <text x="340" y="332" font-size="10.5" fill="#64748b" text-anchor="middle">全链路无人工卡点，测试全绿即自动上线</text>

  <!-- gate -->
  <rect x="466" y="352" width="196" height="42" rx="8" fill="#fecaca" stroke="#dc2626"/>
  <text x="564" y="370" font-size="11.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">人工审批闸门</text>
  <text x="564" y="386" font-size="10.5" fill="#991b1b" text-anchor="middle">交付有它 / 部署没有它</text>
  <line x1="564" y1="340" x2="564" y2="350" stroke="#dc2626" stroke-width="1.5"/>

  <rect x="18" y="352" width="430" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="34" y="370" font-size="11.5" fill="#475569">失败即阻断：任一阶段红灯 → 流水线停下、通知责任人，</text>
  <text x="34" y="386" font-size="11.5" fill="#475569">不产出可发布产物。这是 CI 的核心价值，不是「跑个脚本」。</text>

  <text x="20" y="428" font-size="11.5" fill="#64748b">测试同学的位置：把自动化用例塞进「自动化测试」这格，并让它的结果真正决定流水线红绿。</text>
  <text x="20" y="448" font-size="11.5" fill="#64748b">判断题口诀：CI 看「合得进不进主干」，Delivery 看「随时能不能发」，Deployment 看「发不发要不要人点」。</text>
</svg>
