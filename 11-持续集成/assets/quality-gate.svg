<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="aqg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fd0"/>
    </marker>
    <marker id="aqr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">质量门禁阻断链路：不达标的代码进不了主干</text>

  <!-- main flow -->
  <rect x="18" y="56" width="110" height="46" rx="7" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="73" y="76" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">提 PR</text>
  <text x="73" y="93" font-size="10" fill="#5b7ea8" text-anchor="middle">feature → main</text>

  <line x1="128" y1="79" x2="146" y2="79" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#aqg)"/>

  <rect x="150" y="56" width="110" height="46" rx="7" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="205" y="76" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">构建 + 单测</text>
  <text x="205" y="93" font-size="10" fill="#5b7ea8" text-anchor="middle">生成覆盖率报告</text>

  <line x1="260" y1="79" x2="278" y2="79" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#aqg)"/>

  <rect x="282" y="56" width="110" height="46" rx="7" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="337" y="76" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">静态扫描</text>
  <text x="337" y="93" font-size="10" fill="#5b7ea8" text-anchor="middle">SonarQube</text>

  <line x1="392" y1="79" x2="410" y2="79" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#aqg)"/>

  <rect x="414" y="56" width="110" height="46" rx="7" fill="#ffe0c2" stroke="#d98324"/>
  <text x="469" y="76" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">自动化测试</text>
  <text x="469" y="93" font-size="10" fill="#b5762c" text-anchor="middle">接口 + UI 冒烟</text>

  <line x1="524" y1="79" x2="542" y2="79" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#aqg)"/>

  <rect x="546" y="56" width="116" height="46" rx="7" fill="#dcfce7" stroke="#16a34a"/>
  <text x="604" y="76" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">允许合并</text>
  <text x="604" y="93" font-size="10" fill="#166534" text-anchor="middle">Merge 按钮变绿</text>

  <!-- gate checks -->
  <rect x="18" y="132" width="644" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="34" y="156" font-size="13" font-weight="700" fill="#1f2d3d">四道闸门与判定阈值（任一红灯 → 整条流水线 FAILED）</text>

  <rect x="34" y="170" width="150" height="52" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="109" y="190" font-size="11.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">① 编译 / 依赖</text>
  <text x="109" y="208" font-size="10" fill="#5b7ea8" text-anchor="middle">构建失败即停</text>

  <rect x="196" y="170" width="150" height="52" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="271" y="190" font-size="11.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">② 单测覆盖率</text>
  <text x="271" y="208" font-size="10" fill="#5b7ea8" text-anchor="middle">新增代码 ≥ 80%</text>

  <rect x="358" y="170" width="150" height="52" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="433" y="190" font-size="11.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">③ 静态扫描</text>
  <text x="433" y="208" font-size="10" fill="#5b7ea8" text-anchor="middle">0 Blocker / 0 漏洞</text>

  <rect x="520" y="170" width="142" height="52" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="591" y="190" font-size="11.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">④ 自动化通过率</text>
  <text x="591" y="208" font-size="10" fill="#b5762c" text-anchor="middle">冒烟 100% / 回归 ≥ 95%</text>

  <text x="34" y="248" font-size="11.5" fill="#475569">增量优于全量：老项目别卡「整体覆盖率 80%」（永远达不到），改卡「本次改动的新增代码覆盖率」，可落地且不断收敛。</text>
  <text x="34" y="268" font-size="11.5" fill="#475569">阈值要写进配置文件（sonar-project.properties / pytest.ini / Jenkinsfile），不能靠人肉看报告——看报告的门禁等于没有门禁。</text>
  <text x="34" y="288" font-size="11.5" fill="#475569">冒烟必须 100%：冒烟用例挂了说明主流程断了，任何理由都不该放行。</text>

  <!-- block path -->
  <rect x="150" y="326" width="200" height="46" rx="7" fill="#fecaca" stroke="#dc2626"/>
  <text x="250" y="346" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">流水线 FAILED</text>
  <text x="250" y="363" font-size="10" fill="#991b1b" text-anchor="middle">exit code != 0</text>

  <line x1="250" y1="300" x2="250" y2="324" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aqr)"/>
  <text x="262" y="316" font-size="10.5" fill="#dc2626">不达标</text>

  <line x1="350" y1="349" x2="382" y2="349" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aqr)"/>
  <rect x="386" y="326" width="276" height="46" rx="7" fill="#ffffff" stroke="#dc2626"/>
  <text x="524" y="346" font-size="11.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">分支保护规则 Required status checks</text>
  <text x="524" y="363" font-size="10" fill="#991b1b" text-anchor="middle">Merge 按钮置灰 · 谁都点不了（含管理员）</text>

  <text x="20" y="404" font-size="11.5" fill="#64748b">关键一环：CI 报红只是「提示」，真正的阻断来自代码平台的分支保护——把 CI 任务设为 required check。</text>
  <text x="20" y="424" font-size="11.5" fill="#64748b">否则大家会习惯性无视红灯直接合并，门禁形同虚设。</text>
  <text x="20" y="444" font-size="11.5" fill="#64748b">配套动作：失败即通知责任人（提交人而非全员），并约定红灯修复优先级高于新需求。</text>
</svg>
