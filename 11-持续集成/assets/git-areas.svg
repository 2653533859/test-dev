<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="agf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fd0"/>
    </marker>
    <marker id="agb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98324"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="32" font-size="17" font-weight="700" fill="#1f2d3d">Git 四区模型：数据在哪、命令搬到哪</text>

  <!-- four areas -->
  <rect x="18"  y="60" width="145" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="90"  y="88"  font-size="13.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">工作区</text>
  <text x="90"  y="108" font-size="11.5" fill="#64748b" text-anchor="middle">Working Tree</text>
  <text x="90"  y="123" font-size="11" fill="#94a3b8" text-anchor="middle">你正在编辑的文件</text>

  <rect x="188" y="60" width="145" height="70" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="260" y="88"  font-size="13.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">暂存区</text>
  <text x="260" y="108" font-size="11.5" fill="#2f6fd0" text-anchor="middle">Index / Stage</text>
  <text x="260" y="123" font-size="11" fill="#5b7ea8" text-anchor="middle">下次提交的快照草稿</text>

  <rect x="358" y="60" width="145" height="70" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="430" y="88"  font-size="13.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">本地仓库</text>
  <text x="430" y="108" font-size="11.5" fill="#2f6fd0" text-anchor="middle">.git/objects</text>
  <text x="430" y="123" font-size="11" fill="#5b7ea8" text-anchor="middle">commit 对象 DAG</text>

  <rect x="528" y="60" width="134" height="70" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="595" y="88"  font-size="13.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">远程仓库</text>
  <text x="595" y="108" font-size="11.5" fill="#d98324" text-anchor="middle">origin</text>
  <text x="595" y="123" font-size="11" fill="#b5762c" text-anchor="middle">团队共享真相源</text>

  <!-- forward arrows -->
  <line x1="163" y1="80" x2="186" y2="80" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#agf)"/>
  <line x1="333" y1="80" x2="356" y2="80" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#agf)"/>
  <line x1="503" y1="80" x2="526" y2="80" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#agf)"/>
  <text x="174" y="52" font-size="11.5" fill="#2f6fd0" text-anchor="middle">add</text>
  <text x="344" y="52" font-size="11.5" fill="#2f6fd0" text-anchor="middle">commit</text>
  <text x="514" y="52" font-size="11.5" fill="#2f6fd0" text-anchor="middle">push</text>

  <!-- backward arrows -->
  <line x1="186" y1="112" x2="163" y2="112" stroke="#d98324" stroke-width="1.8" marker-end="url(#agb)"/>
  <line x1="356" y1="112" x2="333" y2="112" stroke="#d98324" stroke-width="1.8" marker-end="url(#agb)"/>
  <line x1="526" y1="112" x2="503" y2="112" stroke="#d98324" stroke-width="1.8" marker-end="url(#agb)"/>
  <text x="174" y="148" font-size="11" fill="#d98324" text-anchor="middle">restore</text>
  <text x="344" y="148" font-size="11" fill="#d98324" text-anchor="middle">reset</text>
  <text x="514" y="148" font-size="11" fill="#d98324" text-anchor="middle">fetch</text>

  <!-- stash -->
  <rect x="188" y="182" width="145" height="46" rx="8" fill="#ffffff" stroke="#d98324" stroke-dasharray="4 3"/>
  <text x="260" y="203" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">贮藏区 stash</text>
  <text x="260" y="219" font-size="11" fill="#b5762c" text-anchor="middle">临时挪走未完成改动</text>
  <line x1="120" y1="132" x2="200" y2="180" stroke="#d98324" stroke-width="1.5" marker-end="url(#agb)"/>
  <text x="118" y="172" font-size="11" fill="#d98324">stash push</text>
  <line x1="200" y1="228" x2="120" y2="250" stroke="#d98324" stroke-width="1.5" marker-end="url(#agb)"/>
  <text x="118" y="266" font-size="11" fill="#d98324">stash pop</text>

  <!-- status mapping -->
  <rect x="18" y="290" width="644" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="34" y="314" font-size="13" font-weight="700" fill="#1f2d3d">git status 的三种状态怎么对应四区</text>
  <rect x="34" y="328" width="180" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="124" y="348" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Untracked（从未 add）</text>
  <rect x="234" y="328" width="180" height="30" rx="5" fill="#ffe0c2" stroke="#d98324"/>
  <text x="324" y="348" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Modified（改了没 add）</text>
  <rect x="434" y="328" width="180" height="30" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="524" y="348" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Staged（add 了没 commit）</text>
  <text x="34" y="382" font-size="11.5" fill="#475569">git diff       → 工作区 vs 暂存区（改了但没 add 的部分）</text>
  <text x="34" y="399" font-size="11.5" fill="#475569">git diff --staged → 暂存区 vs HEAD（add 了但没 commit 的部分）</text>

  <text x="20" y="436" font-size="11.5" fill="#64748b">要点：commit 只把「暂存区」的快照封成对象，工作区里没 add 的改动永远进不了这次提交。</text>
  <text x="20" y="454" font-size="11.5" fill="#64748b">push 只搬 commit 对象，不搬工作区；所以「代码写完了但同事拉不到」十有八九是漏 add 或漏 push。</text>
</svg>
