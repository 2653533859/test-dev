<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arv" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">撤销三选一：reset 移指针 / revert 加反向提交</text>

  <!-- reset modes -->
  <rect x="18" y="48" width="644" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="34" y="72" font-size="13.5" font-weight="700" fill="#2f6fd0">git reset 三种模式动了谁</text>

  <rect x="120" y="86" width="120" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="180" y="106" font-size="11.5" fill="#1f2d3d" text-anchor="middle">HEAD 指针</text>
  <rect x="280" y="86" width="120" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="340" y="106" font-size="11.5" fill="#1f2d3d" text-anchor="middle">暂存区</text>
  <rect x="440" y="86" width="120" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="106" font-size="11.5" fill="#1f2d3d" text-anchor="middle">工作区</text>

  <text x="34" y="140" font-size="12" font-weight="700" fill="#d98324">--soft</text>
  <rect x="120" y="126" width="120" height="22" rx="4" fill="#ffe0c2" stroke="#d98324"/>
  <text x="180" y="141" font-size="11" fill="#1f2d3d" text-anchor="middle">回退</text>
  <text x="340" y="141" font-size="11" fill="#64748b" text-anchor="middle">不动</text>
  <text x="500" y="141" font-size="11" fill="#64748b" text-anchor="middle">不动</text>

  <text x="34" y="166" font-size="12" font-weight="700" fill="#2f6fd0">--mixed</text>
  <rect x="120" y="152" width="120" height="22" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="180" y="167" font-size="11" fill="#1f2d3d" text-anchor="middle">回退</text>
  <rect x="280" y="152" width="120" height="22" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="340" y="167" font-size="11" fill="#1f2d3d" text-anchor="middle">清空</text>
  <text x="500" y="167" font-size="11" fill="#64748b" text-anchor="middle">不动（默认）</text>

  <text x="34" y="192" font-size="12" font-weight="700" fill="#c2410c">--hard</text>
  <rect x="120" y="178" width="120" height="22" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="180" y="193" font-size="11" fill="#1f2d3d" text-anchor="middle">回退</text>
  <rect x="280" y="178" width="120" height="22" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="340" y="193" font-size="11" fill="#1f2d3d" text-anchor="middle">清空</text>
  <rect x="440" y="178" width="120" height="22" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="500" y="193" font-size="11" fill="#1f2d3d" text-anchor="middle">覆盖·改动丢失</text>

  <!-- reset graph -->
  <rect x="18" y="216" width="320" height="190" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="34" y="240" font-size="13" font-weight="700" fill="#2f6fd0">reset --hard B：历史被改写</text>
  <line x1="52" y1="300" x2="290" y2="300" stroke="#1f2d3d" stroke-width="2"/>
  <circle cx="52"  cy="300" r="12" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="52"  y="305" font-size="11" fill="#1f2d3d" text-anchor="middle">A</text>
  <circle cx="132" cy="300" r="12" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="132" y="305" font-size="11" fill="#1f2d3d" text-anchor="middle">B</text>
  <circle cx="212" cy="300" r="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="212" y="305" font-size="11" fill="#cbd5e1" text-anchor="middle">C</text>
  <circle cx="290" cy="300" r="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="290" y="305" font-size="11" fill="#cbd5e1" text-anchor="middle">D</text>
  <text x="132" y="270" font-size="11" fill="#2f6fd0" text-anchor="middle">HEAD</text>
  <line x1="212" y1="278" x2="146" y2="290" stroke="#64748b" stroke-width="1.4" marker-end="url(#arv)"/>
  <text x="251" y="332" font-size="10.5" fill="#94a3b8" text-anchor="middle">C、D 变悬空对象</text>
  <text x="34" y="366" font-size="11" fill="#475569">远程已有 C、D 时再 push 需 --force，</text>
  <text x="34" y="384" font-size="11" fill="#475569">会覆盖同事历史 → 团队分支禁用。</text>

  <!-- revert graph -->
  <rect x="352" y="216" width="310" height="190" rx="8" fill="#ffffff" stroke="#d98324"/>
  <text x="368" y="240" font-size="13" font-weight="700" fill="#d98324">revert D：历史只增不减</text>
  <line x1="386" y1="300" x2="630" y2="300" stroke="#1f2d3d" stroke-width="2"/>
  <circle cx="386" cy="300" r="12" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="386" y="305" font-size="11" fill="#1f2d3d" text-anchor="middle">B</text>
  <circle cx="466" cy="300" r="12" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="466" y="305" font-size="11" fill="#1f2d3d" text-anchor="middle">C</text>
  <circle cx="546" cy="300" r="12" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="546" y="305" font-size="11" fill="#1f2d3d" text-anchor="middle">D</text>
  <circle cx="626" cy="300" r="13" fill="#ffe0c2" stroke="#d98324" stroke-width="2"/>
  <text x="626" y="305" font-size="10.5" fill="#1f2d3d" text-anchor="middle">D⁻</text>
  <text x="626" y="336" font-size="10.5" fill="#b5762c" text-anchor="middle">反向补丁</text>
  <text x="368" y="366" font-size="11" fill="#475569">D 仍在历史里，D⁻ 抵消它的改动；</text>
  <text x="368" y="384" font-size="11" fill="#475569">可直接 push，是已共享提交的唯一正解。</text>

  <text x="20" y="432" font-size="11.5" fill="#64748b">选择口诀：改动还没 push → reset 随便用；已经 push 或别人已基于它开发 → 只能 revert。</text>
  <text x="20" y="452" font-size="11.5" fill="#64748b">误 reset --hard 后别慌：git reflog 能找回被丢弃的 commit（默认保留 90 天）。</text>
</svg>
