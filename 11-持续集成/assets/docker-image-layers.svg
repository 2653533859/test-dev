<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="adl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fd0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">镜像分层与容器可写层：为什么改 Dockerfile 顺序能提速</text>

  <!-- image layers -->
  <text x="20" y="60" font-size="13" font-weight="700" fill="#2f6fd0">镜像（只读层，自下而上叠加）</text>

  <rect x="30" y="220" width="260" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="160" y="242" font-size="11.5" fill="#1f2d3d" text-anchor="middle">FROM python:3.11-slim（基础层）</text>

  <rect x="30" y="182" width="260" height="34" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="160" y="204" font-size="11.5" fill="#1f2d3d" text-anchor="middle">COPY requirements.txt</text>

  <rect x="30" y="144" width="260" height="34" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="160" y="166" font-size="11.5" fill="#1f2d3d" text-anchor="middle">RUN pip install -r requirements.txt</text>

  <rect x="30" y="106" width="260" height="34" rx="4" fill="#ffe0c2" stroke="#d98324"/>
  <text x="160" y="128" font-size="11.5" fill="#1f2d3d" text-anchor="middle">COPY . /app（改动最频繁）</text>

  <rect x="30" y="68" width="260" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4 3"/>
  <text x="160" y="90" font-size="11.5" fill="#1f2d3d" text-anchor="middle">容器可写层（删容器即丢）</text>

  <text x="300" y="88"  font-size="10.5" fill="#16a34a">← 运行时产生的日志 / 报告写在这</text>
  <text x="300" y="126" font-size="10.5" fill="#d98324">← 代码一变，这层及以上缓存全失效</text>
  <text x="300" y="164" font-size="10.5" fill="#2f6fd0">← 放在代码之前，依赖不变就命中缓存</text>
  <text x="300" y="202" font-size="10.5" fill="#2f6fd0">← 只 COPY 依赖清单，不 COPY 全部代码</text>
  <text x="300" y="240" font-size="10.5" fill="#64748b">← 多个镜像共享同一基础层，只存一份</text>

  <!-- cache invalidation -->
  <rect x="18" y="272" width="644" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="34" y="294" font-size="13" font-weight="700" fill="#1f2d3d">构建缓存规则：某层失效 → 它上面的所有层全部重建</text>

  <rect x="34" y="306" width="150" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="109" y="325" font-size="11" fill="#1f2d3d" text-anchor="middle">依赖层 CACHED</text>
  <line x1="184" y1="320" x2="204" y2="320" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#adl)"/>
  <rect x="208" y="306" width="150" height="28" rx="5" fill="#ffe0c2" stroke="#d98324"/>
  <text x="283" y="325" font-size="11" fill="#1f2d3d" text-anchor="middle">代码层 REBUILD</text>
  <line x1="358" y1="320" x2="378" y2="320" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#adl)"/>
  <rect x="382" y="306" width="180" height="28" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="472" y="325" font-size="11" fill="#1f2d3d" text-anchor="middle">构建 10 秒完成</text>

  <text x="34" y="356" font-size="11.5" fill="#475569">若把 COPY . /app 写在 pip install 之前：改一行代码 → 依赖层失效 → 每次重装全部依赖，构建从 10 秒变 3 分钟。</text>

  <!-- image vs container -->
  <rect x="18" y="384" width="316" height="66" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="34" y="406" font-size="12.5" font-weight="700" fill="#2f6fd0">镜像 image</text>
  <text x="34" y="426" font-size="11" fill="#475569">只读模板 · 可分发 · 类比「类」</text>
  <text x="34" y="443" font-size="11" fill="#475569">同一镜像可起 N 个容器</text>

  <rect x="346" y="384" width="316" height="66" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="362" y="406" font-size="12.5" font-weight="700" fill="#16a34a">容器 container</text>
  <text x="362" y="426" font-size="11" fill="#475569">镜像 + 可写层 + 进程命名空间 · 类比「实例」</text>
  <text x="362" y="443" font-size="11" fill="#475569">数据要留存必须挂 volume</text>
</svg>
