<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="amr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">merge 与 rebase：同样的代码，不同的历史</text>

  <!-- before -->
  <text x="20" y="60" font-size="13" font-weight="700" fill="#475569">起点：feature 从 B 拉出，之后 main 又前进了 C、D</text>
  <line x1="70" y1="105" x2="290" y2="105" stroke="#1f2d3d" stroke-width="2"/>
  <circle cx="70"  cy="105" r="12" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="70"  y="110" font-size="11" fill="#1f2d3d" text-anchor="middle">A</text>
  <circle cx="150" cy="105" r="12" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="150" y="110" font-size="11" fill="#1f2d3d" text-anchor="middle">B</text>
  <circle cx="230" cy="105" r="12" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="230" y="110" font-size="11" fill="#1f2d3d" text-anchor="middle">C</text>
  <circle cx="300" cy="105" r="12" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="300" y="110" font-size="11" fill="#1f2d3d" text-anchor="middle">D</text>
  <text x="330" y="110" font-size="11.5" fill="#1f2d3d">main</text>

  <line x1="152" y1="118" x2="220" y2="152" stroke="#2f6fd0" stroke-width="2"/>
  <circle cx="230" cy="158" r="12" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="230" y="163" font-size="11" fill="#1f2d3d" text-anchor="middle">X</text>
  <line x1="242" y1="158" x2="288" y2="158" stroke="#2f6fd0" stroke-width="2"/>
  <circle cx="300" cy="158" r="12" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="300" y="163" font-size="11" fill="#1f2d3d" text-anchor="middle">Y</text>
  <text x="330" y="163" font-size="11.5" fill="#2f6fd0">feature</text>

  <!-- merge -->
  <rect x="18" y="200" width="320" height="200" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="34" y="226" font-size="13.5" font-weight="700" fill="#2f6fd0">git merge feature</text>
  <text x="34" y="246" font-size="11.5" fill="#64748b">保留分叉，多产生一个合并提交 M</text>

  <line x1="52" y1="300" x2="200" y2="300" stroke="#1f2d3d" stroke-width="2"/>
  <circle cx="52"  cy="300" r="11" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="52"  y="305" font-size="10.5" fill="#1f2d3d" text-anchor="middle">B</text>
  <circle cx="126" cy="300" r="11" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="126" y="305" font-size="10.5" fill="#1f2d3d" text-anchor="middle">C</text>
  <circle cx="200" cy="300" r="11" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="200" y="305" font-size="10.5" fill="#1f2d3d" text-anchor="middle">D</text>

  <line x1="54" y1="311" x2="115" y2="342" stroke="#2f6fd0" stroke-width="2"/>
  <circle cx="126" cy="348" r="11" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="126" y="353" font-size="10.5" fill="#1f2d3d" text-anchor="middle">X</text>
  <line x1="137" y1="348" x2="189" y2="348" stroke="#2f6fd0" stroke-width="2"/>
  <circle cx="200" cy="348" r="11" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="200" y="353" font-size="10.5" fill="#1f2d3d" text-anchor="middle">Y</text>

  <line x1="211" y1="300" x2="266" y2="318" stroke="#d98324" stroke-width="2"/>
  <line x1="211" y1="348" x2="266" y2="330" stroke="#d98324" stroke-width="2"/>
  <circle cx="280" cy="324" r="13" fill="#ffe0c2" stroke="#d98324" stroke-width="2"/>
  <text x="280" y="329" font-size="10.5" fill="#1f2d3d" text-anchor="middle">M</text>
  <text x="252" y="382" font-size="10.5" fill="#b5762c">M 有两个父提交</text>

  <!-- rebase -->
  <rect x="352" y="200" width="310" height="200" rx="8" fill="#ffffff" stroke="#d98324"/>
  <text x="368" y="226" font-size="13.5" font-weight="700" fill="#d98324">git rebase main</text>
  <text x="368" y="246" font-size="11.5" fill="#64748b">把 X、Y 重放到 D 之后，历史变直线</text>

  <line x1="386" y1="320" x2="630" y2="320" stroke="#1f2d3d" stroke-width="2"/>
  <circle cx="386" cy="320" r="11" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="386" y="325" font-size="10.5" fill="#1f2d3d" text-anchor="middle">B</text>
  <circle cx="446" cy="320" r="11" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="446" y="325" font-size="10.5" fill="#1f2d3d" text-anchor="middle">C</text>
  <circle cx="506" cy="320" r="11" fill="#ffffff" stroke="#1f2d3d" stroke-width="2"/>
  <text x="506" y="325" font-size="10.5" fill="#1f2d3d" text-anchor="middle">D</text>
  <circle cx="566" cy="320" r="11" fill="#ffe0c2" stroke="#d98324" stroke-width="2"/>
  <text x="566" y="325" font-size="10.5" fill="#1f2d3d" text-anchor="middle">X'</text>
  <circle cx="626" cy="320" r="11" fill="#ffe0c2" stroke="#d98324" stroke-width="2"/>
  <text x="626" y="325" font-size="10.5" fill="#1f2d3d" text-anchor="middle">Y'</text>

  <text x="566" y="360" font-size="10.5" fill="#b5762c" text-anchor="middle">新 commit</text>
  <text x="566" y="376" font-size="10.5" fill="#b5762c" text-anchor="middle">SHA 变了</text>
  <line x1="566" y1="290" x2="566" y2="306" stroke="#64748b" stroke-width="1.4" marker-end="url(#amr)"/>
  <text x="566" y="284" font-size="10.5" fill="#64748b" text-anchor="middle">X 被复制重放</text>

  <!-- bottom rule -->
  <rect x="18" y="414" width="644" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="34" y="432" font-size="11.5" fill="#475569">黄金法则：只对「没推到远程、没人基于它开发」的提交做 rebase；已共享的历史一律 merge。</text>
  <text x="34" y="450" font-size="11.5" fill="#475569">团队常用组合：本地 feature 用 rebase 保持线性，合入 main 用 merge --no-ff 留下合入记录。</text>
</svg>
