<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">测试金字塔：越往上越贵、越慢、越脆</text>

  <!-- pyramid -->
  <polygon points="230,60 300,60 340,130 190,130" fill="#ffe0c2" stroke="#d98324" stroke-width="1.5"/>
  <text x="265" y="100" font-size="14" font-weight="700" fill="#8a4b06" text-anchor="middle">UI / E2E</text>

  <polygon points="190,138 340,138 380,218 150,218" fill="#fef3c7" stroke="#d98324" stroke-width="1.5"/>
  <text x="265" y="175" font-size="14" font-weight="700" fill="#8a4b06" text-anchor="middle">接口 / 集成测试</text>
  <text x="265" y="196" font-size="11.5" fill="#92400e" text-anchor="middle">服务契约、组件协作</text>

  <polygon points="150,226 380,226 430,340 100,340" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="265" y="272" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">单元测试</text>
  <text x="265" y="294" font-size="11.5" fill="#1e40af" text-anchor="middle">函数级、毫秒级、开发自测</text>
  <text x="265" y="316" font-size="11.5" fill="#1e40af" text-anchor="middle">数量最多 · 70%</text>

  <!-- axes -->
  <line x1="470" y1="330" x2="470" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="484" y="86" font-size="12.5" fill="#1f2d3d">用例单价 ↑</text>
  <text x="484" y="106" font-size="12.5" fill="#1f2d3d">执行耗时 ↑</text>
  <text x="484" y="126" font-size="12.5" fill="#1f2d3d">维护成本 ↑</text>
  <text x="484" y="146" font-size="12.5" fill="#1f2d3d">Flaky 概率 ↑</text>
  <text x="484" y="166" font-size="12.5" fill="#1f2d3d">定位难度 ↑</text>

  <line x1="620" y1="70" x2="620" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="290" font-size="12.5" fill="#1f2d3d">用例数量 ↑</text>
  <text x="530" y="310" font-size="12.5" fill="#1f2d3d">反馈速度 ↑</text>

  <!-- ratio labels -->
  <text x="352" y="98" font-size="11.5" fill="#8a4b06">10%</text>
  <text x="392" y="180" font-size="11.5" fill="#8a4b06">20%</text>

  <!-- anti pattern -->
  <rect x="20" y="360" width="300" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="36" y="382" font-size="13" font-weight="700" fill="#991b1b">反模式：冰淇淋筒</text>
  <text x="36" y="404" font-size="11.5" fill="#7f1d1d">UI 用例最多 → 一次回归跑几小时</text>
  <text x="36" y="424" font-size="11.5" fill="#7f1d1d">失败原因分不清是 bug 还是环境抖动</text>
  <text x="36" y="444" font-size="11.5" fill="#7f1d1d">最终没人看红灯，用例被整体跳过</text>

  <rect x="340" y="360" width="320" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="356" y="382" font-size="13" font-weight="700" fill="#166534">正确姿势</text>
  <text x="356" y="404" font-size="11.5" fill="#14532d">能在下层验的逻辑，绝不放到上层验</text>
  <text x="356" y="424" font-size="11.5" fill="#14532d">UI 只留核心业务主流程（冒烟）</text>
  <text x="356" y="444" font-size="11.5" fill="#14532d">接口层承接绝大部分业务规则校验</text>
</svg>
