<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">unittest 执行生命周期：三层前后置的嵌套顺序</text>

  <!-- module level -->
  <rect x="24" y="48" width="632" height="330" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="40" y="70" font-size="13" font-weight="700" fill="#334155">模块级 setUpModule()</text>
  <text x="40" y="366" font-size="13" font-weight="700" fill="#334155">模块级 tearDownModule()</text>

  <!-- class level -->
  <rect x="52" y="82" width="576" height="266" rx="10" fill="#ffe0c2" stroke="#d98324"/>
  <text x="68" y="104" font-size="13" font-weight="700" fill="#8a4b06">类级 setUpClass()  —— @classmethod，整个类只跑一次</text>
  <text x="68" y="336" font-size="13" font-weight="700" fill="#8a4b06">类级 tearDownClass()</text>

  <!-- case 1 -->
  <rect x="80" y="118" width="520" height="96" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="96" y="140" font-size="12.5" font-weight="700" fill="#1e40af">setUp()  → test_add()  → tearDown()</text>
  <rect x="96" y="150" width="150" height="30" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="171" y="170" font-size="12" fill="#1e40af" text-anchor="middle">setUp 建资源</text>
  <rect x="266" y="150" width="150" height="30" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="341" y="170" font-size="12" fill="#1e40af" text-anchor="middle">test_add 断言</text>
  <rect x="436" y="150" width="150" height="30" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="511" y="170" font-size="12" fill="#1e40af" text-anchor="middle">tearDown 清理</text>
  <line x1="246" y1="165" x2="264" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="416" y1="165" x2="434" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="96" y="202" font-size="11.5" fill="#1e40af">测试方法抛异常时 tearDown 仍会执行；setUp 抛异常则该用例记 Error 且 tearDown 不执行</text>

  <!-- case 2 -->
  <rect x="80" y="226" width="520" height="96" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="96" y="248" font-size="12.5" font-weight="700" fill="#1e40af">setUp()  → test_sub()  → tearDown()</text>
  <rect x="96" y="258" width="150" height="30" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="171" y="278" font-size="12" fill="#1e40af" text-anchor="middle">全新实例</text>
  <rect x="266" y="258" width="150" height="30" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="341" y="278" font-size="12" fill="#1e40af" text-anchor="middle">test_sub 断言</text>
  <rect x="436" y="258" width="150" height="30" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="511" y="278" font-size="12" fill="#1e40af" text-anchor="middle">tearDown 清理</text>
  <line x1="246" y1="273" x2="264" y2="273" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="416" y1="273" x2="434" y2="273" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="96" y="310" font-size="11.5" fill="#1e40af">关键：每个 test_ 方法都会 new 一个 TestCase 实例，self 上的状态无法跨用例传递</text>

  <line x1="340" y1="214" x2="340" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bottom notes -->
  <rect x="24" y="392" width="310" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="40" y="414" font-size="12.5" font-weight="700" fill="#166534">addCleanup(fn) 更可靠</text>
  <text x="40" y="434" font-size="11.5" fill="#14532d">注册即生效，setUp 中途失败也会回收</text>

  <rect x="348" y="392" width="308" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="364" y="414" font-size="12.5" font-weight="700" fill="#991b1b">用例执行顺序 = 方法名 ASCII 排序</text>
  <text x="364" y="434" font-size="11.5" fill="#7f1d1d">test_10 排在 test_2 前面，别依赖顺序</text>
</svg>
