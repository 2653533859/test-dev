<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">多环境配置：命令行 → 环境变量 → 环境文件 → 默认值</text>

  <!-- priority chain -->
  <rect x="20" y="50" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="95" y="74" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">① 命令行（最高）</text>
  <text x="95" y="94" font-size="11.5" fill="#166534" text-anchor="middle">pytest --env=uat</text>

  <rect x="190" y="50" width="150" height="60" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="265" y="74" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">② 环境变量</text>
  <text x="265" y="94" font-size="11.5" fill="#1e40af" text-anchor="middle">TEST_ENV=uat（CI 注入）</text>

  <rect x="360" y="50" width="150" height="60" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="435" y="74" font-size="12.5" font-weight="700" fill="#8a4b06" text-anchor="middle">③ 环境配置文件</text>
  <text x="435" y="94" font-size="11.5" fill="#8a4b06" text-anchor="middle">config/uat.yaml</text>

  <rect x="530" y="50" width="130" height="60" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="595" y="74" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">④ 默认值</text>
  <text x="595" y="94" font-size="11.5" fill="#1f2d3d" text-anchor="middle">config/base.yaml</text>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="80" x2="188" y2="80"/>
    <line x1="340" y1="80" x2="358" y2="80"/>
    <line x1="510" y1="80" x2="528" y2="80"/>
  </g>
  <text x="20" y="130" font-size="11.5" fill="#64748b">读取顺序从左往右「找不到才往下找」，即左边优先级最高；深合并（deep merge）时右边只补左边缺的键</text>

  <!-- resolution flow -->
  <rect x="20" y="148" width="200" height="46" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="120" y="176" font-size="12.5" fill="#1e40af" text-anchor="middle">conftest: pytest_addoption</text>

  <rect x="20" y="212" width="200" height="46" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="120" y="240" font-size="12.5" fill="#1e40af" text-anchor="middle">session fixture 解析配置</text>

  <rect x="20" y="276" width="200" height="46" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="120" y="304" font-size="12.5" fill="#8a4b06" text-anchor="middle">生成 Settings 对象（冻结）</text>

  <rect x="20" y="340" width="200" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="120" y="368" font-size="12.5" fill="#166534" text-anchor="middle">注入 api/pages/data 各层</text>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="194" x2="120" y2="210"/>
    <line x1="120" y1="258" x2="120" y2="274"/>
    <line x1="120" y1="322" x2="120" y2="338"/>
  </g>

  <!-- config content -->
  <rect x="244" y="148" width="416" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="260" y="170" font-size="12.5" font-weight="700" fill="#1f2d3d">config/uat.yaml —— 只放「随环境变化」的东西</text>
  <text x="260" y="192" font-size="11.5" fill="#1f2d3d">base_url: https://uat-api.example.com</text>
  <text x="260" y="210" font-size="11.5" fill="#1f2d3d">db: {host: uat-db, port: 3306, name: shop}</text>
  <text x="260" y="228" font-size="11.5" fill="#1f2d3d">timeout: 10</text>
  <text x="260" y="246" font-size="11.5" fill="#dc2626">account: {user: qa01, pwd: ${QA_PWD}}   ← 密码走环境变量占位</text>
  <text x="260" y="262" font-size="11" fill="#64748b">业务规则、断言期望值不属于环境配置，别混进来</text>

  <rect x="244" y="280" width="416" height="106" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="260" y="302" font-size="13" font-weight="700" fill="#991b1b">环境隔离红线</text>
  <text x="260" y="324" font-size="11.5" fill="#7f1d1d">· 明文密码/密钥进 Git → 一律用环境变量或 CI 凭据注入</text>
  <text x="260" y="344" font-size="11.5" fill="#7f1d1d">· 默认环境设成 prod → 手滑一条命令就在生产造数据；默认必须是 test</text>
  <text x="260" y="364" font-size="11.5" fill="#7f1d1d">· 模块级 `CONFIG = load("dev")` 在 import 期就固化 → --env 失效</text>
  <text x="260" y="380" font-size="11" fill="#7f1d1d">· 生产环境执行前加二次确认（--env=prod 需配合 --i-know-what-i-do）</text>

  <rect x="20" y="400" width="640" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="36" y="422" font-size="12.5" fill="#1f2d3d">自查：`pytest --env=uat --collect-only` 时把最终生效的 base_url 打到日志头部，报告第一行就能看出跑的哪套环境</text>
  <text x="36" y="442" font-size="12.5" fill="#1f2d3d">Allure 的 environment.properties 也写一份，报告里可追溯本次执行的环境与版本</text>
</svg>
