<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">数据驱动：数据与逻辑分离，加用例 = 加一行数据</text>

  <!-- sources -->
  <rect x="20" y="52" width="140" height="42" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="90" y="78" font-size="12.5" fill="#8a4b06" text-anchor="middle">login.yaml</text>

  <rect x="20" y="106" width="140" height="42" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="90" y="132" font-size="12.5" fill="#8a4b06" text-anchor="middle">cases.xlsx</text>

  <rect x="20" y="160" width="140" height="42" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="90" y="186" font-size="12.5" fill="#8a4b06" text-anchor="middle">order.json</text>

  <!-- loader -->
  <rect x="200" y="90" width="150" height="74" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="275" y="114" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">数据加载器</text>
  <text x="275" y="134" font-size="11.5" fill="#1e40af" text-anchor="middle">utils/data_loader.py</text>
  <text x="275" y="152" font-size="11.5" fill="#1e40af" text-anchor="middle">统一返回 list[dict]</text>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="160" y1="73" x2="198" y2="106"/>
    <line x1="160" y1="127" x2="198" y2="127"/>
    <line x1="160" y1="181" x2="198" y2="148"/>
  </g>

  <!-- render -->
  <rect x="390" y="90" width="140" height="74" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="460" y="114" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">变量渲染</text>
  <text x="460" y="134" font-size="11.5" fill="#1e40af" text-anchor="middle">${env}、${token}</text>
  <text x="460" y="152" font-size="11.5" fill="#1e40af" text-anchor="middle">造数函数 ${phone()}</text>

  <rect x="560" y="90" width="100" height="74" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="120" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">parametrize</text>
  <text x="610" y="142" font-size="11.5" fill="#166534" text-anchor="middle">N 条用例</text>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="350" y1="127" x2="388" y2="127"/>
    <line x1="530" y1="127" x2="558" y2="127"/>
  </g>

  <!-- yaml sample -->
  <rect x="20" y="196" width="330" height="160" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="36" y="218" font-size="12.5" font-weight="700" fill="#1f2d3d">一条数据长什么样（YAML）</text>
  <text x="36" y="240" font-size="11.5" fill="#8a4b06">- name: 密码错误应返回 401</text>
  <text x="36" y="258" font-size="11.5" fill="#1f2d3d">  request:</text>
  <text x="36" y="276" font-size="11.5" fill="#1f2d3d">    json: {user: admin, pwd: wrong}</text>
  <text x="36" y="294" font-size="11.5" fill="#2f6fd0">  expected:</text>
  <text x="36" y="312" font-size="11.5" fill="#2f6fd0">    status_code: 401</text>
  <text x="36" y="330" font-size="11.5" fill="#2f6fd0">    jsonpath: {"$.code": 10001}</text>
  <text x="36" y="350" font-size="11" fill="#64748b">name 用作 pytest ids，报告里直接可读</text>

  <!-- rules -->
  <rect x="366" y="196" width="294" height="160" rx="8" fill="#eff6ff" stroke="#2f6fd0"/>
  <text x="382" y="218" font-size="12.5" font-weight="700" fill="#1e40af">三种载体怎么选</text>
  <text x="382" y="242" font-size="11.5" fill="#1e40af">YAML：结构化、可读、能写注释 → 首选</text>
  <text x="382" y="264" font-size="11.5" fill="#1e40af">Excel：业务方要参与维护时用（openpyxl）</text>
  <text x="382" y="286" font-size="11.5" fill="#1e40af">JSON：接口报文原样存、字段极多时用</text>
  <text x="382" y="312" font-size="11.5" fill="#64748b">共同要求：期望结果必须写进数据文件，</text>
  <text x="382" y="330" font-size="11.5" fill="#64748b">而不是硬编码在用例里，否则只做到了</text>
  <text x="382" y="348" font-size="11.5" fill="#64748b">「入参驱动」，不是数据驱动</text>

  <rect x="20" y="368" width="640" height="84" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="36" y="390" font-size="13" font-weight="700" fill="#991b1b">典型踩坑</text>
  <text x="36" y="412" font-size="11.5" fill="#7f1d1d">· 数据文件路径写相对路径 → 换目录执行就 FileNotFoundError，要用 `Path(__file__).parent`</text>
  <text x="36" y="430" font-size="11.5" fill="#7f1d1d">· YAML 里 `pwd: 123456` 被解析成 int、`no` 被解析成 False → 强制加引号</text>
  <text x="36" y="448" font-size="11.5" fill="#7f1d1d">· 数据文件语法错误发生在收集期 → 整个模块收集失败，报错看着和用例无关</text>
</svg>
