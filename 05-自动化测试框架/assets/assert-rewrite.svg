<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">assert 重写：import 时改 AST，把中间值存下来</text>

  <!-- pipeline -->
  <rect x="20" y="50" width="130" height="60" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="85" y="74" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">源码 test_x.py</text>
  <text x="85" y="94" font-size="11.5" fill="#1e40af" text-anchor="middle">assert a == b</text>

  <rect x="176" y="50" width="150" height="60" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="251" y="74" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">import hook 拦截</text>
  <text x="251" y="94" font-size="11.5" fill="#1e40af" text-anchor="middle">AssertionRewritingHook</text>

  <rect x="352" y="50" width="150" height="60" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="427" y="74" font-size="12.5" font-weight="700" fill="#8a4b06" text-anchor="middle">AST 改写</text>
  <text x="427" y="94" font-size="11.5" fill="#8a4b06" text-anchor="middle">拆分子表达式并暂存</text>

  <rect x="528" y="50" width="132" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="594" y="74" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">写入 .pyc 缓存</text>
  <text x="594" y="94" font-size="11.5" fill="#166534" text-anchor="middle">__pycache__</text>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="80" x2="174" y2="80"/>
    <line x1="326" y1="80" x2="350" y2="80"/>
    <line x1="502" y1="80" x2="526" y2="80"/>
  </g>

  <!-- before / after -->
  <text x="20" y="146" font-size="14" font-weight="700" fill="#0f172a">改写前后（示意）</text>

  <rect x="20" y="160" width="310" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="36" y="182" font-size="12.5" font-weight="700" fill="#1f2d3d">你写的</text>
  <text x="36" y="206" font-size="12" fill="#1f2d3d">def test_sum():</text>
  <text x="36" y="226" font-size="12" fill="#1f2d3d">    got = calc(2, 3)</text>
  <text x="36" y="246" font-size="12" fill="#1f2d3d">    assert got == 6</text>
  <text x="36" y="270" font-size="11.5" fill="#64748b">原生 Python 只会抛 AssertionError（无信息）</text>

  <rect x="350" y="160" width="310" height="120" rx="8" fill="#fff7ed" stroke="#d98324"/>
  <text x="366" y="182" font-size="12.5" font-weight="700" fill="#8a4b06">pytest 实际执行的</text>
  <text x="366" y="206" font-size="12" fill="#8a4b06">@py_assert1 = got</text>
  <text x="366" y="226" font-size="12" fill="#8a4b06">@py_assert3 = (@py_assert1 == 6)</text>
  <text x="366" y="246" font-size="12" fill="#8a4b06">if not @py_assert3: raise 带上下文</text>
  <text x="366" y="270" font-size="11.5" fill="#8a4b06">中间值被绑到临时变量，失败时可回读</text>

  <line x1="330" y1="220" x2="348" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect x="20" y="296" width="640" height="86" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="36" y="318" font-size="13" font-weight="700" fill="#991b1b">最终报错（自动生成的 introspection 输出）</text>
  <text x="36" y="340" font-size="12" fill="#7f1d1d">E   assert 5 == 6</text>
  <text x="36" y="360" font-size="12" fill="#7f1d1d">E    +  where 5 = calc(2, 3)</text>
  <text x="380" y="340" font-size="11.5" fill="#7f1d1d">这就是 pytest 不需要</text>
  <text x="380" y="360" font-size="11.5" fill="#7f1d1d">assertEqual 家族的原因</text>

  <!-- pitfalls -->
  <rect x="20" y="396" width="640" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="36" y="418" font-size="12.5" fill="#1f2d3d">边界：只重写「测试模块 + conftest.py + 已注册插件」。工具层 utils/ 里的 assert 不会被重写，看不到中间值</text>
  <text x="36" y="438" font-size="12.5" fill="#1f2d3d">解法：`pytest.register_assert_rewrite("utils.checker")` 必须在 import 该模块之前调用（放 conftest 顶部）</text>
</svg>
