<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">conftest.py：按目录层级向上生效，就近覆盖</text>

  <!-- directory tree -->
  <rect x="20" y="48" width="330" height="240" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="36" y="70" font-size="13" font-weight="700" fill="#1f2d3d">目录结构</text>
  <text x="36" y="94" font-size="12" fill="#1f2d3d">project/</text>
  <text x="36" y="114" font-size="12" fill="#2f6fd0">├── conftest.py        ① 全局</text>
  <text x="36" y="134" font-size="12" fill="#1f2d3d">└── tests/</text>
  <text x="36" y="154" font-size="12" fill="#2f6fd0">    ├── conftest.py    ② 测试层</text>
  <text x="36" y="174" font-size="12" fill="#1f2d3d">    ├── api/</text>
  <text x="36" y="194" font-size="12" fill="#d98324">    │   ├── conftest.py  ③ 接口层</text>
  <text x="36" y="214" font-size="12" fill="#16a34a">    │   └── test_login.py</text>
  <text x="36" y="234" font-size="12" fill="#1f2d3d">    └── web/</text>
  <text x="36" y="254" font-size="12" fill="#d98324">        ├── conftest.py  ④ UI 层</text>
  <text x="36" y="274" font-size="12" fill="#16a34a">        └── test_home.py</text>

  <!-- visibility -->
  <rect x="366" y="48" width="294" height="240" rx="8" fill="#eff6ff" stroke="#2f6fd0"/>
  <text x="382" y="70" font-size="13" font-weight="700" fill="#1e40af">test_login.py 能看到的 fixture</text>
  <rect x="382" y="82" width="262" height="30" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="513" y="102" font-size="12" fill="#1e40af" text-anchor="middle">① 根 conftest（全局）</text>
  <rect x="382" y="120" width="262" height="30" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="513" y="140" font-size="12" fill="#1e40af" text-anchor="middle">② tests/conftest</text>
  <rect x="382" y="158" width="262" height="30" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="513" y="178" font-size="12" fill="#8a4b06" text-anchor="middle">③ tests/api/conftest（自己目录）</text>
  <rect x="382" y="196" width="262" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="513" y="216" font-size="12" fill="#991b1b" text-anchor="middle">④ tests/web/conftest ✗ 看不到</text>
  <text x="382" y="248" font-size="11.5" fill="#1e40af">规则：只向「祖先目录」查找，兄弟目录互不可见</text>
  <text x="382" y="268" font-size="11.5" fill="#1e40af">同名 fixture：离用例最近的那个胜出（覆盖）</text>

  <!-- load order -->
  <text x="20" y="318" font-size="14" font-weight="700" fill="#0f172a">加载与执行顺序</text>

  <rect x="20" y="332" width="120" height="46" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="80" y="360" font-size="12" fill="#1e40af" text-anchor="middle">① 根 conftest</text>
  <rect x="164" y="332" width="120" height="46" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="224" y="360" font-size="12" fill="#1e40af" text-anchor="middle">② tests/conftest</text>
  <rect x="308" y="332" width="130" height="46" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="373" y="360" font-size="12" fill="#8a4b06" text-anchor="middle">③ api/conftest</text>
  <rect x="462" y="332" width="130" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="527" y="360" font-size="12" fill="#166534" text-anchor="middle">④ 测试模块</text>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="140" y1="355" x2="162" y2="355"/>
    <line x1="284" y1="355" x2="306" y2="355"/>
    <line x1="438" y1="355" x2="460" y2="355"/>
  </g>

  <rect x="20" y="396" width="640" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="36" y="418" font-size="12.5" fill="#1f2d3d">conftest.py 不需要 import，pytest 自动发现；反过来说，也**不要**手动 `from conftest import xxx`（会重复加载）</text>
  <text x="36" y="438" font-size="12.5" fill="#1f2d3d">插件级 hook（如 `pytest_addoption`）只在 rootdir 的顶层 conftest.py 中生效，写在子目录会报 unknown option</text>
</svg>
