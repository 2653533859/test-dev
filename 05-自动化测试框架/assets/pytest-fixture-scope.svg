<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">fixture 四种作用域：套娃式的创建与销毁时机</text>

  <!-- session -->
  <rect x="24" y="46" width="632" height="300" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="40" y="68" font-size="13" font-weight="700" fill="#334155">scope="session" ── 整次 pytest 运行只建一次（如 DB 连接池、登录 token）</text>

  <!-- module A -->
  <rect x="44" y="82" width="300" height="246" rx="10" fill="#ffe0c2" stroke="#d98324"/>
  <text x="60" y="104" font-size="12.5" font-weight="700" fill="#8a4b06">scope="module" ── test_api.py</text>

  <rect x="60" y="116" width="268" height="96" rx="8" fill="#fff7ed" stroke="#d98324"/>
  <text x="76" y="138" font-size="12" font-weight="700" fill="#8a4b06">scope="class" ── TestLogin</text>
  <rect x="76" y="148" width="236" height="26" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="194" y="166" font-size="11.5" fill="#1e40af" text-anchor="middle">function: test_ok</text>
  <rect x="76" y="178" width="236" height="26" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="194" y="196" font-size="11.5" fill="#1e40af" text-anchor="middle">function: test_wrong_pwd</text>

  <rect x="60" y="222" width="268" height="94" rx="8" fill="#fff7ed" stroke="#d98324"/>
  <text x="76" y="244" font-size="12" font-weight="700" fill="#8a4b06">scope="class" ── TestOrder</text>
  <rect x="76" y="254" width="236" height="26" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="194" y="272" font-size="11.5" fill="#1e40af" text-anchor="middle">function: test_create</text>
  <rect x="76" y="284" width="236" height="26" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="194" y="302" font-size="11.5" fill="#1e40af" text-anchor="middle">function: test_cancel</text>

  <!-- module B -->
  <rect x="360" y="82" width="280" height="246" rx="10" fill="#ffe0c2" stroke="#d98324"/>
  <text x="376" y="104" font-size="12.5" font-weight="700" fill="#8a4b06">scope="module" ── test_web.py</text>
  <text x="376" y="128" font-size="11.5" fill="#8a4b06">切换模块时 module 级 fixture 销毁重建</text>
  <rect x="376" y="140" width="248" height="26" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="500" y="158" font-size="11.5" fill="#1e40af" text-anchor="middle">function: test_home</text>

  <rect x="376" y="182" width="248" height="134" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="392" y="204" font-size="12.5" font-weight="700" fill="#1f2d3d">yield 前后置</text>
  <text x="392" y="226" font-size="11.5" fill="#1f2d3d">@pytest.fixture(scope="module")</text>
  <text x="392" y="244" font-size="11.5" fill="#1f2d3d">def driver():</text>
  <text x="392" y="262" font-size="11.5" fill="#16a34a">    d = webdriver.Chrome()   # setup</text>
  <text x="392" y="280" font-size="11.5" fill="#2f6fd0">    yield d                  # 交给用例</text>
  <text x="392" y="298" font-size="11.5" fill="#dc2626">    d.quit()                 # teardown</text>

  <line x1="344" y1="200" x2="358" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- rules -->
  <rect x="20" y="360" width="315" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="36" y="382" font-size="12.5" font-weight="700" fill="#166534">选型口诀</text>
  <text x="36" y="402" font-size="11.5" fill="#14532d">建得慢又能复用 → session（连接、token）</text>
  <text x="36" y="422" font-size="11.5" fill="#14532d">一组用例共享上下文 → module / class</text>
  <text x="36" y="442" font-size="11.5" fill="#14532d">要求互不干扰的数据 → function（默认）</text>

  <rect x="349" y="360" width="311" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="365" y="382" font-size="12.5" font-weight="700" fill="#991b1b">硬约束</text>
  <text x="365" y="402" font-size="11.5" fill="#7f1d1d">窄作用域可依赖宽的：function → session ✓</text>
  <text x="365" y="422" font-size="11.5" fill="#7f1d1d">宽作用域不能依赖窄的：session → function ✗</text>
  <text x="365" y="442" font-size="11.5" fill="#7f1d1d">报错 ScopeMismatch: You tried to access...</text>
</svg>
