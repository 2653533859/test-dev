<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">等价类 + 边界值：把无穷输入压成有限用例</text>
  <text x="20" y="52" font-size="12.5" fill="#475569">需求：用户名长度 6–20 位，仅允许字母数字</text>

  <!-- number line -->
  <line x1="60" y1="150" x2="640" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="626" y="172" font-size="12" fill="#64748b">长度 →</text>

  <!-- invalid left -->
  <rect x="60" y="96" width="150" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="135" y="118" font-size="12.5" fill="#991b1b" text-anchor="middle">无效等价类：&lt; 6</text>

  <!-- valid -->
  <rect x="218" y="96" width="250" height="34" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="343" y="118" font-size="12.5" fill="#1e40af" text-anchor="middle">有效等价类：6 ≤ len ≤ 20</text>

  <!-- invalid right -->
  <rect x="476" y="96" width="164" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="558" y="118" font-size="12.5" fill="#991b1b" text-anchor="middle">无效等价类：&gt; 20</text>

  <!-- boundary ticks -->
  <g stroke="#d98324" stroke-width="2">
    <line x1="196" y1="140" x2="196" y2="160"/>
    <line x1="230" y1="140" x2="230" y2="160"/>
    <line x1="264" y1="140" x2="264" y2="160"/>
    <line x1="430" y1="140" x2="430" y2="160"/>
    <line x1="464" y1="140" x2="464" y2="160"/>
    <line x1="498" y1="140" x2="498" y2="160"/>
  </g>
  <g font-size="12" fill="#8a4b06" text-anchor="middle">
    <text x="196" y="182">5</text>
    <text x="230" y="182">6</text>
    <text x="264" y="182">7</text>
    <text x="430" y="182">19</text>
    <text x="464" y="182">20</text>
    <text x="498" y="182">21</text>
  </g>
  <g font-size="11" fill="#d98324" text-anchor="middle">
    <text x="196" y="200">离点</text>
    <text x="230" y="200">上点</text>
    <text x="264" y="200">内点</text>
    <text x="430" y="200">内点</text>
    <text x="464" y="200">上点</text>
    <text x="498" y="200">离点</text>
  </g>

  <!-- callout -->
  <rect x="60" y="216" width="580" height="46" rx="8" fill="#ffe0c2" stroke="#d98324" stroke-width="1.2"/>
  <text x="76" y="238" font-size="12.5" fill="#8a4b06">边界值假设：程序员写 `&gt;` 还是 `&gt;=` 最容易错，所以缺陷密集在边界而非区间中部</text>
  <text x="76" y="256" font-size="12.5" fill="#8a4b06">每条边界取「上点 / 离点 / 内点」三值，比在区间里随机取 100 个值更有效</text>

  <!-- pipeline -->
  <text x="20" y="298" font-size="14" font-weight="700" fill="#0f172a">四种方法的分工</text>

  <rect x="20" y="314" width="146" height="64" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="93" y="338" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">等价类划分</text>
  <text x="93" y="360" font-size="11.5" fill="#1e40af" text-anchor="middle">压缩单字段取值</text>

  <rect x="192" y="314" width="146" height="64" rx="8" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="265" y="338" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">边界值分析</text>
  <text x="265" y="360" font-size="11.5" fill="#1e40af" text-anchor="middle">补齐等价类边界</text>

  <rect x="364" y="314" width="146" height="64" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="437" y="338" font-size="13" font-weight="700" fill="#8a4b06" text-anchor="middle">正交实验法</text>
  <text x="437" y="360" font-size="11.5" fill="#8a4b06" text-anchor="middle">压缩多字段组合</text>

  <rect x="536" y="314" width="124" height="64" rx="8" fill="#ffe0c2" stroke="#d98324"/>
  <text x="598" y="338" font-size="13" font-weight="700" fill="#8a4b06" text-anchor="middle">场景法</text>
  <text x="598" y="360" font-size="11.5" fill="#8a4b06" text-anchor="middle">串联业务路径</text>

  <line x1="166" y1="346" x2="190" y2="346" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="338" y1="346" x2="362" y2="346" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="346" x2="534" y2="346" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="396" width="640" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="36" y="418" font-size="12.5" fill="#1f2d3d">落地顺序：先按字段做等价类 → 每类补边界 → 多字段用正交砍组合 → 最后用场景法把单点串成业务流</text>
  <text x="36" y="438" font-size="12.5" fill="#1f2d3d">产物直接映射成 pytest 的 `@pytest.mark.parametrize` 数据行，一条数据 = 一个等价类代表值</text>
</svg>
