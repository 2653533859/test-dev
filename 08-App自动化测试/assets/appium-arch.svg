<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#1f2d3d">Appium 分层架构：一次 click() 要穿过五层</text>

  <!-- layer 1 -->
  <rect x="24" y="44" width="330" height="56" rx="7" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="40" y="65" font-size="13" font-weight="700" fill="#1b4a91">① 测试脚本 / Client 库（你的机器）</text>
  <text x="40" y="83" font-size="11" fill="#1b4a91">Appium-Python-Client · pytest · Page Object</text>
  <text x="40" y="96" font-size="11" fill="#1b4a91">driver.find_element(AppiumBy.ID, "btn").click()</text>

  <rect x="374" y="44" width="282" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="390" y="65" font-size="12" font-weight="700" fill="#1f2d3d">协议：W3C WebDriver over HTTP</text>
  <text x="390" y="83" font-size="11" fill="#64748b">POST /session/{id}/element/{eid}/click</text>
  <text x="390" y="96" font-size="11" fill="#64748b">纯 JSON，所以语言无关</text>

  <line x1="189" y1="100" x2="189" y2="118" stroke="#475569" stroke-width="1.4" marker-end="url(#aa)"/>

  <!-- layer 2 -->
  <rect x="24" y="120" width="330" height="56" rx="7" fill="#ffe0c2" stroke="#d98324"/>
  <text x="40" y="141" font-size="13" font-weight="700" fill="#8a4b0f">② Appium Server（Node.js，默认 :4723）</text>
  <text x="40" y="159" font-size="11" fill="#8a4b0f">只做路由与会话管理，本身不懂 Android/iOS</text>
  <text x="40" y="172" font-size="11" fill="#8a4b0f">按 capabilities 里的 automationName 选 driver</text>

  <rect x="374" y="120" width="282" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="390" y="141" font-size="12" font-weight="700" fill="#1f2d3d">为什么要这一层</text>
  <text x="390" y="159" font-size="11" fill="#64748b">同一套脚本 → 换 driver 就能跑 iOS；</text>
  <text x="390" y="172" font-size="11" fill="#64748b">Server 可远程部署，做设备农场调度</text>

  <line x1="189" y1="176" x2="189" y2="194" stroke="#475569" stroke-width="1.4" marker-end="url(#aa)"/>

  <!-- layer 3 -->
  <rect x="24" y="196" width="330" height="56" rx="7" fill="#ffe0c2" stroke="#d98324"/>
  <text x="40" y="217" font-size="13" font-weight="700" fill="#8a4b0f">③ Driver 插件（平台适配层）</text>
  <text x="40" y="235" font-size="11" fill="#8a4b0f">Android → UiAutomator2 Driver（走 adb）</text>
  <text x="40" y="248" font-size="11" fill="#8a4b0f">iOS → XCUITest Driver（走 xcodebuild / usbmux）</text>

  <rect x="374" y="196" width="282" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="390" y="217" font-size="12" font-weight="700" fill="#1f2d3d">它负责的脏活</text>
  <text x="390" y="235" font-size="11" fill="#64748b">装 server apk / 编译 WDA、端口转发、</text>
  <text x="390" y="248" font-size="11" fill="#64748b">把 W3C 命令翻译成平台原生调用</text>

  <line x1="189" y1="252" x2="189" y2="270" stroke="#475569" stroke-width="1.4" marker-end="url(#aa)"/>

  <!-- layer 4 -->
  <rect x="24" y="272" width="330" height="70" rx="7" fill="#e8f1e8" stroke="#4b8b5a"/>
  <text x="40" y="293" font-size="13" font-weight="700" fill="#2f5d3a">④ 设备内的代理进程（真正的执行者）</text>
  <text x="40" y="311" font-size="11" fill="#2f5d3a">Android：appium-uiautomator2-server.apk</text>
  <text x="40" y="325" font-size="11" fill="#2f5d3a">由 am instrument 拉起，监听设备 :6790</text>
  <text x="40" y="338" font-size="11" fill="#2f5d3a">iOS：WebDriverAgentRunner，监听 :8100</text>

  <rect x="374" y="272" width="282" height="70" rx="7" fill="#fdecec" stroke="#c94a4a"/>
  <text x="390" y="293" font-size="12" font-weight="700" fill="#9c2b2b">关键：adb forward 端口转发</text>
  <text x="390" y="311" font-size="11" fill="#9c2b2b">adb forward tcp:8200 tcp:6790</text>
  <text x="390" y="325" font-size="11" fill="#9c2b2b">PC 上 8200 端口 = 设备内 6790 端口</text>
  <text x="390" y="338" font-size="11" fill="#9c2b2b">这条链断了 → "instrumentation process cannot be initialized"</text>

  <line x1="189" y1="342" x2="189" y2="360" stroke="#475569" stroke-width="1.4" marker-end="url(#aa)"/>

  <!-- layer 5 -->
  <rect x="24" y="362" width="330" height="56" rx="7" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="40" y="383" font-size="13" font-weight="700" fill="#1b4a91">⑤ 系统测试框架 → 被测 App</text>
  <text x="40" y="401" font-size="11" fill="#1b4a91">UiAutomator2 / Accessibility 服务读控件树</text>
  <text x="40" y="414" font-size="11" fill="#1b4a91">注入触摸事件，App 完全无感知</text>

  <rect x="374" y="362" width="282" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="390" y="383" font-size="12" font-weight="700" fill="#1f2d3d">因此有天然限制</text>
  <text x="390" y="401" font-size="11" fill="#64748b">控件树来自无障碍节点：自绘 UI（Flutter/</text>
  <text x="390" y="414" font-size="11" fill="#64748b">游戏/Canvas）拿不到，只能坐标或图像识别</text>

  <text x="24" y="443" font-size="11.5" fill="#64748b">排障顺序：脚本报错 → 看 Appium Server 日志（层②③）→ adb devices 与 adb forward --list（层④）→ logcat 看 App 崩没崩（层⑤）。</text>
  <text x="24" y="459" font-size="11.5" fill="#64748b">链路越长，单次操作耗时越高（一次 click 通常 100–300ms），所以 App 自动化天生比 Web 慢，用例粒度要更粗。</text>
</svg>
