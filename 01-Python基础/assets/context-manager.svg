<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar16" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="330" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">with 上下文管理器：进入 / 退出流程</text>

  <!-- flow -->
  <rect x="220" y="50" width="240" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="340" y="71" font-size="12" fill="#1e40af" text-anchor="middle">with expr as var:</text>

  <rect x="220" y="100" width="240" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="340" y="121" font-size="12" fill="#075985" text-anchor="middle">__enter__() → 返回资源</text>

  <rect x="220" y="150" width="240" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="171" font-size="12" fill="#166534" text-anchor="middle">with 块内代码执行</text>

  <rect x="220" y="200" width="240" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="340" y="221" font-size="12" fill="#5b21b6" text-anchor="middle">__exit__(exc_type,exc,tr)</text>

  <line x1="340" y1="84" x2="340" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#ar16)"/>
  <line x1="340" y1="134" x2="340" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#ar16)"/>
  <line x1="340" y1="184" x2="340" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#ar16)"/>

  <!-- branch on exception -->
  <rect x="500" y="200" width="160" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="580" y="221" font-size="11" fill="#92400e" text-anchor="middle">__exit__ 返回 True</text>
  <line x1="460" y1="217" x2="498" y2="217" stroke="#d97706" stroke-width="1.5" marker-end="url(#ar16)"/>
  <text x="500" y="252" font-size="10.5" fill="#92400e" text-anchor="middle">→ 吞掉异常</text>
  <text x="500" y="268" font-size="10.5" fill="#92400e" text-anchor="middle">返回 None/False → 向上抛</text>

  <!-- guarantees -->
  <rect x="30" y="262" width="180" height="48" rx="6" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="44" y="284" font-size="11" fill="#166534">__exit__ 总会执行</text>
  <text x="44" y="300" font-size="11" fill="#166534">（无论正常/异常/return）</text>

  <text x="20" y="322" font-size="11.5" fill="#64748b">等价于 try/finally 的语法糖；进入即获取资源、退出即释放（关文件/锁/连接）。@contextmanager 用 yield 把生成器变上下文管理器。</text>
</svg>
