<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="340" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">import spam 的解析流程</text>

  <!-- step boxes -->
  <rect x="200" y="50" width="280" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="340" y="71" font-size="12" fill="#1e40af" text-anchor="middle">① 查 sys.modules 缓存</text>

  <rect x="200" y="100" width="280" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="340" y="121" font-size="12" fill="#075985" text-anchor="middle">② 按 sys.path 依次查找文件/包</text>

  <rect x="200" y="150" width="280" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="340" y="171" font-size="12" fill="#075985" text-anchor="middle">③ 编译成 .pyc 字节码（缓存）</text>

  <rect x="200" y="200" width="280" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="340" y="221" font-size="12" fill="#5b21b6" text-anchor="middle">④ 创建模块对象·执行顶层代码</text>

  <rect x="200" y="250" width="280" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="271" font-size="12" fill="#166534" text-anchor="middle">⑤ 存入 sys.modules·绑定名字</text>

  <line x1="340" y1="84" x2="340" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#ar6)"/>
  <line x1="340" y1="134" x2="340" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#ar6)"/>
  <line x1="340" y1="184" x2="340" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#ar6)"/>
  <line x1="340" y1="234" x2="340" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#ar6)"/>

  <!-- right branch: hit cache -->
  <rect x="510" y="50" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="585" y="71" font-size="11.5" fill="#92400e" text-anchor="middle">命中→直接返回</text>
  <line x1="480" y1="67" x2="508" y2="67" stroke="#d97706" stroke-width="1.5" marker-end="url(#ar6)"/>
  <text x="540" y="92" font-size="10.5" fill="#92400e" text-anchor="middle">（不重复执行）</text>

  <!-- sys.path list -->
  <text x="20" y="120" font-size="11.5" fill="#475569">sys.path 顺序：</text>
  <text x="20" y="140" font-size="11.5" fill="#475569">1 当前目录</text>
  <text x="20" y="160" font-size="11.5" fill="#475569">2 PYTHONPATH</text>
  <text x="20" y="180" font-size="11.5" fill="#475569">3 标准库</text>
  <text x="20" y="200" font-size="11.5" fill="#475569">4 site-packages</text>

  <text x="20" y="315" font-size="11.5" fill="#64748b">因先查 sys.modules，模块只被执行一次；循环导入的根因是「半初始化模块被引用」。</text>
</svg>
