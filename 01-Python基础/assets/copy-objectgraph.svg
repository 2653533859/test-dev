<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">浅拷贝 vs 深拷贝：对象图视角</text>

  <!-- original -->
  <text x="30" y="65" font-size="13" font-weight="700" fill="#0f172a">原始 a = [1, [2,3]]</text>
  <rect x="30" y="78" width="90" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="75" y="103" font-size="12" fill="#1e40af" text-anchor="middle">a(list)</text>
  <circle cx="150" cy="98" r="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="150" y="102" font-size="11" fill="#92400e" text-anchor="middle">1</text>
  <rect x="190" y="78" width="90" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="235" y="103" font-size="12" fill="#166534" text-anchor="middle">inner</text>
  <circle cx="320" cy="98" r="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="102" font-size="11" fill="#92400e" text-anchor="middle">2</text>
  <circle cx="360" cy="98" r="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="360" y="102" font-size="11" fill="#92400e" text-anchor="middle">3</text>
  <line x1="120" y1="98" x2="146" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#ar8)"/>
  <line x1="200" y1="98" x2="306" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#ar8)"/>
  <line x1="240" y1="98" x2="346" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#ar8)"/>

  <!-- shallow -->
  <text x="30" y="160" font-size="13" font-weight="700" fill="#0f172a">浅拷贝 b = copy.copy(a)</text>
  <rect x="30" y="173" width="90" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="75" y="198" font-size="12" fill="#3730a3" text-anchor="middle">b(list)</text>
  <line x1="120" y1="193" x2="186" y2="193" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar8)"/>
  <text x="300" y="198" font-size="11.5" fill="#dc2626" text-anchor="middle">共享同一 inner 对象！</text>
  <line x1="120" y1="173" x2="120" y2="118" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="200" y1="193" x2="306" y2="98" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar8)"/>

  <!-- deep -->
  <text x="30" y="255" font-size="13" font-weight="700" fill="#0f172a">深拷贝 c = copy.deepcopy(a)</text>
  <rect x="30" y="268" width="90" height="40" rx="6" fill="#cffafe" stroke="#0891b2"/>
  <text x="75" y="293" font-size="12" fill="#155e75" text-anchor="middle">c(list)</text>
  <rect x="200" y="268" width="90" height="40" rx="6" fill="#a7f3d0" stroke="#059669"/>
  <text x="245" y="293" font-size="12" fill="#065f46" text-anchor="middle">inner'</text>
  <circle cx="340" cy="288" r="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="340" y="292" font-size="11" fill="#92400e" text-anchor="middle">2</text>
  <circle cx="380" cy="288" r="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="380" y="292" font-size="11" fill="#92400e" text-anchor="middle">3</text>
  <line x1="120" y1="288" x2="196" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#ar8)"/>
  <line x1="250" y1="288" x2="326" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#ar8)"/>
  <line x1="290" y1="288" x2="366" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#ar8)"/>
  <text x="430" y="293" font-size="11.5" fill="#059669" text-anchor="middle">递归复制出独立副本</text>

  <text x="20" y="345" font-size="11.5" fill="#64748b">赋值 = 引用同一对象；浅拷贝只建新外壳、内部可变对象共享；深拷贝递归复制全部，彼此独立（用 memo 处理循环引用）。</text>
</svg>
