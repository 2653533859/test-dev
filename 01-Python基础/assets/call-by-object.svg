<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar11" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">函数调用：按对象引用传参（call by object reference）</text>

  <!-- caller -->
  <text x="30" y="64" font-size="13" font-weight="700" fill="#0f172a">调用方</text>
  <rect x="30" y="76" width="90" height="36" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="75" y="99" font-size="12" fill="#1e40af" text-anchor="middle">a→[1,2]</text>
  <rect x="150" y="76" width="80" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="190" y="99" font-size="12" fill="#92400e" text-anchor="middle">b=5</text>

  <!-- param binding -->
  <text x="280" y="64" font-size="13" font-weight="700" fill="#0f172a">def f(x, y)</text>
  <rect x="280" y="76" width="90" height="36" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="325" y="99" font-size="12" fill="#3730a3" text-anchor="middle">x</text>
  <rect x="400" y="76" width="90" height="36" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="445" y="99" font-size="12" fill="#3730a3" text-anchor="middle">y</text>

  <!-- shared mutable object -->
  <rect x="540" y="76" width="110" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="595" y="99" font-size="12" fill="#166534" text-anchor="middle">list 对象</text>

  <line x1="120" y1="94" x2="278" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#ar11)"/>
  <line x1="230" y1="94" x2="398" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#ar11)"/>
  <line x1="325" y1="94" x2="538" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#ar11)"/>
  <line x1="445" y1="100" x2="500" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- effect note -->
  <rect x="30" y="150" width="620" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="44" y="172" font-size="12" fill="#991b1b">可变对象（list/dict）：函数内 x.append() 改的是同一对象 → 调用方 a 也变。</text>
  <text x="44" y="192" font-size="12" fill="#991b1b">不可变对象（int/str）：函数内 y += 1 是让 y 指向新对象 → 调用方 b 不变。</text>

  <rect x="30" y="222" width="620" height="40" rx="6" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="44" y="247" font-size="12" fill="#166534">参数顺序：位置 → *args → 关键字仅 → **kwargs；函数内重新绑定参数名不影响调用方的名字。</text>

  <text x="20" y="300" font-size="11.5" fill="#64748b">不是值拷贝（call by value），也不是引用别名（call by reference），而是「把对象的引用传进去」——能否影响调用方取决于对象是否可变。</text>
</svg>
