<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">迭代器协议与生成器状态机</text>

  <!-- left: iterator protocol -->
  <text x="30" y="60" font-size="13" font-weight="700" fill="#0f172a">可迭代 vs 迭代器</text>
  <rect x="30" y="72" width="290" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="175" y="93" font-size="12" fill="#1e40af" text-anchor="middle">可迭代对象: __iter__()→迭代器</text>
  <rect x="30" y="116" width="290" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="175" y="137" font-size="12" fill="#166534" text-anchor="middle">迭代器: __next__()→下一个值</text>
  <line x1="175" y1="106" x2="175" y2="114" stroke="#475569" stroke-width="1.5" marker-end="url(#ar5)"/>
  <rect x="30" y="160" width="290" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="175" y="181" font-size="12" fill="#92400e" text-anchor="middle">耗尽 → StopIteration</text>
  <line x1="175" y1="150" x2="175" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#ar5)"/>

  <!-- right: generator state machine -->
  <text x="360" y="60" font-size="13" font-weight="700" fill="#0f172a">生成器：yield 暂停/恢复</text>
  <rect x="360" y="72" width="290" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="505" y="93" font-size="12" fill="#5b21b6" text-anchor="middle">① 调用 gen() 不执行</text>
  <rect x="360" y="116" width="290" height="34" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="505" y="137" font-size="12" fill="#3730a3" text-anchor="middle">② next() → 跑到 yield 暂停</text>
  <rect x="360" y="160" width="290" height="34" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="505" y="181" font-size="12" fill="#3730a3" text-anchor="middle">③ 再 next() → 从暂停处恢复</text>
  <rect x="360" y="204" width="290" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="505" y="225" font-size="12" fill="#92400e" text-anchor="middle">④ 函数结束 → StopIteration</text>
  <line x1="505" y1="106" x2="505" y2="114" stroke="#475569" stroke-width="1.5" marker-end="url(#ar5)"/>
  <line x1="505" y1="150" x2="505" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#ar5)"/>
  <line x1="505" y1="194" x2="505" y2="202" stroke="#475569" stroke-width="1.5" marker-end="url(#ar5)"/>

  <text x="20" y="285" font-size="11.5" fill="#64748b">for 循环本质：先 iter(obj) 拿迭代器，再反复 next() 直到 StopIteration（被 for 静默捕获）。</text>
  <text x="20" y="305" font-size="11.5" fill="#64748b">生成器是「惰性状态机」：yield 把函数暂停并保存现场，下次 next() 从断点继续，省内存、可表示无限序列。</text>
</svg>
