<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">asyncio：单线程事件循环 + 协作式让出</text>

  <!-- event loop box -->
  <rect x="250" y="55" width="180" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="340" y="76" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">事件循环 Event Loop</text>
  <text x="340" y="92" font-size="10.5" fill="#6d28d9" text-anchor="middle">调度中心 · 在等待点切换</text>

  <!-- task A -->
  <rect x="40" y="130" width="240" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="160" y="151" font-size="12" fill="#1e40af" text-anchor="middle">协程 A：await sleep(2)</text>
  <!-- task B -->
  <rect x="400" y="130" width="240" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="520" y="151" font-size="12" fill="#1e40af" text-anchor="middle">协程 B：await sleep(1)</text>

  <!-- timeline -->
  <line x1="40" y1="250" x2="640" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="630" y="268" font-size="12" fill="#64748b">时间 →</text>

  <rect x="40"  y="232" width="120" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="100" y="252" font-size="11.5" fill="#166534" text-anchor="middle">A 启动·让出</text>
  <rect x="170" y="232" width="150" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="245" y="252" font-size="11.5" fill="#92400e" text-anchor="middle">B 启动·运行·完成</text>
  <rect x="330" y="232" width="120" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="390" y="252" font-size="11.5" fill="#92400e" text-anchor="middle">A 唤醒·完成</text>
  <rect x="460" y="232" width="170" height="30" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="545" y="252" font-size="11.5" fill="#3730a3" text-anchor="middle">gather 总耗时≈2s</text>

  <!-- arrows connecting -->
  <line x1="160" y1="164" x2="330" y2="99" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="520" y1="164" x2="350" y2="99" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="160" y1="174" x2="100" y2="232" stroke="#475569" stroke-width="1.2" marker-end="url(#ar2)"/>
  <line x1="390" y1="200" x2="245" y2="232" stroke="#475569" stroke-width="1.2" marker-end="url(#ar2)"/>
  <line x1="520" y1="174" x2="390" y2="232" stroke="#475569" stroke-width="1.2" marker-end="url(#ar2)"/>

  <text x="20" y="300" font-size="11.5" fill="#64748b">协作式：遇到 await 才让出控制权，循环去跑别的就绪协程；无 await 的 CPU 循环会卡死整个循环。</text>
  <text x="20" y="320" font-size="11.5" fill="#64748b">并发来源：gather 并发启动 A、B，总耗时≈最慢任务(2s)，而非串行累加(3s)。</text>
  <text x="20" y="340" font-size="11.5" fill="#b91c1c">红线：在协程里写 time.sleep / requests.get（同步阻塞）会卡死事件循环，必须换 awaitable 版本。</text>
</svg>
