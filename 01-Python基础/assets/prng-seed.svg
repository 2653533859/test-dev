<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar22" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">random：PRNG 种子与确定性序列</text>

  <!-- seed -->
  <rect x="40" y="60" width="140" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="110" y="85" font-size="12" fill="#1e40af" text-anchor="middle">seed=42</text>

  <!-- state -->
  <rect x="220" y="60" width="160" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="300" y="85" font-size="12" fill="#075985" text-anchor="middle">内部状态(624位)</text>

  <!-- generator -->
  <rect x="420" y="60" width="200" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="520" y="85" font-size="12" fill="#5b21b6" text-anchor="middle">Mersenne Twister</text>

  <line x1="180" y1="80" x2="218" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#ar22)"/>
  <line x1="380" y1="80" x2="418" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#ar22)"/>

  <!-- outputs -->
  <text x="40" y="150" font-size="12.5" font-weight="700" fill="#0f172a">同种子 → 同序列</text>
  <g font-size="11">
    <rect x="40" y="162" width="90" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="85" y="180" fill="#166534" text-anchor="middle">0.63</text>
    <rect x="140" y="162" width="90" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="185" y="180" fill="#166534" text-anchor="middle">0.12</text>
    <rect x="240" y="162" width="90" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="285" y="180" fill="#166534" text-anchor="middle">0.89</text>
  </g>

  <rect x="40" y="218" width="620" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="54" y="240" font-size="11.5" fill="#991b1b">random 是「伪随机」：确定种子 → 完全可复现序列；不可用于密码学（可预测）。</text>
  <text x="54" y="260" font-size="11.5" fill="#991b1b">密码学安全用 secrets / os.urandom；time.time() 作种子在快速重启时可能重复。</text>

  <text x="20" y="296" font-size="11.5" fill="#64748b">choices 有放回、sample 无放回；perf_counter 是单调时钟（测耗时），time.time 可能回拨。</text>
</svg>
