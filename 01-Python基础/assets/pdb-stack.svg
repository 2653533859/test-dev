<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar23" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">pdb 与调用栈：从入口到出错现场</text>

  <!-- stack frames -->
  <rect x="200" y="54" width="320" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="360" y="75" font-size="12" fill="#334155" text-anchor="middle">frame 0  &lt;module&gt;  main()</text>

  <rect x="200" y="100" width="320" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="360" y="121" font-size="12" fill="#1e40af" text-anchor="middle">frame 1  main()</text>

  <rect x="200" y="146" width="320" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="360" y="167" font-size="12" fill="#075985" text-anchor="middle">frame 2  buggy(1, 0)</text>

  <rect x="200" y="192" width="320" height="34" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="360" y="213" font-size="12" fill="#991b1b" text-anchor="middle">frame 3  return a / b  ← ZeroDivisionError</text>

  <line x1="360" y1="88" x2="360" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#ar23)"/>
  <line x1="360" y1="134" x2="360" y2="144" stroke="#475569" stroke-width="1.5" marker-end="url(#ar23)"/>
  <line x1="360" y1="180" x2="360" y2="190" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar23)"/>

  <!-- most recent call last -->
  <text x="40" y="250" font-size="11.5" fill="#64748b">traceback 从下往上读：</text>
  <text x="40" y="268" font-size="11.5" fill="#991b1b">最底部 = 异常类型 + 出错那一行（现场）</text>
  <text x="40" y="286" font-size="11.5" fill="#64748b">往上每一帧 = 调用链（谁调用了谁）</text>

  <rect x="430" y="240" width="220" height="60" rx="6" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="444" y="262" font-size="11" fill="#166534">pdb 命令：n 单步(不进)</text>
  <text x="444" y="280" font-size="11" fill="#166534">s 单步(进) · p 看变量</text>
  <text x="444" y="298" font-size="11" fill="#166534">c 继续 · w 看栈 · q 退出</text>
</svg>
