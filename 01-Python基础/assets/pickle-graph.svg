<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar21" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">pickle：对象图序列化与 __reduce__ 风险</text>

  <!-- object graph -->
  <text x="30" y="60" font-size="12.5" font-weight="700" fill="#0f172a">内存中的对象图</text>
  <rect x="30" y="74" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="80" y="99" font-size="12" fill="#1e40af" text-anchor="middle">obj</text>
  <rect x="170" y="74" width="100" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="220" y="99" font-size="12" fill="#166534" text-anchor="middle">child A</text>
  <rect x="170" y="140" width="100" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="220" y="165" font-size="12" fill="#166534" text-anchor="middle">child B</text>
  <line x1="130" y1="94" x2="168" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#ar21)"/>
  <line x1="130" y1="100" x2="168" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#ar21)"/>

  <!-- serialize -->
  <rect x="320" y="100" width="120" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="380" y="125" font-size="12" fill="#92400e" text-anchor="middle">pickle.dumps</text>

  <!-- bytes -->
  <rect x="480" y="100" width="170" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="565" y="125" font-size="11.5" fill="#5b21b6" text-anchor="middle">字节流(含引用/循环)</text>

  <line x1="130" y1="200" x2="380" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#ar21)"/>
  <line x1="440" y1="120" x2="478" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#ar21)"/>

  <!-- reduce danger -->
  <rect x="30" y="230" width="620" height="58" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="44" y="252" font-size="11.5" fill="#991b1b">危险：攻击对象定义 __reduce__ 返回 (os.system, ('恶意命令',))，反序列化时自动执行 → RCE。</text>
  <text x="44" y="272" font-size="11.5" fill="#991b1b">红线：绝不 pickle.loads 不可信数据；跨语言用 json（见 [[Python json 序列化]]）。</text>

  <text x="480" y="160" font-size="11" fill="#64748b" text-anchor="middle">保留对象类型、</text>
  <text x="480" y="178" font-size="11" fill="#64748b" text-anchor="middle">引用关系、循环</text>
  <text x="480" y="200" font-size="11" fill="#64748b" text-anchor="middle">仅 Python 可用</text>
</svg>
