<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar18" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="330" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">lru_cache：记忆化命中/未命中</text>

  <!-- call -->
  <rect x="30" y="60" width="200" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="130" y="81" font-size="12" fill="#1e40af" text-anchor="middle">调用 f(args)</text>

  <!-- check cache -->
  <rect x="30" y="114" width="200" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="130" y="135" font-size="12" fill="#92400e" text-anchor="middle">args 元组在缓存?</text>

  <!-- hit -->
  <rect x="30" y="170" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="130" y="191" font-size="12" fill="#166534" text-anchor="middle">命中→直接返回</text>

  <!-- miss -->
  <rect x="290" y="170" width="200" height="34" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="390" y="191" font-size="12" fill="#991b1b" text-anchor="middle">未命中→执行函数</text>

  <!-- store -->
  <rect x="290" y="224" width="200" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="390" y="245" font-size="12" fill="#075985" text-anchor="middle">存 (args→结果)</text>

  <!-- evict -->
  <rect x="290" y="278" width="200" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="390" y="299" font-size="12" fill="#5b21b6" text-anchor="middle">超 maxsize→淘汰最久未用</text>

  <line x1="130" y1="94" x2="130" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#ar18)"/>
  <line x1="130" y1="148" x2="130" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar18)"/>
  <line x1="230" y1="131" x2="288" y2="187" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar18)"/>
  <line x1="390" y1="204" x2="390" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#ar18)"/>
  <line x1="390" y1="258" x2="390" y2="276" stroke="#475569" stroke-width="1.5" marker-end="url(#ar18)"/>

  <text x="520" y="80" font-size="11" fill="#64748b" text-anchor="middle">复杂度</text>
  <text x="520" y="98" font-size="11" fill="#334155" text-anchor="middle">O(1) 查找/插入</text>
  <text x="520" y="130" font-size="11" fill="#64748b" text-anchor="middle">要求参数可哈希</text>
  <text x="520" y="162" font-size="11" fill="#64748b" text-anchor="middle">fib(n): O(2^n)</text>
  <text x="520" y="180" font-size="11" fill="#64748b" text-anchor="middle">→ O(n)</text>

  <text x="20" y="324" font-size="11.5" fill="#64748b">以参数元组为 key 存返回值；适合纯函数、重复调用、计算贵。参数含 list/dict 不可哈希会报错；无副作用的函数才适合缓存。</text>
</svg>
