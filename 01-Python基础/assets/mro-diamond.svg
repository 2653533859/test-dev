<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">菱形继承与 C3 MRO 线性化</text>

  <!-- diamond -->
  <rect x="300" y="60" width="80" height="40" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="340" y="85" font-size="13" fill="#334155" text-anchor="middle">A</text>

  <rect x="200" y="130" width="80" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="240" y="155" font-size="13" fill="#1e40af" text-anchor="middle">B(A)</text>
  <rect x="400" y="130" width="80" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="440" y="155" font-size="13" fill="#1e40af" text-anchor="middle">C(A)</text>

  <rect x="300" y="200" width="80" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="225" font-size="13" fill="#166534" text-anchor="middle">D(B,C)</text>

  <line x1="320" y1="100" x2="240" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#ar4)"/>
  <line x1="360" y1="100" x2="440" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#ar4)"/>
  <line x1="240" y1="170" x2="320" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#ar4)"/>
  <line x1="440" y1="170" x2="360" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#ar4)"/>

  <!-- MRO result -->
  <text x="540" y="80" font-size="13" font-weight="700" fill="#0f172a">D.__mro__</text>
  <g font-size="12">
    <rect x="540" y="95" width="120" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="600" y="113" fill="#166534" text-anchor="middle">1. D</text>
    <rect x="540" y="127" width="120" height="28" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="600" y="145" fill="#1e40af" text-anchor="middle">2. B</text>
    <rect x="540" y="159" width="120" height="28" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="600" y="177" fill="#1e40af" text-anchor="middle">3. C</text>
    <rect x="540" y="191" width="120" height="28" rx="5" fill="#e2e8f0" stroke="#64748b"/>
    <text x="600" y="209" fill="#334155" text-anchor="middle">4. A</text>
    <rect x="540" y="223" width="120" height="28" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="600" y="241" fill="#475569" text-anchor="middle">5. object</text>
  </g>

  <text x="20" y="285" font-size="11.5" fill="#64748b">C3 规则：保持声明顺序（先 B 后 C）、子类总在父类前、菱形公共基类 A 只出现一次且在 B/C 之后。</text>
  <text x="20" y="305" font-size="11.5" fill="#b91c1c">super() 按 MRO 取「下一个」，使菱形继承中 A 只被初始化一次，不会重复调用。</text>
</svg>
