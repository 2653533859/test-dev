<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar14" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="330" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">list 底层：动态数组与 1.125× 扩容</text>

  <!-- before -->
  <text x="30" y="62" font-size="12.5" font-weight="700" fill="#0f172a">append 前（容量 4，已用 4）</text>
  <g font-size="11">
    <rect x="30" y="74" width="56" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="58" y="96" fill="#166534" text-anchor="middle">1</text>
    <rect x="92" y="74" width="56" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="120" y="96" fill="#166534" text-anchor="middle">2</text>
    <rect x="154" y="74" width="56" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="182" y="96" fill="#166534" text-anchor="middle">3</text>
    <rect x="216" y="74" width="56" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="244" y="96" fill="#166534" text-anchor="middle">4</text>
    <rect x="278" y="74" width="56" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
    <text x="306" y="92" font-size="10" fill="#991b1b" text-anchor="middle">预留</text>
    <text x="306" y="104" font-size="9" fill="#991b1b" text-anchor="middle">(空)</text>
  </g>

  <!-- append triggers resize -->
  <text x="360" y="62" font-size="12.5" font-weight="700" fill="#0f172a">append(5) → 满，扩容</text>
  <rect x="360" y="74" width="300" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="374" y="95" font-size="11" fill="#92400e">新容量 = 4 × 1.125 = 4.5 → 取整 9？实际按增长策略</text>

  <!-- after -->
  <text x="30" y="160" font-size="12.5" font-weight="700" fill="#0f172a">append 后（新数组，旧元素拷贝过去）</text>
  <g font-size="11">
    <rect x="30" y="172" width="48" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="54" y="194" fill="#1e40af" text-anchor="middle">1</text>
    <rect x="86" y="172" width="48" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="110" y="194" fill="#1e40af" text-anchor="middle">2</text>
    <rect x="142" y="172" width="48" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="166" y="194" fill="#1e40af" text-anchor="middle">3</text>
    <rect x="198" y="172" width="48" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="222" y="194" fill="#1e40af" text-anchor="middle">4</text>
    <rect x="254" y="172" width="48" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="278" y="194" fill="#166534" text-anchor="middle">5</text>
    <rect x="310" y="172" width="48" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
    <text x="334" y="192" font-size="9.5" fill="#991b1b" text-anchor="middle">预留</text>
    <rect x="366" y="172" width="48" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="422" y="172" width="48" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="478" y="172" width="48" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  </g>

  <rect x="30" y="232" width="620" height="40" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="44" y="257" font-size="11.5" fill="#92400e">单次 append 偶尔 O(n)（扩容拷贝），但均摊 O(1)；头部 insert/pop(0) 是 O(n)（搬移后续元素）。</text>

  <rect x="30" y="284" width="620" height="34" rx="6" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="44" y="306" font-size="11.5" fill="#166534">陷阱：[[]]*n 共享同一个内层列表；循环拼接字符串 O(n²)，应 join / 列表后 join。</text>
</svg>
