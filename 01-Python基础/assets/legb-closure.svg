<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="340" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">LEGB 作用域链与闭包 cell</text>

  <!-- LEGB layers -->
  <text x="30" y="62" font-size="12.5" font-weight="700" fill="#0f172a">名字查找顺序（由内到外）</text>
  <rect x="30" y="74" width="300" height="30" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="180" y="94" font-size="12" fill="#991b1b" text-anchor="middle">L Local 局部</text>
  <rect x="30" y="110" width="300" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="180" y="130" font-size="12" fill="#92400e" text-anchor="middle">E Enclosing 外层函数</text>
  <rect x="30" y="146" width="300" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="180" y="166" font-size="12" fill="#1e40af" text-anchor="middle">G Global 全局</text>
  <rect x="30" y="182" width="300" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="180" y="202" font-size="12" fill="#334155" text-anchor="middle">B Builtin 内置</text>
  <line x1="180" y1="104" x2="180" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#ar10)"/>
  <line x1="180" y1="140" x2="180" y2="144" stroke="#475569" stroke-width="1.5" marker-end="url(#ar10)"/>
  <line x1="180" y1="176" x2="180" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#ar10)"/>

  <!-- closure example -->
  <text x="370" y="62" font-size="12.5" font-weight="700" fill="#0f172a">闭包：内层函数捕获外层变量</text>
  <rect x="370" y="74" width="280" height="66" rx="6" fill="#f8fafc" stroke="#7c3aed"/>
  <text x="384" y="94" font-size="11" fill="#334155">def outer(n):</text>
  <text x="396" y="110" font-size="11" fill="#334155">    def inner():</text>
  <text x="408" y="126" font-size="11" fill="#334155">        return n + 1</text>

  <rect x="370" y="156" width="130" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="435" y="180" font-size="11.5" fill="#5b21b6" text-anchor="middle">inner.__closure__</text>
  <rect x="520" y="156" width="130" height="40" rx="6" fill="#c4b5fd" stroke="#6d28d9"/>
  <text x="585" y="173" font-size="11" fill="#4c1d95" text-anchor="middle">cell: n=10</text>
  <text x="585" y="189" font-size="10" fill="#4c1d95" text-anchor="middle">(被冻结保存)</text>
  <line x1="500" y1="176" x2="518" y2="176" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar10)"/>

  <!-- late binding warning -->
  <rect x="370" y="214" width="290" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="384" y="234" font-size="11" fill="#991b1b">陷阱：循环里 return 内层函数，</text>
  <text x="384" y="250" font-size="11" fill="#991b1b">变量延迟绑定→拿到最终值。</text>
  <text x="384" y="266" font-size="11" fill="#991b1b">解决：默认参数 / nonlocal 固定。</text>

  <text x="20" y="318" font-size="11.5" fill="#64748b">赋值即声明局部（先找 Local）；闭包靠 __closure__ 里的 cell 把外层变量「冻结」带走，离开外层作用域仍可用。</text>
</svg>
