<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="360" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">GIL：I/O 阻塞时释放、CPU 密集时不释放</text>

  <!-- time axis -->
  <line x1="40" y1="300" x2="650" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="318" font-size="12" fill="#64748b">时间 →</text>

  <!-- Thread A lane -->
  <text x="20" y="80" font-size="13" font-weight="700" fill="#1e293b">线程 A</text>
  <rect x="60"  y="62" width="180" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="82" font-size="12" fill="#1e40af" text-anchor="middle">持有 GIL · 执行字节码</text>
  <rect x="300" y="62" width="120" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="360" y="82" font-size="12" fill="#92400e" text-anchor="middle">time.sleep()</text>
  <rect x="500" y="62" width="140" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="570" y="82" font-size="12" fill="#166534" text-anchor="middle">重新抢到 GIL</text>

  <!-- Thread B lane -->
  <text x="20" y="150" font-size="13" font-weight="700" fill="#1e293b">线程 B</text>
  <rect x="300" y="132" width="120" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="360" y="152" font-size="12" fill="#334155" text-anchor="middle">阻塞等待</text>
  <rect x="440" y="132" width="200" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="540" y="152" font-size="12" fill="#1e40af" text-anchor="middle">获 GIL · 执行（A 睡眠时空窗）</text>

  <!-- GIL state -->
  <text x="20" y="220" font-size="13" font-weight="700" fill="#1e293b">GIL 锁</text>
  <rect x="60"  y="202" width="240" height="30" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="180" y="222" font-size="12" fill="#166534" text-anchor="middle">被 A 持有</text>
  <rect x="300" y="202" width="120" height="30" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="360" y="222" font-size="12" fill="#991b1b" text-anchor="middle">A 释放</text>
  <rect x="440" y="202" width="200" height="30" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="540" y="222" font-size="12" fill="#166534" text-anchor="middle">被 B 持有</text>

  <!-- arrows -->
  <line x1="240" y1="77" x2="298" y2="77" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="77" x2="498" y2="77" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="147" x2="438" y2="147" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="217" x2="438" y2="217" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="217" x2="640" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="20" y="345" font-size="11.5" fill="#64748b">要点：阻塞型 I/O（sleep/recv/read）会先释放 GIL，让另一线程在空窗期运行；纯 CPU 计算不释放，多线程无法并行加速。</text>
</svg>
