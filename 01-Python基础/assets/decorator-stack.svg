<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="330" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#0f172a">装饰器：@ 等价于 func = deco(func)，自下而上包裹</text>

  <!-- source -->
  <text x="30" y="62" font-size="12.5" font-weight="700" fill="#0f172a">源码</text>
  <rect x="30" y="74" width="220" height="92" rx="6" fill="#f8fafc" stroke="#64748b"/>
  <text x="44" y="96" font-size="11.5" fill="#334155">@deco_a</text>
  <text x="44" y="114" font-size="11.5" fill="#334155">@deco_b</text>
  <text x="44" y="132" font-size="11.5" fill="#334155">def f(): ...</text>

  <!-- equivalent -->
  <text x="300" y="62" font-size="12.5" font-weight="700" fill="#0f172a">等价展开（从下往上）</text>
  <rect x="300" y="74" width="350" height="30" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="316" y="94" font-size="11" fill="#3730a3">f = deco_b(f)   # 先包最里层</text>
  <rect x="300" y="110" width="350" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="316" y="130" font-size="11" fill="#5b21b6">f = deco_a(f)   # 再包外层</text>

  <!-- runtime wrap -->
  <text x="30" y="200" font-size="12.5" font-weight="700" fill="#0f172a">运行时调用顺序</text>
  <rect x="30" y="212" width="160" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="110" y="233" font-size="11.5" fill="#5b21b6" text-anchor="middle">deco_a 外层</text>
  <rect x="230" y="212" width="160" height="34" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="310" y="233" font-size="11.5" fill="#3730a3" text-anchor="middle">deco_b 内层</text>
  <rect x="430" y="212" width="160" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="233" font-size="11.5" fill="#166534" text-anchor="middle">原始 f()</text>
  <line x1="190" y1="229" x2="228" y2="229" stroke="#475569" stroke-width="1.5" marker-end="url(#ar12)"/>
  <line x1="390" y1="229" x2="428" y2="229" stroke="#475569" stroke-width="1.5" marker-end="url(#ar12)"/>
  <line x1="450" y1="246" x2="412" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#ar12)"/>
  <line x1="250" y1="246" x2="212" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#ar12)"/>

  <rect x="30" y="270" width="620" height="48" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="44" y="292" font-size="11.5" fill="#92400e">注意：装饰器在「导入时」就执行（@ 那行被解释时），不是调用函数时才执行。</text>
  <text x="44" y="310" font-size="11.5" fill="#92400e">务必 @wraps(f) 保留原函数 __name__/__doc__，否则被装饰函数元信息丢失。</text>
</svg>
