<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">GUI 模式 vs 命令行模式：压力机资源都花在哪</text>
  <text x="20" y="50" font-size="12" fill="#64748b">GUI 把 CPU 和内存喂给了 Swing 渲染和结果缓存，真正发压的线程被饿着</text>

  <!-- GUI side -->
  <rect x="24" y="70" width="308" height="290" rx="10" fill="#fff5e8" stroke="#d98324"/>
  <text x="178" y="94" font-size="14" font-weight="700" fill="#96560f" text-anchor="middle">GUI 模式（只用于调试）</text>

  <rect x="44" y="108" width="268" height="40" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="178" y="133" font-size="12" fill="#1f2d3d" text-anchor="middle">Swing 界面渲染 · 树刷新 · 图表重绘</text>

  <rect x="44" y="156" width="268" height="40" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="178" y="181" font-size="12" fill="#1f2d3d" text-anchor="middle">察看结果树：全量响应体驻留内存</text>

  <rect x="44" y="204" width="268" height="40" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="178" y="229" font-size="12" fill="#1f2d3d" text-anchor="middle">监听器实时聚合计算 · 频繁 Full GC</text>

  <rect x="44" y="252" width="268" height="52" rx="6" fill="#2f6fd0"/>
  <text x="178" y="273" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">真正发压的线程（被挤压）</text>
  <text x="178" y="292" font-size="11.5" fill="#dbeafe" text-anchor="middle">拿到的 CPU 时间片不足 40%</text>

  <text x="178" y="330" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">后果：TPS 偏低、响应时间虚高</text>
  <text x="178" y="349" font-size="11.5" fill="#96560f" text-anchor="middle">测的是 JMeter 自己，不是被测系统</text>

  <!-- arrow -->
  <line x1="336" y1="215" x2="366" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arw6)"/>

  <!-- CLI side -->
  <rect x="370" y="70" width="286" height="290" rx="10" fill="#eaf3ff" stroke="#2f6fd0"/>
  <text x="513" y="94" font-size="14" font-weight="700" fill="#1b4f9c" text-anchor="middle">命令行模式（正式压测）</text>

  <rect x="388" y="108" width="250" height="40" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="513" y="133" font-size="12" fill="#1f2d3d" text-anchor="middle">无 GUI，无渲染开销</text>

  <rect x="388" y="156" width="250" height="40" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="513" y="181" font-size="12" fill="#1f2d3d" text-anchor="middle">结果流式写入 result.jtl</text>

  <rect x="388" y="204" width="250" height="40" rx="6" fill="#2f6fd0"/>
  <text x="513" y="222" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">真正发压的线程</text>
  <text x="513" y="239" font-size="11.5" fill="#dbeafe" text-anchor="middle">吃满 CPU，压力真实</text>

  <rect x="388" y="252" width="250" height="52" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="513" y="273" font-size="12" fill="#1f2d3d" text-anchor="middle">压测结束后离线生成</text>
  <text x="513" y="291" font-size="12" fill="#1f2d3d" text-anchor="middle">HTML 报告（-e -o report）</text>

  <text x="513" y="330" font-size="12.5" font-weight="700" fill="#1b4f9c" text-anchor="middle">同一脚本 TPS 通常高出 30%～200%</text>
  <text x="513" y="349" font-size="11.5" fill="#64748b" text-anchor="middle">压力机资源全部用于发压</text>

  <!-- command -->
  <rect x="24" y="376" width="632" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="398" font-size="12.5" font-weight="700" fill="#1f2d3d">标准压测命令</text>
  <text x="40" y="420" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#1b4f9c">jmeter -n -t order.jmx -l result.jtl -e -o report/ -Jthreads=200</text>
  <text x="40" y="442" font-size="11.5" fill="#64748b">-n 非 GUI · -t 脚本 · -l 结果文件 · -e 生成报告 · -o 报告目录（必须为空）· -J 覆盖属性</text>
</svg>
