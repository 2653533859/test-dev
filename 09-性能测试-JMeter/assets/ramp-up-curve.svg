<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">加压曲线：一次性加压 vs 递增加压 vs 阶梯加压</text>
  <text x="20" y="50" font-size="12" fill="#64748b">阶梯加压的每一级都要「压住不动」一段时间，才能读出该并发下的稳态 TPS</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="650" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw3)"/>
  <line x1="70" y1="300" x2="70" y2="70" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw3)"/>
  <text x="600" y="320" font-size="12" fill="#64748b">时间 →</text>
  <text x="16" y="66" font-size="12" fill="#64748b">线程数</text>

  <!-- gridlines -->
  <line x1="70" y1="250" x2="650" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="200" x2="650" y2="200" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="150" x2="650" y2="150" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="100" x2="650" y2="100" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="254" font-size="11" fill="#94a3b8" text-anchor="end">50</text>
  <text x="48" y="204" font-size="11" fill="#94a3b8" text-anchor="end">100</text>
  <text x="48" y="154" font-size="11" fill="#94a3b8" text-anchor="end">150</text>
  <text x="48" y="104" font-size="11" fill="#94a3b8" text-anchor="end">200</text>

  <!-- 一次性加压（红，瞬间拉满） -->
  <path d="M70,300 L80,100 L650,100" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="92" y="94" font-size="11.5" fill="#b91c1c">一次性拉满：制造假雪崩</text>

  <!-- 递增加压（蓝，斜坡） -->
  <path d="M70,300 L420,100 L650,100" fill="none" stroke="#2f6fd0" stroke-width="2.5"/>
  <text x="300" y="176" font-size="11.5" fill="#1b4f9c" transform="rotate(-30 300 176)">递增加压（ramp-up 线性斜坡）</text>

  <!-- 阶梯加压（橙，台阶） -->
  <path d="M70,300 L110,250 L210,250 L250,200 L350,200 L390,150 L490,150 L530,100 L650,100"
        fill="none" stroke="#d98324" stroke-width="2.5"/>
  <!-- hold markers -->
  <rect x="110" y="244" width="100" height="12" fill="#ffe0c2" opacity="0.85"/>
  <rect x="250" y="194" width="100" height="12" fill="#ffe0c2" opacity="0.85"/>
  <rect x="390" y="144" width="100" height="12" fill="#ffe0c2" opacity="0.85"/>
  <text x="160" y="240" font-size="11" fill="#96560f" text-anchor="middle">hold 5min</text>
  <text x="300" y="190" font-size="11" fill="#96560f" text-anchor="middle">hold 5min</text>
  <text x="440" y="140" font-size="11" fill="#96560f" text-anchor="middle">hold 5min</text>
  <text x="536" y="120" font-size="11.5" font-weight="700" fill="#96560f">阶梯加压</text>

  <!-- 说明卡片 -->
  <rect x="24" y="338" width="204" height="112" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="40" y="360" font-size="12.5" font-weight="700" fill="#b91c1c">一次性加压</text>
  <text x="40" y="380" font-size="11.5" fill="#334155">ramp-up = 0，200 线程同时起</text>
  <text x="40" y="398" font-size="11.5" fill="#334155">连接池瞬间被打爆</text>
  <text x="40" y="416" font-size="11.5" fill="#334155">缓存未预热 → 全打到 DB</text>
  <text x="40" y="436" font-size="11.5" fill="#334155">用途：只做突发流量专项</text>

  <rect x="238" y="338" width="204" height="112" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="254" y="360" font-size="12.5" font-weight="700" fill="#1b4f9c">递增加压</text>
  <text x="254" y="380" font-size="11.5" fill="#334155">ramp-up = 200s，每秒起 1 个</text>
  <text x="254" y="398" font-size="11.5" fill="#334155">曲线平滑，便于观察趋势</text>
  <text x="254" y="416" font-size="11.5" fill="#334155">缺点：无稳态平台期</text>
  <text x="254" y="436" font-size="11.5" fill="#334155">用途：常规负载测试</text>

  <rect x="452" y="338" width="204" height="112" rx="8" fill="#ffffff" stroke="#d98324"/>
  <text x="468" y="360" font-size="12.5" font-weight="700" fill="#96560f">阶梯加压</text>
  <text x="468" y="380" font-size="11.5" fill="#334155">50 → 100 → 150 → 200</text>
  <text x="468" y="398" font-size="11.5" fill="#334155">每级 hold 住取稳态均值</text>
  <text x="468" y="416" font-size="11.5" fill="#334155">能精确定位容量拐点</text>
  <text x="468" y="436" font-size="11.5" fill="#334155">用途：容量测试首选</text>
</svg>
