name: Deploy SDET Vault to GitHub Pages

"on":
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Site with Quartz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Quartz Engine
        run: |
          REPO_URL="https://github.com/jackyzha0/quartz.git"
          git clone --depth 1 "$REPO_URL" quartz-engine
          cd quartz-engine
          npm ci

      - name: Sync Vault Content
        run: |
          rm -rf quartz-engine/content/*
          rsync -av --exclude='quartz-engine' \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='.obsidian' \
                    --exclude='.claude' \
                    --exclude='.claudian' \
                    --exclude='.workbuddy' \
                    --exclude='scripts' \
                    --exclude='*.py' \
                    ./ quartz-engine/content/

      - name: Configure Indexes and Subpath
        run: |
          python3 scripts/prepare_quartz.py

      - name: Build Static Site
        run: |
          cd quartz-engine
          npx quartz build --output ../public
          touch ../public/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
