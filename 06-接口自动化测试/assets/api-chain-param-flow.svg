<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98324"/>
    </marker>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fd0"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#1f2d3d">接口串联：依赖参数的提取与传递链路</text>

  <text x="40" y="52" font-size="12.5" font-weight="700" fill="#2f6fd0">业务流步骤</text>
  <text x="405" y="52" font-size="12.5" font-weight="700" fill="#d98324">运行时上下文 ctx</text>

  <!-- steps -->
  <rect x="40" y="62" width="290" height="60" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="185" y="84" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">① POST /login</text>
  <text x="185" y="104" font-size="11.5" fill="#41546b" text-anchor="middle">提取 $.data.token</text>

  <rect x="40" y="152" width="290" height="60" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="185" y="174" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">② POST /orders（Header 带 token）</text>
  <text x="185" y="194" font-size="11.5" fill="#41546b" text-anchor="middle">提取 $.data.order_id</text>

  <rect x="40" y="242" width="290" height="60" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="185" y="264" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">③ GET /orders/{order_id}</text>
  <text x="185" y="284" font-size="11.5" fill="#41546b" text-anchor="middle">断言 status == "PAID"</text>

  <rect x="40" y="332" width="290" height="60" rx="6" fill="#e8eef5" stroke="#8a9bb0"/>
  <text x="185" y="354" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">④ DELETE /orders/{order_id}</text>
  <text x="185" y="374" font-size="11.5" fill="#41546b" text-anchor="middle">teardown 清理，避免脏数据累积</text>

  <!-- ctx -->
  <rect x="390" y="62" width="255" height="330" rx="8" fill="#fff8f0" stroke="#d98324" stroke-dasharray="5 3"/>

  <rect x="405" y="80" width="225" height="44" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="517" y="98" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">ctx["token"]</text>
  <text x="517" y="115" font-size="11.5" fill="#41546b" text-anchor="middle">"eyJhbGciOiJIUzI1NiIs…"</text>

  <rect x="405" y="170" width="225" height="44" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="517" y="188" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">ctx["order_id"]</text>
  <text x="517" y="205" font-size="11.5" fill="#41546b" text-anchor="middle">100231</text>

  <rect x="405" y="270" width="225" height="104" rx="6" fill="#fff3e3" stroke="#d98324"/>
  <text x="517" y="292" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">生命周期 = 一条业务流</text>
  <text x="517" y="312" font-size="11.5" fill="#41546b" text-anchor="middle">用 fixture 承载，函数级隔离</text>
  <text x="517" y="331" font-size="11.5" fill="#41546b" text-anchor="middle">禁止用模块级全局变量：</text>
  <text x="517" y="350" font-size="11.5" fill="#41546b" text-anchor="middle">会让用例互相污染、</text>
  <text x="517" y="366" font-size="11.5" fill="#41546b" text-anchor="middle">无法单独重跑和并发</text>

  <!-- step chain arrows -->
  <line x1="185" y1="122" x2="185" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="185" y1="212" x2="185" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="185" y1="302" x2="185" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- write arrows -->
  <line x1="332" y1="95" x2="403" y2="99" stroke="#d98324" stroke-width="1.5" marker-end="url(#arO)"/>
  <text x="366" y="86" font-size="11" font-weight="700" fill="#d98324" text-anchor="middle">写</text>
  <line x1="332" y1="185" x2="403" y2="189" stroke="#d98324" stroke-width="1.5" marker-end="url(#arO)"/>
  <text x="366" y="176" font-size="11" font-weight="700" fill="#d98324" text-anchor="middle">写</text>

  <!-- read arrows -->
  <line x1="403" y1="124" x2="334" y2="168" stroke="#2f6fd0" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arB)"/>
  <text x="372" y="152" font-size="11" font-weight="700" fill="#2f6fd0" text-anchor="middle">读</text>
  <line x1="403" y1="214" x2="334" y2="258" stroke="#2f6fd0" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arB)"/>
  <text x="372" y="242" font-size="11" font-weight="700" fill="#2f6fd0" text-anchor="middle">读</text>
  <line x1="403" y1="214" x2="334" y2="348" stroke="#2f6fd0" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arB)"/>

  <text x="20" y="422" font-size="11.5" fill="#41546b">要点：链路上每一环都可能失败，前置步骤只做「造数据」不做「测功能」，失败时应报「前置失败」而非业务断言失败。</text>
  <text x="20" y="442" font-size="11.5" fill="#41546b">提取用 JSONPath 表达式配置化，别硬编码 r.json()["data"]["list"][0]["id"]，结构一变全线用例崩。</text>
  <text x="20" y="462" font-size="11.5" fill="#41546b">④ 必须放在 fixture 的 yield 之后，保证 ③ 断言失败时清理照样执行。</text>
</svg>
