<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#1f2d3d">Mock 解耦上游依赖：三种拦截位置对比</text>
  <text x="20" y="50" font-size="12" fill="#41546b">同一条用例，把「谁来回答请求」换掉，拦截点越靠左越快、越靠右越真实。</text>

  <!-- row 1 -->
  <rect x="30" y="66" width="140" height="52" rx="6" fill="#e8eef5" stroke="#8a9bb0"/>
  <text x="100" y="89" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">pytest 用例</text>
  <text x="100" y="107" font-size="11" fill="#41546b" text-anchor="middle">不感知下面的差异</text>

  <rect x="228" y="66" width="185" height="52" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="320" y="89" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">requests 真实发包</text>
  <text x="320" y="107" font-size="11" fill="#41546b" text-anchor="middle">DNS → TCP → HTTP</text>

  <rect x="470" y="66" width="180" height="52" rx="6" fill="#fdeaea" stroke="#c0504d"/>
  <text x="560" y="89" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">真实上游服务</text>
  <text x="560" y="107" font-size="11" fill="#41546b" text-anchor="middle">慢 / 易挂 / 异常难造</text>

  <line x1="172" y1="92" x2="226" y2="92" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="415" y1="92" x2="468" y2="92" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="30" y="138" font-size="11.5" fill="#41546b">A · 不 Mock：能测真实集成，但上游一抖用例就红，且「余额不足 / 风控拒绝」这类分支几乎造不出来。</text>

  <!-- row 2 -->
  <rect x="30" y="162" width="140" height="52" rx="6" fill="#e8eef5" stroke="#8a9bb0"/>
  <text x="100" y="193" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">pytest 用例</text>

  <rect x="228" y="162" width="185" height="52" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="320" y="185" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">responses / mock</text>
  <text x="320" y="203" font-size="11" fill="#41546b" text-anchor="middle">在 HTTPAdapter 层截断</text>

  <rect x="470" y="162" width="180" height="52" rx="6" fill="#dff2e3" stroke="#3f8f5b"/>
  <text x="560" y="185" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">进程内预置响应</text>
  <text x="560" y="203" font-size="11" fill="#41546b" text-anchor="middle">不过网络，毫秒级</text>

  <line x1="172" y1="188" x2="226" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="415" y1="188" x2="468" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="30" y="234" font-size="11.5" fill="#41546b">B · 进程内打桩：最快、最好造异常（超时、500、脏数据），但只对本进程生效，测不到真实网络与序列化。</text>

  <!-- row 3 -->
  <rect x="30" y="258" width="140" height="52" rx="6" fill="#e8eef5" stroke="#8a9bb0"/>
  <text x="100" y="289" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">pytest 用例</text>

  <rect x="228" y="258" width="185" height="52" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="320" y="281" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">requests 真实发包</text>
  <text x="320" y="299" font-size="11" fill="#41546b" text-anchor="middle">base_url 指向本地</text>

  <rect x="470" y="258" width="180" height="52" rx="6" fill="#dff2e3" stroke="#3f8f5b"/>
  <text x="560" y="281" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">独立 Mock Server</text>
  <text x="560" y="299" font-size="11" fill="#41546b" text-anchor="middle">127.0.0.1:8000</text>

  <line x1="172" y1="284" x2="226" y2="284" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="415" y1="284" x2="468" y2="284" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="30" y="330" font-size="11.5" fill="#41546b">C · 独立服务：真过网络，被测服务、前端、其他团队都能共用，可随环境部署进 CI，代价是要维护一套服务。</text>

  <!-- contract -->
  <rect x="30" y="352" width="620" height="72" rx="8" fill="#fff8f0" stroke="#d98324" stroke-dasharray="5 3"/>
  <text x="46" y="376" font-size="12.5" font-weight="700" fill="#1f2d3d">共同风险 → 契约测试（Contract Testing）来兜</text>
  <text x="46" y="397" font-size="11.5" fill="#41546b">Mock 写死的是「我以为上游长这样」。上游真改了字段，Mock 不会红，线上会炸。</text>
  <text x="46" y="416" font-size="11.5" fill="#41546b">做法：消费者产出契约文件 → 提供者用同一份契约跑校验，双方任一方违约立刻在 CI 失败。</text>

  <text x="20" y="452" font-size="11.5" fill="#41546b">选型：单元/接口层用 B，联调与冒烟用 C，核心链路补 A 的少量真实回归，再用契约测试守住结构漂移。</text>
</svg>
