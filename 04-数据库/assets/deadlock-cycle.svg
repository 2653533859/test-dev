<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="darrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="dred" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">死锁：两个事务交叉加锁形成等待环</text>

  <!-- timeline -->
  <text x="20" y="58" font-size="12.5" font-weight="700" fill="#1f2d3d">时间线</text>

  <text x="105" y="58" font-size="12.5" font-weight="700" fill="#2f6fd0">事务 A</text>
  <text x="400" y="58" font-size="12.5" font-weight="700" fill="#d98324">事务 B</text>

  <line x1="70" y1="66" x2="70" y2="300" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="26" y="92" font-size="11.5" fill="#64748b">t1</text>
  <rect x="90" y="76" width="230" height="30" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="205" y="96" font-size="11.5" fill="#1f2d3d" text-anchor="middle">UPDATE 账户 1 → 持有 row1 锁</text>

  <text x="26" y="132" font-size="11.5" fill="#64748b">t2</text>
  <rect x="380" y="116" width="230" height="30" rx="5" fill="#ffe0c2" stroke="#d98324"/>
  <text x="495" y="136" font-size="11.5" fill="#1f2d3d" text-anchor="middle">UPDATE 账户 2 → 持有 row2 锁</text>

  <text x="26" y="172" font-size="11.5" fill="#64748b">t3</text>
  <rect x="90" y="156" width="230" height="30" rx="5" fill="#fde8e8" stroke="#c0392b"/>
  <text x="205" y="176" font-size="11.5" fill="#1f2d3d" text-anchor="middle">UPDATE 账户 2 → 等 row2（B 持有）</text>

  <text x="26" y="212" font-size="11.5" fill="#64748b">t4</text>
  <rect x="380" y="196" width="230" height="30" rx="5" fill="#fde8e8" stroke="#c0392b"/>
  <text x="495" y="216" font-size="11.5" fill="#1f2d3d" text-anchor="middle">UPDATE 账户 1 → 等 row1（A 持有）</text>

  <text x="26" y="256" font-size="11.5" fill="#64748b">t5</text>
  <rect x="90" y="240" width="520" height="30" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="350" y="260" font-size="11.5" font-weight="700" fill="#c0392b" text-anchor="middle">InnoDB 检测到等待环 → 回滚代价较小的事务，另一个继续执行</text>

  <text x="90" y="292" font-size="11.5" fill="#c0392b">ERROR 1213 (40001): Deadlock found when trying to get lock; try restarting transaction</text>

  <line x1="20" y1="312" x2="660" y2="312" stroke="#cbd5e1"/>

  <!-- wait graph -->
  <text x="20" y="338" font-size="12.5" font-weight="700" fill="#1f2d3d">等待关系图（出现环 = 死锁）</text>

  <circle cx="150" cy="392" r="42" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="150" y="388" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">事务 A</text>
  <text x="150" y="406" font-size="11" fill="#2f6fd0" text-anchor="middle">持 row1</text>

  <circle cx="390" cy="392" r="42" fill="#ffe0c2" stroke="#d98324" stroke-width="2"/>
  <text x="390" y="388" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">事务 B</text>
  <text x="390" y="406" font-size="11" fill="#d98324" text-anchor="middle">持 row2</text>

  <path d="M188,374 Q270,344 352,374" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#dred)"/>
  <text x="270" y="342" font-size="11.5" fill="#c0392b" text-anchor="middle">A 等待 row2</text>

  <path d="M352,410 Q270,440 188,410" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#dred)"/>
  <text x="270" y="458" font-size="11.5" fill="#c0392b" text-anchor="middle">B 等待 row1</text>

  <rect x="452" y="346" width="200" height="94" rx="8" fill="#e8f2e4" stroke="#5b8c4a"/>
  <text x="466" y="366" font-size="12.5" font-weight="700" fill="#1f2d3d">避免死锁</text>
  <text x="466" y="386" font-size="11.5" fill="#1f2d3d">· 按固定顺序访问资源</text>
  <text x="466" y="404" font-size="11.5" fill="#1f2d3d">· 缩短事务、尽早提交</text>
  <text x="466" y="422" font-size="11.5" fill="#1f2d3d">· 让加锁走索引，避免锁全表</text>
  <text x="466" y="437" font-size="11.5" fill="#1f2d3d">· 应用层捕获 1213 后重试</text>
</svg>
