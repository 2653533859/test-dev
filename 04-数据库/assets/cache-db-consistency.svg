<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6fd0"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98324"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#2f6fd0; stroke-width:1.5; }
      .lbl { fill:#1f2d3d; font-size:13px; }
      .sub { fill:#5b6b7b; font-size:11px; }
      .ttl { fill:#1f2d3d; font-size:15px; font-weight:700; }
      .o { fill:#ffe0c2; stroke:#d98324; stroke-width:1.5; }
      .b { fill:#d3e5ff; stroke:#2f6fd0; stroke-width:1.5; }
    </style>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>

  <text x="24" y="30" class="ttl">Cache-Aside 读写与一致性问题</text>

  <!-- 读路径 -->
  <text x="24" y="60" class="lbl" font-weight="700">读路径（Cache-Aside）</text>
  <rect x="24" y="72" width="150" height="46" class="b" rx="8"/>
  <text x="36" y="92" class="lbl">1. 查 Redis</text>
  <text x="36" y="110" class="sub">命中则直接返回</text>
  <rect x="190" y="72" width="160" height="46" class="o" rx="8"/>
  <text x="202" y="92" class="lbl">2. 未命中查 DB</text>
  <text x="202" y="110" class="sub">回源数据库</text>
  <rect x="366" y="72" width="160" height="46" class="b" rx="8"/>
  <text x="378" y="92" class="lbl">3. 写入 Redis</text>
  <text x="378" y="110" class="sub">set 并返回</text>
  <line x1="174" y1="95" x2="188" y2="95" stroke="#2f6fd0" marker-end="url(#ar)"/>
  <line x1="350" y1="95" x2="364" y2="95" stroke="#2f6fd0" marker-end="url(#ar)"/>

  <!-- 写路径 -->
  <text x="24" y="158" class="lbl" font-weight="700">写路径（先 DB 后删缓存，推荐）</text>
  <rect x="24" y="170" width="150" height="46" class="b" rx="8"/>
  <text x="36" y="190" class="lbl">1. 更新 DB</text>
  <text x="36" y="208" class="sub">事务内写库</text>
  <rect x="190" y="170" width="160" height="46" class="o" rx="8"/>
  <text x="202" y="190" class="lbl">2. 删除 Redis</text>
  <text x="202" y="208" class="sub">del，而非更新</text>
  <rect x="366" y="170" width="170" height="46" class="b" rx="8"/>
  <text x="378" y="190" class="lbl">3. 下次读回源重建</text>
  <text x="378" y="208" class="sub">lazy 更新缓存</text>
  <line x1="174" y1="193" x2="188" y2="193" stroke="#d98324" marker-end="url(#arr)"/>
  <line x1="350" y1="193" x2="364" y2="193" stroke="#2f6fd0" marker-end="url(#ar)"/>

  <!-- 不一致窗口 -->
  <rect x="24" y="246" width="380" height="120" class="box" rx="8"/>
  <text x="40" y="270" class="lbl" font-weight="700">典型不一致场景</text>
  <text x="40" y="294" class="sub">A: 读未命中 → 查到 DB 旧值 v1（准备写缓存）</text>
  <text x="40" y="314" class="sub">B: 更新 DB 为 v2 → 删除缓存</text>
  <text x="40" y="334" class="sub">A: 把旧值 v1 写入缓存！ → 缓存脏数据</text>
  <text x="40" y="356" class="sub">窗口极小但存在；靠「删缓存」+ 过期时间兜底</text>

  <!-- 测试点 -->
  <rect x="424" y="246" width="232" height="196" class="box" rx="8"/>
  <text x="440" y="270" class="lbl" font-weight="700">测试关注点</text>
  <text x="440" y="294" class="sub">· 并发读写后缓存是否脏</text>
  <text x="440" y="314" class="sub">· 删除缓存失败的重试</text>
  <text x="440" y="334" class="sub">· 双写(先更缓存)vs 删缓存</text>
  <text x="440" y="354" class="sub">· 过期时间兜底是否生效</text>
  <text x="440" y="374" class="sub">· 缓存与 DB 最终一致校验</text>
  <text x="440" y="394" class="sub">· 延迟双删是否必要的验证</text>
  <text x="440" y="418" class="sub">· 大 key / 热 key 对一致性的影响</text>

  <text x="24" y="396" class="sub">核心原则：缓存是「副本」，DB 才是真相源；不一致靠「删缓存 + TTL」收敛。</text>
</svg>
