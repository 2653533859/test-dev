<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="iarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">四种隔离级别与三类并发读问题</text>

  <!-- 脏读 -->
  <rect x="25" y="46" width="200" height="128" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="125" y="66" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">脏读 Dirty Read</text>
  <text x="38" y="88" font-size="11.5" fill="#1f2d3d">事务 A：UPDATE 余额 = 200</text>
  <text x="38" y="107" font-size="11.5" fill="#2f6fd0">事务 B：读到 200（未提交）</text>
  <text x="38" y="126" font-size="11.5" fill="#1f2d3d">事务 A：ROLLBACK</text>
  <text x="38" y="145" font-size="11.5" font-weight="700" fill="#c0392b">B 读到的 200 从未存在过</text>
  <text x="38" y="165" font-size="11" fill="#64748b">读到了别人未提交的数据</text>

  <!-- 不可重复读 -->
  <rect x="240" y="46" width="200" height="128" rx="8" fill="#ffffff" stroke="#d98324" stroke-width="1.5"/>
  <text x="340" y="66" font-size="13" font-weight="700" fill="#d98324" text-anchor="middle">不可重复读</text>
  <text x="253" y="88" font-size="11.5" fill="#2f6fd0">事务 B：读余额 = 100</text>
  <text x="253" y="107" font-size="11.5" fill="#1f2d3d">事务 A：UPDATE 200 并提交</text>
  <text x="253" y="126" font-size="11.5" fill="#2f6fd0">事务 B：再读余额 = 200</text>
  <text x="253" y="145" font-size="11.5" font-weight="700" fill="#d98324">同一行两次读值不同</text>
  <text x="253" y="165" font-size="11" fill="#64748b">针对 UPDATE，同一行内容变了</text>

  <!-- 幻读 -->
  <rect x="455" y="46" width="200" height="128" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="555" y="66" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">幻读 Phantom</text>
  <text x="468" y="88" font-size="11.5" fill="#2f6fd0">事务 B：查 age&gt;20 得 3 行</text>
  <text x="468" y="107" font-size="11.5" fill="#1f2d3d">事务 A：INSERT 一行并提交</text>
  <text x="468" y="126" font-size="11.5" fill="#2f6fd0">事务 B：再查得 4 行</text>
  <text x="468" y="145" font-size="11.5" font-weight="700" fill="#7c3aed">同一范围行数变了</text>
  <text x="468" y="165" font-size="11" fill="#64748b">针对 INSERT / DELETE，多出行</text>

  <!-- table -->
  <text x="25" y="204" font-size="13" font-weight="700" fill="#1f2d3d">隔离级别对三类问题的解决情况（隔离性越强，并发性能越低）</text>

  <rect x="25" y="216" width="630" height="32" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="120" y="237" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">隔离级别</text>
  <text x="300" y="237" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">脏读</text>
  <text x="410" y="237" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">不可重复读</text>
  <text x="520" y="237" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">幻读</text>
  <text x="612" y="237" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">性能</text>

  <rect x="25" y="248" width="630" height="32" fill="#fde8e8" stroke="#cbd5e1"/>
  <text x="120" y="269" font-size="12" fill="#1f2d3d" text-anchor="middle">READ UNCOMMITTED</text>
  <text x="300" y="269" font-size="12" fill="#c0392b" text-anchor="middle">会发生</text>
  <text x="410" y="269" font-size="12" fill="#c0392b" text-anchor="middle">会发生</text>
  <text x="520" y="269" font-size="12" fill="#c0392b" text-anchor="middle">会发生</text>
  <text x="612" y="269" font-size="12" fill="#5b8c4a" text-anchor="middle">最高</text>

  <rect x="25" y="280" width="630" height="32" fill="#fff4e6" stroke="#cbd5e1"/>
  <text x="120" y="301" font-size="12" fill="#1f2d3d" text-anchor="middle">READ COMMITTED</text>
  <text x="300" y="301" font-size="12" fill="#5b8c4a" text-anchor="middle">解决</text>
  <text x="410" y="301" font-size="12" fill="#c0392b" text-anchor="middle">会发生</text>
  <text x="520" y="301" font-size="12" fill="#c0392b" text-anchor="middle">会发生</text>
  <text x="612" y="301" font-size="12" fill="#5b8c4a" text-anchor="middle">高</text>

  <rect x="25" y="312" width="630" height="32" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="120" y="333" font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">REPEATABLE READ</text>
  <text x="300" y="333" font-size="12" fill="#5b8c4a" text-anchor="middle">解决</text>
  <text x="410" y="333" font-size="12" fill="#5b8c4a" text-anchor="middle">解决</text>
  <text x="520" y="333" font-size="12" fill="#5b8c4a" text-anchor="middle">基本解决</text>
  <text x="612" y="333" font-size="12" fill="#d98324" text-anchor="middle">中</text>

  <rect x="25" y="344" width="630" height="32" fill="#e8f2e4" stroke="#cbd5e1"/>
  <text x="120" y="365" font-size="12" fill="#1f2d3d" text-anchor="middle">SERIALIZABLE</text>
  <text x="300" y="365" font-size="12" fill="#5b8c4a" text-anchor="middle">解决</text>
  <text x="410" y="365" font-size="12" fill="#5b8c4a" text-anchor="middle">解决</text>
  <text x="520" y="365" font-size="12" fill="#5b8c4a" text-anchor="middle">解决</text>
  <text x="612" y="365" font-size="12" fill="#c0392b" text-anchor="middle">最低</text>

  <text x="30" y="332" font-size="11" font-weight="700" fill="#2f6fd0">◀ MySQL 默认</text>

  <!-- notes -->
  <rect x="25" y="390" width="630" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="410" font-size="11.8" fill="#1f2d3d">MySQL 的 RR 靠两套机制处理幻读：快照读（普通 SELECT）用 MVCC 读同一版本，看不到新行；</text>
  <text x="38" y="430" font-size="11.8" fill="#1f2d3d">当前读（SELECT ... FOR UPDATE / UPDATE / DELETE）用 Next-Key Lock 锁住区间，阻止别人插入。</text>

  <text x="20" y="460" font-size="11.5" fill="#64748b">注意：RR 下先快照读再当前读，仍可能读到别人新插入的行，所以说「基本解决」而非完全消除。</text>
</svg>
