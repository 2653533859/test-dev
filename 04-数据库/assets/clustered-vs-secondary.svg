<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="carrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="corange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98324"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">聚簇索引 vs 二级索引：回表是怎么发生的</text>
  <text x="20" y="52" font-size="12" fill="#64748b">SELECT * FROM user WHERE name = '王五'　（主键 id，二级索引 idx_name）</text>

  <!-- secondary index tree -->
  <rect x="25" y="72" width="290" height="212" rx="8" fill="#ffffff" stroke="#d98324" stroke-width="1.5"/>
  <text x="40" y="94" font-size="13.5" font-weight="700" fill="#d98324">二级索引 idx_name（非聚簇）</text>

  <rect x="105" y="106" width="130" height="30" rx="5" fill="#ffe0c2" stroke="#d98324"/>
  <text x="170" y="126" font-size="12" fill="#1f2d3d" text-anchor="middle">李四 | 王五</text>

  <rect x="45"  y="170" width="115" height="46" rx="5" fill="#fff4e6" stroke="#d98324"/>
  <text x="102" y="188" font-size="11.5" fill="#1f2d3d" text-anchor="middle">张三 → id 1</text>
  <text x="102" y="206" font-size="11.5" fill="#1f2d3d" text-anchor="middle">李四 → id 2</text>

  <rect x="180" y="170" width="115" height="46" rx="5" fill="#ffe0c2" stroke="#d98324" stroke-width="2"/>
  <text x="237" y="188" font-size="11.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">王五 → id 3</text>
  <text x="237" y="206" font-size="11.5" fill="#1f2d3d" text-anchor="middle">赵六 → id 4</text>

  <line x1="140" y1="136" x2="105" y2="168" stroke="#475569" stroke-width="1.3" marker-end="url(#carrow)"/>
  <line x1="200" y1="136" x2="230" y2="168" stroke="#d98324" stroke-width="2" marker-end="url(#corange)"/>

  <text x="40" y="240" font-size="11.5" fill="#64748b">叶子节点只存：索引列 + 主键值</text>
  <text x="40" y="260" font-size="11.5" fill="#64748b">拿不到 city / age 等其他列</text>
  <text x="40" y="277" font-size="11.5" font-weight="700" fill="#d98324">① 命中王五，取得主键 id = 3</text>

  <!-- clustered index tree -->
  <rect x="365" y="72" width="290" height="212" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="380" y="94" font-size="13.5" font-weight="700" fill="#2f6fd0">聚簇索引（主键 id，即表本身）</text>

  <rect x="445" y="106" width="130" height="30" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="510" y="126" font-size="12" fill="#1f2d3d" text-anchor="middle">1 | 3</text>

  <rect x="385" y="170" width="115" height="46" rx="5" fill="#eaf2ff" stroke="#2f6fd0"/>
  <text x="442" y="188" font-size="11.5" fill="#1f2d3d" text-anchor="middle">1 张三 北京 28</text>
  <text x="442" y="206" font-size="11.5" fill="#1f2d3d" text-anchor="middle">2 李四 上海 35</text>

  <rect x="520" y="170" width="120" height="46" rx="5" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="580" y="188" font-size="11.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">3 王五 北京 22</text>
  <text x="580" y="206" font-size="11.5" fill="#1f2d3d" text-anchor="middle">4 赵六 — 41</text>

  <line x1="480" y1="136" x2="445" y2="168" stroke="#475569" stroke-width="1.3" marker-end="url(#carrow)"/>
  <line x1="540" y1="136" x2="570" y2="168" stroke="#d98324" stroke-width="2" marker-end="url(#corange)"/>

  <text x="380" y="240" font-size="11.5" fill="#64748b">叶子节点存：主键 + 整行数据</text>
  <text x="380" y="260" font-size="11.5" fill="#64748b">一张表有且只有一棵聚簇索引树</text>
  <text x="380" y="277" font-size="11.5" font-weight="700" fill="#d98324">② 用 id = 3 再查一次，拿到整行</text>

  <!-- 回表 arrow -->
  <line x1="300" y1="193" x2="378" y2="193" stroke="#d98324" stroke-width="2.5" marker-end="url(#corange)"/>
  <text x="339" y="184" font-size="12" font-weight="700" fill="#d98324" text-anchor="middle">回表</text>

  <!-- covering index -->
  <rect x="25" y="300" width="630" height="100" rx="8" fill="#e8f2e4" stroke="#5b8c4a"/>
  <text x="42" y="322" font-size="13.5" font-weight="700" fill="#1f2d3d">覆盖索引：不回表的写法</text>
  <text x="42" y="345" font-size="12" fill="#1f2d3d">SELECT id, name FROM user WHERE name = '王五'　→ 需要的列 (name, id) 二级索引叶子上全都有</text>
  <text x="42" y="366" font-size="12" fill="#1f2d3d">→ 查到 ① 就直接返回，省掉 ② 这一次 B+ 树查找，EXPLAIN 的 Extra 显示 Using index</text>
  <text x="42" y="388" font-size="12" fill="#5b8c4a">优化手段：把高频查询要用到的少量列加进联合索引，让它变成覆盖索引</text>

  <text x="20" y="428" font-size="11.5" fill="#64748b">要点：二级索引叶子存的是主键值而不是行地址——因为行会随页分裂移动，存主键就不用维护物理地址。</text>
  <text x="20" y="448" font-size="11.5" fill="#64748b">代价：主键越大（如 UUID 36 字节），每一棵二级索引都跟着膨胀，所以主键要短且自增。</text>
</svg>
