<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#1f2d3d">cron：表达式解析与调度流程</text>

  <!-- ① 五字段解析 -->
  <rect x="16" y="44" width="648" height="138" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="66" font-size="14" font-weight="700" fill="#2f6fd0">① crontab 五字段：分 时 日 月 周</text>

  <rect x="60" y="80" width="80" height="38" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="100" y="104" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">*</text>
  <text x="100" y="130" font-size="11" fill="#1e3a8a" text-anchor="middle">分 0-59</text>

  <rect x="148" y="80" width="80" height="38" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="188" y="104" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">*</text>
  <text x="188" y="130" font-size="11" fill="#1e3a8a" text-anchor="middle">时 0-23</text>

  <rect x="236" y="80" width="80" height="38" rx="5" fill="#ffe0c2" stroke="#d98324"/>
  <text x="276" y="104" font-size="15" font-weight="700" fill="#8a4b08" text-anchor="middle">*</text>
  <text x="276" y="130" font-size="11" fill="#8a4b08" text-anchor="middle">日 1-31</text>

  <rect x="324" y="80" width="80" height="38" rx="5" fill="#ffe0c2" stroke="#d98324"/>
  <text x="364" y="104" font-size="15" font-weight="700" fill="#8a4b08" text-anchor="middle">*</text>
  <text x="364" y="130" font-size="11" fill="#8a4b08" text-anchor="middle">月 1-12</text>

  <rect x="412" y="80" width="80" height="38" rx="5" fill="#d4edda" stroke="#28a745"/>
  <text x="452" y="104" font-size="15" font-weight="700" fill="#1b5e20" text-anchor="middle">*</text>
  <text x="452" y="130" font-size="11" fill="#1b5e20" text-anchor="middle">周 0-7</text>

  <rect x="500" y="80" width="148" height="38" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="574" y="104" font-size="12" fill="#334155" text-anchor="middle">command</text>

  <text x="32" y="150" font-size="11.5" fill="#1f2d3d">特殊符号：, 枚举  - 范围  / 步长  @reboot 开机一次  @daily 等价 0 0 * * *</text>
  <text x="32" y="170" font-size="11.5" fill="#dc2626" font-weight="700">反直觉：日和周同时非 * 时是「或」关系 → 0 0 1 * 1 = 每月1号 或 每周一（一个月跑5次，不是每月第一个周一）</text>

  <!-- ② 调度流程 -->
  <rect x="16" y="192" width="648" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="214" font-size="14" font-weight="700" fill="#d98324">② crond 调度流程</text>

  <rect x="32" y="228" width="100" height="36" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="82" y="250" font-size="11.5" fill="#334155" text-anchor="middle">crond 守护进程</text>
  <line x1="132" y1="246" x2="150" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="152" y="228" width="116" height="36" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="210" y="244" font-size="11" fill="#1e3a8a" text-anchor="middle">每分钟醒来</text>
  <text x="210" y="258" font-size="10" fill="#1e3a8a" text-anchor="middle">扫所有 crontab</text>
  <line x1="268" y1="246" x2="286" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="288" y="228" width="116" height="36" rx="5" fill="#ffe0c2" stroke="#d98324"/>
  <text x="346" y="244" font-size="11" fill="#8a4b08" text-anchor="middle">时间字段匹配</text>
  <text x="346" y="258" font-size="10" fill="#8a4b08" text-anchor="middle">当前时分比对</text>
  <line x1="404" y1="246" x2="422" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="424" y="228" width="116" height="36" rx="5" fill="#d4edda" stroke="#28a745"/>
  <text x="482" y="244" font-size="11" fill="#1b5e20" text-anchor="middle">fork 执行命令</text>
  <text x="482" y="258" font-size="10" fill="#1b5e20" text-anchor="middle">最小环境</text>
  <line x1="540" y1="246" x2="558" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="228" width="88" height="36" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="604" y="250" font-size="11" fill="#334155" text-anchor="middle">输出→邮件</text>

  <text x="32" y="284" font-size="11.5" fill="#dc2626">关键：cron 不读 .bashrc，PATH 只有 /usr/bin:/bin，工作目录是家目录，% 必须转义成 \%</text>
  <text x="32" y="302" font-size="11.5" fill="#475569">排查杀手锏：env -i /bin/bash --noprofile --norc -c '脚本路径' 用干净环境复现「手动跑通 cron 跑挂」的问题</text>

  <!-- ③ 防重叠 + 日志 -->
  <rect x="16" y="320" width="318" height="134" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="342" font-size="14" font-weight="700" fill="#2f6fd0">③ flock 防重叠 + 重定向</text>

  <rect x="32" y="356" width="286" height="32" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="42" y="376" font-size="11" fill="#1e3a8a">*/5 * * * * /usr/bin/flock -n /var/lock/x.lock</text>
  <text x="42" y="386" font-size="10.5" fill="#1e3a8a">　/opt/tools/collect.sh</text>

  <text x="32" y="406" font-size="11" fill="#475569">任务执行时间超过调度间隔 → 多实例并发</text>
  <text x="32" y="422" font-size="11" fill="#475569">flock -n 抢不到锁就退出，避免：</text>
  <text x="32" y="438" font-size="11" fill="#dc2626">· 日志错乱　· 数据重复处理　· 资源争抢</text>

  <!-- ④ cron vs systemd timer -->
  <rect x="346" y="320" width="318" height="134" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="362" y="342" font-size="14" font-weight="700" fill="#28a745">④ cron vs systemd timer</text>

  <rect x="362" y="356" width="142" height="32" rx="5" fill="#ffe0c2" stroke="#d98324"/>
  <text x="433" y="376" font-size="11" fill="#8a4b08" text-anchor="middle">cron</text>

  <rect x="510" y="356" width="142" height="32" rx="5" fill="#d4edda" stroke="#28a745"/>
  <text x="581" y="376" font-size="11" fill="#1b5e20" text-anchor="middle">systemd timer</text>

  <text x="362" y="404" font-size="11" fill="#475569">一行配置　vs　.service + .timer 两文件</text>
  <text x="362" y="420" font-size="11" fill="#475569">无日志　vs　journald 自动收录</text>
  <text x="362" y="436" font-size="11" fill="#475569">错过不补　vs　Persistent=true 补跑</text>
  <text x="362" y="452" font-size="11" fill="#475569">无依赖　vs　支持 After/Requires 依赖</text>
</svg>
