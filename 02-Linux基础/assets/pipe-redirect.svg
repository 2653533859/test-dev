<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98324"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#1f2d3d">管道与重定向：三个文件描述符的数据流向</text>

  <!-- ① fd 模型 -->
  <rect x="16" y="42" width="648" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="30" y="64" font-size="13.5" font-weight="700" fill="#2f6fd0">① 每个进程启动就带三个描述符</text>

  <rect x="30" y="80" width="96" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="78" y="102" font-size="12" fill="#334155" text-anchor="middle">键盘 / 文件</text>
  <line x1="128" y1="97" x2="184" y2="97" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="156" y="90" font-size="11" fill="#64748b" text-anchor="middle">fd 0</text>

  <rect x="188" y="72" width="150" height="76" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="263" y="96" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">进程</text>
  <text x="263" y="116" font-size="11.5" fill="#1e3a8a" text-anchor="middle">0 stdin　1 stdout</text>
  <text x="263" y="134" font-size="11.5" fill="#1e3a8a" text-anchor="middle">2 stderr</text>

  <line x1="340" y1="88" x2="418" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="379" y="81" font-size="11" fill="#64748b" text-anchor="middle">fd 1 正常输出</text>
  <rect x="422" y="72" width="120" height="30" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="482" y="92" font-size="12" fill="#334155" text-anchor="middle">屏幕 &gt; 文件</text>

  <line x1="340" y1="132" x2="418" y2="132" stroke="#d98324" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="379" y="125" font-size="11" fill="#d98324" text-anchor="middle">fd 2 错误输出</text>
  <rect x="422" y="116" width="120" height="30" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="482" y="136" font-size="12" fill="#8a4b08" text-anchor="middle">屏幕 2&gt; 文件</text>

  <text x="556" y="94" font-size="11.5" fill="#64748b">fd 1 与 fd 2</text>
  <text x="556" y="112" font-size="11.5" fill="#64748b">是两条独立</text>
  <text x="556" y="130" font-size="11.5" fill="#64748b">通道</text>

  <!-- ② 管道 -->
  <rect x="16" y="182" width="648" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="30" y="204" font-size="13.5" font-weight="700" fill="#2f6fd0">② 管道 cat access.log | grep 500 | wc -l —— 前者的 fd1 接后者的 fd0</text>

  <rect x="34" y="222" width="120" height="44" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="94" y="242" font-size="12.5" fill="#1e3a8a" text-anchor="middle">cat</text>
  <text x="94" y="259" font-size="11" fill="#1e3a8a" text-anchor="middle">fd1 →</text>

  <rect x="176" y="228" width="92" height="32" rx="16" fill="#ffe0c2" stroke="#d98324"/>
  <text x="222" y="249" font-size="11.5" fill="#8a4b08" text-anchor="middle">内核管道缓冲</text>
  <line x1="156" y1="244" x2="174" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="244" x2="288" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="292" y="222" width="120" height="44" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="352" y="242" font-size="12.5" fill="#1e3a8a" text-anchor="middle">grep 500</text>
  <text x="352" y="259" font-size="11" fill="#1e3a8a" text-anchor="middle">← fd0　fd1 →</text>

  <rect x="434" y="228" width="92" height="32" rx="16" fill="#ffe0c2" stroke="#d98324"/>
  <text x="480" y="249" font-size="11.5" fill="#8a4b08" text-anchor="middle">内核管道缓冲</text>
  <line x1="414" y1="244" x2="432" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="528" y1="244" x2="546" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="222" width="98" height="44" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="599" y="248" font-size="12.5" fill="#1e3a8a" text-anchor="middle">wc -l</text>

  <text x="34" y="292" font-size="12" fill="#dc2626">注意：只有 fd1 进管道，fd2 仍直接打到屏幕；要让错误也进管道用 |&amp; 或 2&gt;&amp;1 |。三段进程是并发启动的，不是串行跑完再传。</text>

  <!-- ③ 2>&1 顺序 -->
  <rect x="16" y="322" width="648" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="30" y="344" font-size="13.5" font-weight="700" fill="#d98324">③ 2&gt;&amp;1 的位置决定成败：它复制的是「当时」fd1 指向的地方</text>

  <rect x="34" y="358" width="292" height="80" rx="6" fill="#eaf7ee" stroke="#3f9d5a"/>
  <text x="180" y="378" font-size="12.5" font-weight="700" fill="#1d6b36" text-anchor="middle">cmd &gt; out.log 2&gt;&amp;1　✅</text>
  <text x="46" y="398" font-size="11.5" fill="#1d6b36">1. fd1 先改指向 out.log</text>
  <text x="46" y="416" font-size="11.5" fill="#1d6b36">2. fd2 复制 fd1 → 也指向 out.log</text>
  <text x="46" y="432" font-size="11.5" fill="#1d6b36">结果：正常输出 + 错误 都进文件</text>

  <rect x="352" y="358" width="296" height="80" rx="6" fill="#fdeaea" stroke="#dc2626"/>
  <text x="500" y="378" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">cmd 2&gt;&amp;1 &gt; out.log　❌</text>
  <text x="364" y="398" font-size="11.5" fill="#991b1b">1. fd2 复制此刻的 fd1 → 屏幕</text>
  <text x="364" y="416" font-size="11.5" fill="#991b1b">2. fd1 才改指向 out.log</text>
  <text x="364" y="432" font-size="11.5" fill="#991b1b">结果：错误仍打屏幕，日志里丢报错</text>
</svg>
