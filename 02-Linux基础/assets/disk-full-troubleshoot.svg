<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">磁盘满排查链路：No space left on device 的三条分支</text>

  <!-- 入口 -->
  <rect x="248" y="48" width="184" height="42" rx="6" fill="#fdeaea" stroke="#dc2626"/>
  <text x="340" y="74" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">写入报错 / 服务启动失败</text>

  <line x1="340" y1="92" x2="340" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="248" y="120" width="184" height="42" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="340" y="139" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">df -h　先定位是哪个分区</text>
  <text x="340" y="155" font-size="11.5" fill="#1e3a8a" text-anchor="middle">看 Use% 和 Mounted on</text>

  <!-- 三分支横线 -->
  <line x1="340" y1="164" x2="340" y2="182" stroke="#475569" stroke-width="1.5"/>
  <line x1="116" y1="182" x2="564" y2="182" stroke="#475569" stroke-width="1.5"/>
  <line x1="116" y1="182" x2="116" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="182" x2="340" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="564" y1="182" x2="564" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 分支一：真满 -->
  <rect x="24" y="216" width="184" height="52" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="116" y="236" font-size="12.5" font-weight="700" fill="#8a4b08" text-anchor="middle">① Use% = 100%</text>
  <text x="116" y="255" font-size="11.5" fill="#8a4b08" text-anchor="middle">空间真的被占满</text>

  <line x1="116" y1="270" x2="116" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="296" width="184" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="116" y="316" font-size="12" fill="#1f2d3d" text-anchor="middle">du -x -h --max-depth=1 /</text>
  <text x="116" y="333" font-size="12" fill="#1f2d3d" text-anchor="middle">按目录逐层下钻</text>
  <text x="116" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">或 find / -xdev -size +1G</text>

  <!-- 分支二：inode -->
  <rect x="248" y="216" width="184" height="52" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="340" y="236" font-size="12.5" font-weight="700" fill="#8a4b08" text-anchor="middle">② 有空间却报满</text>
  <text x="340" y="255" font-size="11.5" fill="#8a4b08" text-anchor="middle">df -i 看 IUse% = 100%</text>

  <line x1="340" y1="270" x2="340" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="248" y="296" width="184" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="340" y="316" font-size="12" fill="#1f2d3d" text-anchor="middle">inode 耗尽：小文件太多</text>
  <text x="340" y="333" font-size="11.5" fill="#64748b" text-anchor="middle">session / 缓存 / 邮件队列</text>
  <text x="340" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">按目录数文件数定位</text>

  <!-- 分支三：deleted -->
  <rect x="472" y="216" width="184" height="52" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="564" y="236" font-size="12.5" font-weight="700" fill="#8a4b08" text-anchor="middle">③ df 满但 du 算不出</text>
  <text x="564" y="255" font-size="11.5" fill="#8a4b08" text-anchor="middle">两者对不上</text>

  <line x1="564" y1="270" x2="564" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="472" y="296" width="184" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="564" y="316" font-size="12" fill="#1f2d3d" text-anchor="middle">lsof +L1 / lsof | grep deleted</text>
  <text x="564" y="333" font-size="11.5" fill="#64748b" text-anchor="middle">文件已删但进程仍持句柄</text>
  <text x="564" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">inode 未回收</text>

  <!-- 汇总处置 -->
  <line x1="116" y1="360" x2="116" y2="384" stroke="#475569" stroke-width="1.5"/>
  <line x1="340" y1="360" x2="340" y2="384" stroke="#475569" stroke-width="1.5"/>
  <line x1="564" y1="360" x2="564" y2="384" stroke="#475569" stroke-width="1.5"/>
  <line x1="116" y1="384" x2="564" y2="384" stroke="#475569" stroke-width="1.5"/>
  <line x1="340" y1="384" x2="340" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="404" width="560" height="50" rx="6" fill="#eaf7ee" stroke="#3f9d5a"/>
  <text x="340" y="424" font-size="12.5" font-weight="700" fill="#1d6b36" text-anchor="middle">处置：① 归档/删除大文件 + 配 logrotate　② 批量清小文件（xargs 分批，别一次 rm 百万个）</text>
  <text x="340" y="443" font-size="12.5" font-weight="700" fill="#1d6b36" text-anchor="middle">③ 重启持句柄的进程，或应急 : &gt; /proc/&lt;pid&gt;/fd/&lt;n&gt; 截断</text>
</svg>
