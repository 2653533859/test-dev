<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">进程状态切换：ps 里的 R / S / D / T / Z 分别怎么来的</text>

  <!-- fork -->
  <rect x="22" y="86" width="104" height="46" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="74" y="106" font-size="12.5" fill="#334155" text-anchor="middle">fork / exec</text>
  <text x="74" y="123" font-size="11.5" fill="#64748b" text-anchor="middle">新建进程</text>

  <line x1="128" y1="109" x2="176" y2="109" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- R -->
  <rect x="180" y="80" width="170" height="58" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="265" y="103" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">R  Running / Runnable</text>
  <text x="265" y="124" font-size="11.5" fill="#1e3a8a" text-anchor="middle">正在 CPU 上跑，或在就绪队列排队</text>

  <!-- Z -->
  <line x1="352" y1="99" x2="418" y2="99" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="92" font-size="11" fill="#64748b" text-anchor="middle">exit()</text>
  <rect x="422" y="76" width="112" height="46" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="478" y="96" font-size="13" font-weight="700" fill="#8a4b08" text-anchor="middle">Z  Zombie</text>
  <text x="478" y="113" font-size="11" fill="#8a4b08" text-anchor="middle">僵尸：只剩退出码</text>

  <line x1="536" y1="99" x2="576" y2="99" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="92" font-size="10.5" fill="#64748b" text-anchor="middle">父 wait()</text>
  <rect x="580" y="76" width="76" height="46" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="618" y="96" font-size="12.5" fill="#334155" text-anchor="middle">X 回收</text>
  <text x="618" y="113" font-size="11" fill="#64748b" text-anchor="middle">PID 释放</text>

  <!-- S -->
  <line x1="246" y1="140" x2="246" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="168" font-size="11" fill="#64748b">等网络 / 锁 / sleep</text>
  <line x1="292" y1="196" x2="292" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="172" font-size="11" fill="#64748b">事件就绪 / 收到信号</text>

  <rect x="180" y="200" width="170" height="56" rx="6" fill="#eaf7ee" stroke="#3f9d5a"/>
  <text x="265" y="222" font-size="13" font-weight="700" fill="#1d6b36" text-anchor="middle">S  可中断睡眠</text>
  <text x="265" y="242" font-size="11.5" fill="#1d6b36" text-anchor="middle">绝大多数进程的常态，可被信号唤醒</text>

  <!-- D -->
  <line x1="180" y1="128" x2="118" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="18" y="170" font-size="11" fill="#64748b">磁盘 / NFS I/O</text>

  <rect x="22" y="200" width="140" height="56" rx="6" fill="#fdeaea" stroke="#dc2626"/>
  <text x="92" y="222" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">D  不可中断睡眠</text>
  <text x="92" y="242" font-size="11.5" fill="#991b1b" text-anchor="middle">连 SIGKILL 都不响应</text>

  <!-- T -->
  <line x1="350" y1="128" x2="452" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="160" font-size="11" fill="#64748b">Ctrl+Z / SIGSTOP</text>
  <line x1="520" y1="196" x2="520" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="176" font-size="11" fill="#64748b">fg / bg / SIGCONT</text>

  <rect x="424" y="200" width="170" height="56" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="509" y="222" font-size="13" font-weight="700" fill="#8a4b08" text-anchor="middle">T  已停止</text>
  <text x="509" y="242" font-size="11.5" fill="#8a4b08" text-anchor="middle">保留现场，不占 CPU</text>

  <!-- 信号说明 -->
  <rect x="16" y="284" width="648" height="168" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="308" font-size="14" font-weight="700" fill="#2f6fd0">kill 发的是信号，不是「杀」</text>

  <text x="34" y="332" font-size="12.5" fill="#1f2d3d">kill -15 SIGTERM（默认）：可被捕获 → 进程执行清理钩子、落盘、关连接后自行退出　✅ 优先用</text>
  <text x="34" y="354" font-size="12.5" fill="#1f2d3d">kill -2  SIGINT：等价 Ctrl+C，同样可捕获</text>
  <text x="34" y="376" font-size="12.5" fill="#1f2d3d">kill -1  SIGHUP：终端挂断；很多服务把它重定义为「重载配置」（如 nginx -s reload）</text>
  <text x="34" y="398" font-size="12.5" fill="#991b1b">kill -9  SIGKILL：内核直接干掉，不可捕获不可忽略 → 缓冲区数据丢失、锁文件残留、临时文件不清理</text>
  <text x="34" y="424" font-size="12" fill="#64748b">处于 D 状态的进程对任何信号都不响应，kill -9 也无效，只能等 I/O 返回或排查底层存储；</text>
  <text x="34" y="442" font-size="12" fill="#64748b">Z 状态进程已经死了，kill 无意义，要处理它的父进程（父进程退出后由 init/systemd 收养并回收）。</text>
</svg>
