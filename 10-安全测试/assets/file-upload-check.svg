<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">文件上传：五层校验链，以及每层各自会被怎么绕过</text>

  <rect x="20" y="46" width="640" height="32" rx="6" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="340" y="67" font-size="12.5" fill="#31527a" text-anchor="middle">风险本质：上传的文件如果落在「Web 可访问 + 可被解释执行」的目录里，就等于给了对方一个远程执行入口</text>

  <!-- layers -->
  <rect x="20" y="92" width="180" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="114" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">L1 前端 accept 限制</text>
  <text x="110" y="134" font-size="11.5" fill="#475569" text-anchor="middle">只是体验优化</text>

  <rect x="250" y="92" width="410" height="58" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="264" y="113" font-size="12" font-weight="700" fill="#8a4b00">绕过方式</text>
  <text x="264" y="133" font-size="11.5" fill="#1f2d3d">直接用抓包工具改请求体，或写脚本直接调接口——前端校验从不构成防线</text>
  <line x1="200" y1="121" x2="248" y2="121" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="160" width="180" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="182" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">L2 扩展名黑名单</text>
  <text x="110" y="202" font-size="11.5" fill="#475569" text-anchor="middle">禁 .php/.jsp…</text>

  <rect x="250" y="160" width="410" height="58" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="264" y="181" font-size="12" font-weight="700" fill="#8a4b00">绕过方式</text>
  <text x="264" y="201" font-size="11.5" fill="#1f2d3d">大小写变形、少见后缀、末尾加点或空格、双写后缀——黑名单永远列不全</text>
  <line x1="200" y1="189" x2="248" y2="189" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="228" width="180" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="250" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">L3 Content-Type</text>
  <text x="110" y="270" font-size="11.5" fill="#475569" text-anchor="middle">判断 MIME 头</text>

  <rect x="250" y="228" width="410" height="58" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="264" y="249" font-size="12" font-weight="700" fill="#8a4b00">绕过方式</text>
  <text x="264" y="269" font-size="11.5" fill="#1f2d3d">MIME 由客户端自报，改成 image/png 即可通过——不能作为唯一依据</text>
  <line x1="200" y1="257" x2="248" y2="257" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="296" width="180" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="318" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">L4 文件头/魔数</text>
  <text x="110" y="338" font-size="11.5" fill="#475569" text-anchor="middle">读前几字节判类型</text>

  <rect x="250" y="296" width="410" height="58" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="264" y="317" font-size="12" font-weight="700" fill="#8a4b00">绕过方式</text>
  <text x="264" y="337" font-size="11.5" fill="#1f2d3d">在合法图片头后追加内容做成「图片马」；配合解析配置错误仍可能被执行</text>
  <line x1="200" y1="325" x2="248" y2="325" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="364" width="180" height="58" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="110" y="386" font-size="12.5" font-weight="700" fill="#1a4a8f" text-anchor="middle">L5 存储与访问隔离</text>
  <text x="110" y="406" font-size="11.5" fill="#31527a" text-anchor="middle">真正的防线</text>

  <rect x="250" y="364" width="410" height="58" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="264" y="385" font-size="12" font-weight="700" fill="#1a4a8f">正确做法</text>
  <text x="264" y="404" font-size="11.5" fill="#1f2d3d">随机重命名 + 后缀白名单 + 存对象存储/非 Web 目录 + 独立域名下发 + 目录禁执行</text>
  <line x1="200" y1="393" x2="248" y2="393" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="444" font-size="11.5" fill="#64748b">测试清单：改后缀、改 MIME、超大文件、0 字节文件、路径穿越文件名、同名覆盖、上传后能否直接访问到原始路径。</text>
  <text x="20" y="462" font-size="11.5" fill="#64748b">验证只在 DVWA / upload-labs / Juice Shop 等自有靶场进行，上传的探针文件应为无害内容并在测完后清理。</text>
</svg>
