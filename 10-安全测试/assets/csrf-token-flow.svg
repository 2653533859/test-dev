<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">CSRF：浏览器自动带 Cookie 是根因，Token 让请求「不可伪造」</text>

  <!-- attack flow -->
  <rect x="16" y="44" width="648" height="176" rx="10" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="32" y="66" font-size="14" font-weight="700" fill="#8a4b00">无防护：恶意页面借用受害者已登录的会话</text>

  <rect x="32" y="80" width="120" height="46" rx="6" fill="#ffffff" stroke="#d98324"/>
  <text x="92" y="100" font-size="12" fill="#1f2d3d" text-anchor="middle">受害者浏览器</text>
  <text x="92" y="117" font-size="11" fill="#8a4b00" text-anchor="middle">已登录 bank.com</text>

  <rect x="212" y="80" width="130" height="46" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="277" y="100" font-size="12" fill="#8a4b00" text-anchor="middle">访问 evil.com</text>
  <text x="277" y="117" font-size="11" fill="#8a4b00" text-anchor="middle">页面内嵌自动提交表单</text>

  <rect x="402" y="80" width="130" height="46" rx="6" fill="#ffffff" stroke="#d98324"/>
  <text x="467" y="100" font-size="12" fill="#1f2d3d" text-anchor="middle">向 bank.com 发请求</text>
  <text x="467" y="117" font-size="11" fill="#b3261e" text-anchor="middle">Cookie 被自动附上</text>

  <rect x="592" y="80" width="60" height="46" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="622" y="100" font-size="12" fill="#8a4b00" text-anchor="middle">服务端</text>
  <text x="622" y="117" font-size="11" font-weight="700" fill="#b3261e" text-anchor="middle">转账成功</text>

  <line x1="152" y1="103" x2="210" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="342" y1="103" x2="400" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="532" y1="103" x2="590" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="32" y="140" width="620" height="66" rx="8" fill="#ffffff" stroke="#d98324"/>
  <text x="46" y="160" font-size="12.5" font-weight="700" fill="#8a4b00">服务端为什么被骗：它只校验了「你是谁」（Cookie 里的会话），没校验「这次操作是不是你自己发起的」。</text>
  <text x="46" y="180" font-size="12" fill="#1f2d3d">攻击者拿不到响应内容（同源策略拦着），但**写操作已经生效**——所以 CSRF 危害集中在改数据类接口。</text>
  <text x="46" y="198" font-size="12" fill="#1f2d3d">和 XSS 的区别：XSS 是「在你的域里执行脚本」，CSRF 是「在别人的域里借用你的凭证」。</text>

  <!-- defense flow -->
  <rect x="16" y="234" width="648" height="150" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="32" y="256" font-size="14" font-weight="700" fill="#1a4a8f">Token 防护：加一个「攻击者读不到」的随机值</text>

  <rect x="32" y="270" width="140" height="44" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="102" y="289" font-size="12" fill="#1f2d3d" text-anchor="middle">① 渲染表单时</text>
  <text x="102" y="306" font-size="11" fill="#31527a" text-anchor="middle">下发随机 csrf_token</text>

  <rect x="204" y="270" width="140" height="44" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="274" y="289" font-size="12" fill="#1a4a8f" text-anchor="middle">② 服务端存一份</text>
  <text x="274" y="306" font-size="11" fill="#31527a" text-anchor="middle">绑定当前会话</text>

  <rect x="376" y="270" width="140" height="44" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="446" y="289" font-size="12" fill="#1f2d3d" text-anchor="middle">③ 提交时带上</text>
  <text x="446" y="306" font-size="11" fill="#31527a" text-anchor="middle">放 body 或自定义头</text>

  <rect x="548" y="270" width="104" height="44" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="600" y="289" font-size="12" fill="#1a4a8f" text-anchor="middle">④ 比对</text>
  <text x="600" y="306" font-size="11" fill="#31527a" text-anchor="middle">不一致即拒绝</text>

  <line x1="172" y1="292" x2="202" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="344" y1="292" x2="374" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="516" y1="292" x2="546" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="32" y="326" width="620" height="46" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="46" y="345" font-size="12" fill="#1f2d3d">生效原理：evil.com 的 JS 受同源策略限制，读不到 bank.com 页面里的 token，也读不到 bank 域的响应体，</text>
  <text x="46" y="363" font-size="12" fill="#1f2d3d">所以它能「带 Cookie」但不能「带对 token」。补充手段：SameSite=Lax/Strict、校验 Origin/Referer、敏感操作二次验证。</text>

  <text x="20" y="410" font-size="12" font-weight="700" fill="#1f2d3d">测试怎么做（授权环境）：把请求里的 token 删掉 / 改一位 / 用另一个账号的 token 重放，看服务端是否仍返回成功。</text>
  <text x="20" y="432" font-size="11.5" fill="#64748b">常见漏洞变体：token 全局固定不随会话变、只在部分接口校验、GET 接口能改数据、校验时只判断「参数存在」不判断值。</text>
  <text x="20" y="452" font-size="11.5" fill="#64748b">注意：若站点同时存在 XSS，攻击者可直接读走 token，CSRF 防护形同虚设——两者必须一起修。</text>
</svg>
