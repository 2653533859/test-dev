<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">会话生命周期与四个必测风险点</text>

  <!-- lifecycle -->
  <rect x="20" y="52" width="118" height="52" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="79" y="74" font-size="12.5" font-weight="700" fill="#1a4a8f" text-anchor="middle">① 访问站点</text>
  <text x="79" y="92" font-size="11.5" fill="#31527a" text-anchor="middle">发放匿名 session</text>

  <rect x="158" y="52" width="118" height="52" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="217" y="74" font-size="12.5" font-weight="700" fill="#1a4a8f" text-anchor="middle">② 登录成功</text>
  <text x="217" y="92" font-size="11.5" fill="#31527a" text-anchor="middle">绑定用户身份</text>

  <rect x="296" y="52" width="118" height="52" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="355" y="74" font-size="12.5" font-weight="700" fill="#1a4a8f" text-anchor="middle">③ 携带访问</text>
  <text x="355" y="92" font-size="11.5" fill="#31527a" text-anchor="middle">每次请求带凭证</text>

  <rect x="434" y="52" width="118" height="52" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="493" y="74" font-size="12.5" font-weight="700" fill="#1a4a8f" text-anchor="middle">④ 过期/续期</text>
  <text x="493" y="92" font-size="11.5" fill="#31527a" text-anchor="middle">空闲超时滑动</text>

  <rect x="572" y="52" width="88" height="52" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="616" y="74" font-size="12.5" font-weight="700" fill="#1a4a8f" text-anchor="middle">⑤ 登出</text>
  <text x="616" y="92" font-size="11.5" fill="#31527a" text-anchor="middle">服务端销毁</text>

  <line x1="138" y1="78" x2="156" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="276" y1="78" x2="294" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="414" y1="78" x2="432" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="552" y1="78" x2="570" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- risk callouts -->
  <line x1="217" y1="104" x2="217" y2="128" stroke="#d98324" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="493" y1="104" x2="493" y2="128" stroke="#d98324" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="616" y1="104" x2="616" y2="128" stroke="#d98324" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="132" width="316" height="86" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="34" y="153" font-size="13" font-weight="700" fill="#8a4b00">风险 1｜会话固定 Session Fixation</text>
  <text x="34" y="173" font-size="11.5" fill="#1f2d3d">登录成功后仍沿用登录前的 sessionId</text>
  <text x="34" y="191" font-size="11.5" fill="#1f2d3d">→ 攻击者预先塞给受害者一个 id，登录后即共享会话</text>
  <text x="34" y="209" font-size="11.5" font-weight="700" fill="#8a4b00">测法：记录登录前后 Cookie，值必须变；修复：登录时 regenerate</text>

  <rect x="348" y="132" width="316" height="86" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="362" y="153" font-size="13" font-weight="700" fill="#8a4b00">风险 2｜登出后凭证仍可用</text>
  <text x="362" y="173" font-size="11.5" fill="#1f2d3d">前端只清了本地存储，服务端没作废</text>
  <text x="362" y="191" font-size="11.5" fill="#1f2d3d">→ 旧 token 重放依旧返回 200</text>
  <text x="362" y="209" font-size="11.5" font-weight="700" fill="#8a4b00">测法：登出后拿旧凭证重放业务接口，应返回 401</text>

  <rect x="20" y="230" width="316" height="86" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="34" y="251" font-size="13" font-weight="700" fill="#8a4b00">风险 3｜有效期过长 / 不滑动</text>
  <text x="34" y="271" font-size="11.5" fill="#1f2d3d">token 一年不过期、改密码后老会话不踢</text>
  <text x="34" y="289" font-size="11.5" fill="#1f2d3d">→ 凭证一旦泄露，窗口无限长</text>
  <text x="34" y="307" font-size="11.5" font-weight="700" fill="#8a4b00">测法：改密 / 改手机号后，旧设备会话应立即失效</text>

  <rect x="348" y="230" width="316" height="86" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="362" y="251" font-size="13" font-weight="700" fill="#8a4b00">风险 4｜Cookie 属性缺失</text>
  <text x="362" y="271" font-size="11.5" fill="#1f2d3d">缺 HttpOnly → XSS 可直接读走</text>
  <text x="362" y="289" font-size="11.5" fill="#1f2d3d">缺 Secure → 明文信道可被截获；缺 SameSite → 易被 CSRF</text>
  <text x="362" y="307" font-size="11.5" font-weight="700" fill="#8a4b00">测法：看 Set-Cookie 响应头三属性是否齐全</text>

  <!-- correct pattern -->
  <rect x="20" y="332" width="640" height="82" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="34" y="354" font-size="13.5" font-weight="700" fill="#1a4a8f">正确做法清单</text>
  <text x="34" y="375" font-size="12" fill="#1f2d3d">登录时重新生成会话标识 · 会话数据存服务端（或 token 带服务端可作废的版本号）</text>
  <text x="34" y="394" font-size="12" fill="#1f2d3d">登出 / 改密 / 改绑走「服务端注销 + 版本号自增」· 空闲超时 30 分钟、绝对超时 8 小时</text>
  <text x="34" y="410" font-size="12" fill="#1f2d3d">Set-Cookie: HttpOnly; Secure; SameSite=Lax · 敏感操作要求二次认证</text>

  <text x="20" y="440" font-size="11.5" fill="#64748b">弱口令是另一条独立线：登录接口应有失败次数限制 + 验证码 + 密码复杂度策略，口令用加盐慢哈希（bcrypt/Argon2）存储。</text>
  <text x="20" y="458" font-size="11.5" fill="#64748b">以上验证全部在测试环境用自有账号完成，不对真实用户账号做任何尝试。</text>
</svg>
