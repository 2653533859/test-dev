<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">Burp Suite 工作流：中间人代理 + 四个常用模块</text>

  <!-- proxy chain -->
  <rect x="20" y="48" width="130" height="56" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="85" y="70" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">浏览器 / App</text>
  <text x="85" y="90" font-size="11.5" fill="#31527a" text-anchor="middle">代理指向 127.0.0.1:8080</text>

  <rect x="200" y="48" width="180" height="56" rx="8" fill="#d3e5ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="290" y="70" font-size="12.5" font-weight="700" fill="#1a4a8f" text-anchor="middle">Burp Proxy（中间人）</text>
  <text x="290" y="90" font-size="11.5" fill="#31527a" text-anchor="middle">用 Burp CA 证书解 HTTPS</text>

  <rect x="430" y="48" width="130" height="56" rx="8" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="495" y="70" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">被测服务</text>
  <text x="495" y="90" font-size="11.5" fill="#31527a" text-anchor="middle">仅限授权测试环境</text>

  <rect x="586" y="48" width="74" height="56" rx="8" fill="#ffe0c2" stroke="#d98324" stroke-width="1.5"/>
  <text x="623" y="70" font-size="12" font-weight="700" fill="#8a4b00" text-anchor="middle">Scope</text>
  <text x="623" y="88" font-size="11" fill="#8a4b00" text-anchor="middle">必须先设</text>

  <line x1="150" y1="76" x2="198" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="76" x2="428" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="428" y1="90" x2="382" y2="90" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="198" y1="90" x2="152" y2="90" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- funnel -->
  <line x1="290" y1="104" x2="290" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="128" width="640" height="34" rx="6" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="340" y="150" font-size="12.5" font-weight="700" fill="#31527a" text-anchor="middle">HTTP history：所有流量在此沉淀，按 Scope 过滤后就是这个系统的「接口清单」</text>

  <!-- modules -->
  <line x1="120" y1="162" x2="120" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="162" x2="270" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="162" x2="420" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="162" x2="570" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="188" width="200" height="104" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="120" y="210" font-size="13" font-weight="700" fill="#1a4a8f" text-anchor="middle">Repeater 手工改包</text>
  <text x="34" y="231" font-size="11.5" fill="#1f2d3d">改一个参数 → 发 → 看响应</text>
  <text x="34" y="249" font-size="11.5" fill="#1f2d3d">越权、参数篡改、逻辑校验</text>
  <text x="34" y="267" font-size="11.5" fill="#1f2d3d">几乎都靠它验证</text>
  <text x="34" y="285" font-size="11" fill="#64748b">测开最高频的模块</text>

  <rect x="240" y="188" width="200" height="104" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="340" y="210" font-size="13" font-weight="700" fill="#1a4a8f" text-anchor="middle">Intruder 批量替换</text>
  <text x="254" y="231" font-size="11.5" fill="#1f2d3d">标记 §位置§ + 载荷集</text>
  <text x="254" y="249" font-size="11.5" fill="#1f2d3d">遍历 id 查越权、批量验状态码</text>
  <text x="254" y="267" font-size="11.5" fill="#1f2d3d">按响应长度差异筛异常</text>
  <text x="254" y="285" font-size="11" fill="#b3261e">禁止用于口令爆破等越界行为</text>

  <rect x="460" y="188" width="200" height="104" rx="8" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="560" y="210" font-size="13" font-weight="700" fill="#1a4a8f" text-anchor="middle">Decoder / Comparer</text>
  <text x="474" y="231" font-size="11.5" fill="#1f2d3d">URL / Base64 / Hex 编解码</text>
  <text x="474" y="249" font-size="11.5" fill="#1f2d3d">解 JWT 看 payload</text>
  <text x="474" y="267" font-size="11.5" fill="#1f2d3d">Comparer 逐字节比对两次响应</text>
  <text x="474" y="285" font-size="11" fill="#64748b">定位「哪一位不同」很好用</text>

  <!-- typical usage -->
  <rect x="20" y="306" width="640" height="98" rx="8" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="34" y="328" font-size="13.5" font-weight="700" fill="#8a4b00">测开最常走的一条链路</text>
  <text x="34" y="350" font-size="12" fill="#1f2d3d">① 配好代理与证书，设置 Target Scope，只抓被测域名</text>
  <text x="34" y="369" font-size="12" fill="#1f2d3d">② 正常走一遍业务，让 HTTP history 沉淀出完整接口清单</text>
  <text x="34" y="388" font-size="12" fill="#1f2d3d">③ 挑关键写接口 → Send to Repeater → 改 id / 改金额 / 删 token → 看服务端是否拦截 → 截图存证写报告</text>

  <text x="20" y="428" font-size="11.5" fill="#64748b">环境提醒：只在自有测试环境开代理；测完及时关闭系统代理并移除 CA 证书，避免日常上网流量被中间人。</text>
  <text x="20" y="446" font-size="11.5" fill="#64748b">替代品：OWASP ZAP（开源免费，功能对标 Proxy + 主被动扫描），Charles / Fiddler 偏抓包不偏安全测试。</text>
  <text x="20" y="464" font-size="11.5" fill="#64748b">App 抓包还需处理证书固定（SSL Pinning），需在自有测试包上处理，不对第三方 App 操作。</text>
</svg>
