<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b3261e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2d3d">越权：水平（换数据）与垂直（换角色）</text>

  <!-- horizontal -->
  <rect x="16" y="44" width="648" height="164" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="32" y="66" font-size="14" font-weight="700" fill="#1a4a8f">水平越权：同一角色，越到别人的数据（改的是「资源标识」）</text>

  <rect x="32" y="80" width="130" height="52" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="97" y="100" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">用户 A 登录态</text>
  <text x="97" y="119" font-size="11.5" fill="#31527a" text-anchor="middle">userId=1001</text>

  <rect x="204" y="80" width="188" height="52" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="298" y="100" font-size="12" fill="#1a4a8f" text-anchor="middle">GET /api/order/2002</text>
  <text x="298" y="119" font-size="11.5" fill="#b3261e" text-anchor="middle">把 2002 换成 B 的订单号</text>

  <rect x="434" y="80" width="112" height="52" rx="6" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="490" y="100" font-size="12" fill="#1f2d3d" text-anchor="middle">服务端</text>
  <text x="490" y="119" font-size="11.5" fill="#8a4b00" text-anchor="middle">只按订单号查库</text>

  <rect x="588" y="80" width="64" height="52" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="620" y="103" font-size="12" font-weight="700" fill="#b3261e" text-anchor="middle">返回</text>
  <text x="620" y="120" font-size="12" font-weight="700" fill="#b3261e" text-anchor="middle">B 的数据</text>

  <line x1="162" y1="106" x2="202" y2="106" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="392" y1="106" x2="432" y2="106" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="546" y1="106" x2="586" y2="106" stroke="#b3261e" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="32" y="144" width="620" height="50" rx="8" fill="#ffffff" stroke="#2f6fd0"/>
  <text x="46" y="163" font-size="12" font-weight="700" fill="#1a4a8f">缺失的那一句校验：</text>
  <text x="170" y="163" font-size="12" fill="#1f2d3d">WHERE order_id = ? AND owner_id = 当前登录用户</text>
  <text x="46" y="183" font-size="11.5" fill="#475569">测试点：URL 路径 id、query 参数、body 里的 userId/accountId、批量接口的 id 数组、导出接口的筛选条件。</text>

  <!-- vertical -->
  <rect x="16" y="222" width="648" height="164" rx="10" fill="#fff5ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="32" y="244" font-size="14" font-weight="700" fill="#8a4b00">垂直越权：低权限角色，越到高权限功能（改的是「访问的接口」）</text>

  <rect x="32" y="258" width="130" height="52" rx="6" fill="#ffffff" stroke="#d98324"/>
  <text x="97" y="278" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">普通用户登录态</text>
  <text x="97" y="297" font-size="11.5" fill="#8a4b00" text-anchor="middle">role=user</text>

  <rect x="204" y="258" width="188" height="52" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="298" y="278" font-size="12" fill="#8a4b00" text-anchor="middle">POST /api/admin/user/delete</text>
  <text x="298" y="297" font-size="11.5" fill="#b3261e" text-anchor="middle">直接调管理员接口</text>

  <rect x="434" y="258" width="112" height="52" rx="6" fill="#ffffff" stroke="#d98324"/>
  <text x="490" y="278" font-size="12" fill="#1f2d3d" text-anchor="middle">服务端</text>
  <text x="490" y="297" font-size="11.5" fill="#b3261e" text-anchor="middle">只藏了前端按钮</text>

  <rect x="588" y="258" width="64" height="52" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="620" y="281" font-size="12" font-weight="700" fill="#b3261e" text-anchor="middle">执行</text>
  <text x="620" y="298" font-size="12" font-weight="700" fill="#b3261e" text-anchor="middle">删除成功</text>

  <line x1="162" y1="284" x2="202" y2="284" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="392" y1="284" x2="432" y2="284" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="546" y1="284" x2="586" y2="284" stroke="#b3261e" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="32" y="322" width="620" height="50" rx="8" fill="#ffffff" stroke="#d98324"/>
  <text x="46" y="341" font-size="12" font-weight="700" fill="#8a4b00">根因：</text>
  <text x="92" y="341" font-size="12" fill="#1f2d3d">权限控制只做在前端菜单/按钮显隐上，后端接口没有独立鉴权拦截器。</text>
  <text x="46" y="361" font-size="11.5" fill="#475569">测试点：拿低权账号重放高权账号抓到的每一个请求；注意未挂鉴权的新接口、内部接口、导出与批处理接口。</text>

  <!-- conclusion -->
  <rect x="16" y="400" width="648" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="419" font-size="12.5" font-weight="700" fill="#1f2d3d" text-anchor="middle">统一原则：身份来自「服务端会话」，绝不能来自「请求参数」；权限校验默认拒绝，逐接口显式放行</text>
  <text x="340" y="435" font-size="11.5" fill="#475569" text-anchor="middle">越权是业务语义问题，扫描器不知道「谁该看什么」，所以只能靠人工用例覆盖</text>

  <text x="20" y="460" font-size="11.5" fill="#64748b">测试准备：至少两个同级账号 A/B + 一个高权账号，全部为测试环境自有账号。</text>
</svg>
