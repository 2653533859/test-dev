<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">关闭阶段状态迁移：TIME_WAIT 在主动方，CLOSE_WAIT 在被动方</text>

  <text x="90" y="56" font-size="13" font-weight="700" fill="#2f6fd0">主动关闭方（先发 FIN）</text>
  <text x="440" y="56" font-size="13" font-weight="700" fill="#d98324">被动关闭方（后发 FIN）</text>

  <!-- active side -->
  <rect x="60" y="70" width="170" height="32" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="145" y="91" font-size="12" fill="#1f2d3d" text-anchor="middle">ESTABLISHED</text>
  <line x1="145" y1="102" x2="145" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="152" y="119" font-size="11" fill="#64748b">close() → 发 FIN</text>

  <rect x="60" y="128" width="170" height="32" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="145" y="149" font-size="12" fill="#1f2d3d" text-anchor="middle">FIN_WAIT_1</text>
  <line x1="145" y1="160" x2="145" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="152" y="177" font-size="11" fill="#64748b">收 ACK</text>

  <rect x="60" y="186" width="170" height="32" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="145" y="207" font-size="12" fill="#1f2d3d" text-anchor="middle">FIN_WAIT_2</text>
  <line x1="145" y1="218" x2="145" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="152" y="240" font-size="11" fill="#64748b">收对方 FIN → 回 ACK</text>

  <rect x="60" y="258" width="170" height="42" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="145" y="276" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">TIME_WAIT</text>
  <text x="145" y="293" font-size="11" fill="#991b1b" text-anchor="middle">固定等 2MSL（Linux 约 60s）</text>
  <line x1="145" y1="300" x2="145" y2="324" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="326" width="170" height="32" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="145" y="347" font-size="12" fill="#1f2d3d" text-anchor="middle">CLOSED</text>

  <!-- passive side -->
  <rect x="440" y="70" width="180" height="32" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="530" y="91" font-size="12" fill="#1f2d3d" text-anchor="middle">ESTABLISHED</text>
  <line x1="530" y1="102" x2="530" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="537" y="124" font-size="11" fill="#64748b">收 FIN → 内核自动回 ACK</text>

  <rect x="440" y="142" width="180" height="46" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="530" y="162" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">CLOSE_WAIT</text>
  <text x="530" y="179" font-size="11" fill="#991b1b" text-anchor="middle">等应用自己调 close()，无超时</text>
  <line x1="530" y1="188" x2="530" y2="226" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="537" y="211" font-size="11" fill="#64748b">应用 close() → 发 FIN</text>

  <rect x="440" y="228" width="180" height="32" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="530" y="249" font-size="12" fill="#1f2d3d" text-anchor="middle">LAST_ACK</text>
  <line x1="530" y1="260" x2="530" y2="284" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="537" y="277" font-size="11" fill="#64748b">收 ACK</text>
  <rect x="440" y="286" width="180" height="32" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="530" y="307" font-size="12" fill="#1f2d3d" text-anchor="middle">CLOSED</text>

  <!-- cross arrows -->
  <line x1="232" y1="120" x2="438" y2="112" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="110" font-size="11" fill="#2f6fd0" text-anchor="middle">FIN</text>
  <line x1="438" y1="200" x2="234" y2="240" stroke="#d98324" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="216" font-size="11" fill="#d98324" text-anchor="middle">FIN</text>
  <line x1="234" y1="272" x2="438" y2="272" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="266" font-size="11" fill="#2f6fd0" text-anchor="middle">最后一个 ACK</text>

  <!-- diagnosis -->
  <rect x="30" y="374" width="290" height="76" rx="8" fill="#eef6ff" stroke="#2f6fd0"/>
  <text x="45" y="394" font-size="12.5" font-weight="700" fill="#1f2d3d">TIME_WAIT 堆积</text>
  <text x="45" y="413" font-size="11.5" fill="#475569">正常现象，说明本机是主动关闭方，</text>
  <text x="45" y="430" font-size="11.5" fill="#475569">短连接压测时最典型。调大端口范围 /</text>
  <text x="45" y="443" font-size="11.5" fill="#475569">开 tcp_tw_reuse / 改用长连接。</text>

  <rect x="350" y="374" width="300" height="76" rx="8" fill="#fff4e6" stroke="#d98324"/>
  <text x="365" y="394" font-size="12.5" font-weight="700" fill="#1f2d3d">CLOSE_WAIT 堆积</text>
  <text x="365" y="413" font-size="11.5" fill="#475569">一定是代码 bug：连接对端已关，本应用</text>
  <text x="365" y="430" font-size="11.5" fill="#475569">没调 close()。查连接池泄漏、异常分支漏</text>
  <text x="365" y="443" font-size="11.5" fill="#475569">关、忘记 with / try-finally。</text>
</svg>
