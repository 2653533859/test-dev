<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">HTTP/1.1 队头阻塞 vs HTTP/2 多路复用 vs HTTP/3</text>

  <!-- HTTP/1.1 -->
  <text x="20" y="58" font-size="13" font-weight="700" fill="#1e293b">HTTP/1.1 长连接：一条连接同一时刻只能跑一个请求</text>
  <line x1="40" y1="130" x2="650" y2="130" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="620" y="148" font-size="11" fill="#64748b">时间 →</text>
  <rect x="40" y="70" width="150" height="30" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="115" y="90" font-size="11.5" fill="#1f2d3d" text-anchor="middle">请求 A（慢，300ms）</text>
  <rect x="190" y="70" width="110" height="30" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="245" y="90" font-size="11.5" fill="#475569" text-anchor="middle">B 排队等待</text>
  <rect x="300" y="70" width="90" height="30" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="345" y="90" font-size="11.5" fill="#1f2d3d" text-anchor="middle">请求 B</text>
  <rect x="390" y="70" width="110" height="30" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="445" y="90" font-size="11.5" fill="#475569" text-anchor="middle">C 排队等待</text>
  <rect x="500" y="70" width="90" height="30" rx="5" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="545" y="90" font-size="11.5" fill="#1f2d3d" text-anchor="middle">请求 C</text>
  <text x="40" y="118" font-size="11" fill="#dc2626">队头阻塞：前一个响应没回来，后面的请求只能干等；浏览器只好对同域名开 6 条连接硬扛。</text>

  <!-- HTTP/2 -->
  <text x="20" y="182" font-size="13" font-weight="700" fill="#1e293b">HTTP/2：一条 TCP 连接，帧交错传输（多路复用）</text>
  <rect x="40" y="196" width="600" height="76" rx="8" fill="#eef6ff" stroke="#2f6fd0"/>
  <text x="52" y="214" font-size="11.5" fill="#2f6fd0">单条 TCP 连接内部</text>
  <rect x="60" y="222" width="70" height="26" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="95" y="240" font-size="11" fill="#1f2d3d" text-anchor="middle">A 帧 1</text>
  <rect x="136" y="222" width="70" height="26" rx="4" fill="#ffe0c2" stroke="#d98324"/>
  <text x="171" y="240" font-size="11" fill="#1f2d3d" text-anchor="middle">B 帧 1</text>
  <rect x="212" y="222" width="70" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="247" y="240" font-size="11" fill="#166534" text-anchor="middle">C 帧 1</text>
  <rect x="288" y="222" width="70" height="26" rx="4" fill="#ffe0c2" stroke="#d98324"/>
  <text x="323" y="240" font-size="11" fill="#1f2d3d" text-anchor="middle">B 帧 2</text>
  <rect x="364" y="222" width="70" height="26" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="399" y="240" font-size="11" fill="#1f2d3d" text-anchor="middle">A 帧 2</text>
  <rect x="440" y="222" width="70" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="475" y="240" font-size="11" fill="#166534" text-anchor="middle">C 帧 2</text>
  <rect x="516" y="222" width="110" height="26" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="571" y="240" font-size="11" fill="#1f2d3d" text-anchor="middle">A 帧 3（结束）</text>
  <text x="52" y="264" font-size="11" fill="#475569">每帧带 Stream ID，接收端按 ID 重新组装 → 三个请求同时在飞，应用层队头阻塞消失。</text>

  <text x="40" y="292" font-size="11.5" fill="#d98324">但 TCP 层的队头阻塞还在：任一个 TCP 段丢包，整条连接上所有 Stream 都要等重传。</text>

  <!-- HTTP/3 -->
  <text x="20" y="326" font-size="13" font-weight="700" fill="#1e293b">HTTP/3：把传输层换成 QUIC（基于 UDP）</text>
  <rect x="40" y="340" width="180" height="34" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="130" y="362" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Stream 1 独立丢包重传</text>
  <rect x="230" y="340" width="180" height="34" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="320" y="362" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Stream 2 不受影响</text>
  <rect x="420" y="340" width="220" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="530" y="362" font-size="11.5" fill="#166534" text-anchor="middle">0-RTT 重连 · 连接迁移（换 Wi-Fi 不断）</text>

  <text x="20" y="404" font-size="11.5" fill="#64748b">测试影响一：HTTP/2 下「域名分片」「雪碧图」等 1.1 时代的优化反而变成负优化，性能基线要重测。</text>
  <text x="20" y="424" font-size="11.5" fill="#64748b">测试影响二：HTTP/2 是二进制分帧，Fiddler/Charles 需开启对应支持；tcpdump 抓到的是 TLS 密文，要靠 SSLKEYLOGFILE 解密。</text>
  <text x="20" y="448" font-size="11.5" fill="#64748b">测试影响三：HTTP/3 走 UDP 443，很多公司防火墙直接丢弃，压测环境常要显式降级到 HTTP/2 才能复现线上表现。</text>
</svg>
