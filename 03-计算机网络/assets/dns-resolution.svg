<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">DNS 解析链路：先查缓存，再递归 + 迭代查询</text>

  <!-- local cache chain -->
  <text x="20" y="56" font-size="13" font-weight="700" fill="#1e293b">第一阶段：本机四级缓存（命中就直接返回，压根不发包）</text>
  <rect x="30" y="68" width="120" height="34" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="90" y="90" font-size="11.5" fill="#1f2d3d" text-anchor="middle">浏览器 DNS 缓存</text>
  <line x1="152" y1="85" x2="180" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="182" y="68" width="110" height="34" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="237" y="90" font-size="11.5" fill="#1f2d3d" text-anchor="middle">系统 DNS 缓存</text>
  <line x1="294" y1="85" x2="322" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="324" y="68" width="140" height="34" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="394" y="90" font-size="11.5" fill="#1f2d3d" text-anchor="middle">hosts 文件（最高优先）</text>
  <line x1="466" y1="85" x2="494" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="496" y="68" width="150" height="34" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="571" y="90" font-size="11.5" fill="#1f2d3d" text-anchor="middle">本地 DNS（运营商/公司）</text>

  <!-- recursive -->
  <text x="20" y="140" font-size="13" font-weight="700" fill="#1e293b">第二阶段：本地 DNS 代你迭代查询（客户端只发一次请求）</text>
  <rect x="30" y="156" width="150" height="44" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="105" y="174" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Local DNS</text>
  <text x="105" y="191" font-size="11" fill="#475569" text-anchor="middle">如 114.114.114.114</text>

  <rect x="420" y="126" width="230" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="535" y="148" font-size="11.5" fill="#1f2d3d" text-anchor="middle">根域名服务器（.）</text>
  <rect x="420" y="176" width="230" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="535" y="198" font-size="11.5" fill="#1f2d3d" text-anchor="middle">顶级域服务器（.com）</text>
  <rect x="420" y="226" width="230" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="535" y="248" font-size="11.5" fill="#1f2d3d" text-anchor="middle">权威域名服务器（example.com）</text>

  <line x1="184" y1="160" x2="416" y2="140" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="300" y="146" font-size="10.5" fill="#64748b" text-anchor="middle">① 问 www.example.com → 答「去问 .com」</text>
  <line x1="184" y1="180" x2="416" y2="190" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="300" y="180" font-size="10.5" fill="#64748b" text-anchor="middle">② 再问 → 答「去问 example.com 的权威」</text>
  <line x1="184" y1="198" x2="416" y2="240" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="300" y="224" font-size="10.5" fill="#64748b" text-anchor="middle">③ 再问 → 返回 A 记录 / CNAME</text>

  <!-- CDN -->
  <text x="20" y="292" font-size="13" font-weight="700" fill="#1e293b">第三阶段：CDN 让同一个域名对不同人返回不同 IP</text>
  <rect x="30" y="306" width="170" height="34" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="115" y="328" font-size="11.5" fill="#1f2d3d" text-anchor="middle">权威返回 CNAME → CDN</text>
  <line x1="202" y1="323" x2="238" y2="323" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="306" width="180" height="34" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="330" y="328" font-size="11.5" fill="#1f2d3d" text-anchor="middle">CDN 调度：按来源 IP 就近</text>
  <line x1="422" y1="323" x2="458" y2="323" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="306" width="190" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="555" y="328" font-size="11.5" fill="#166534" text-anchor="middle">返回最近边缘节点 IP</text>

  <text x="20" y="368" font-size="11.5" fill="#64748b">对测试的影响一：你在北京测到的 IP 和上海同事不一样，「同一个用例结果不同」很可能只是命中了不同边缘节点。</text>
  <text x="20" y="388" font-size="11.5" fill="#64748b">对测试的影响二：改了 hosts 却不生效，八成是浏览器/系统缓存没清，或程序自己做了 DNS 缓存（JVM 默认永久缓存正向解析）。</text>
  <text x="20" y="408" font-size="11.5" fill="#64748b">对测试的影响三：灰度发布切流量常靠改 DNS 权重，TTL 没到期时老用户仍打到旧集群，验证时要按 TTL 等待或直接指定 IP。</text>
  <text x="20" y="436" font-size="11.5" fill="#64748b">常用命令：dig +trace www.example.com（看完整迭代过程）、nslookup、ipconfig /flushdns、systemd-resolve --flush-caches。</text>
</svg>
