<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">正向代理 vs 反向代理：区别在于「代理谁、谁不知情」</text>

  <!-- forward -->
  <text x="20" y="58" font-size="13" font-weight="700" fill="#2f6fd0">正向代理：站在客户端一侧，替客户端出面</text>
  <rect x="30" y="72" width="120" height="46" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="90" y="94" font-size="11.5" fill="#1f2d3d" text-anchor="middle">客户端</text>
  <text x="90" y="110" font-size="10.5" fill="#475569" text-anchor="middle">主动配置了代理</text>
  <line x1="152" y1="95" x2="228" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="230" y="72" width="140" height="46" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="300" y="94" font-size="11.5" fill="#1f2d3d" text-anchor="middle">正向代理</text>
  <text x="300" y="110" font-size="10.5" fill="#475569" text-anchor="middle">Charles / 公司出口</text>
  <line x1="372" y1="95" x2="448" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="450" y="72" width="200" height="46" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="550" y="94" font-size="11.5" fill="#1f2d3d" text-anchor="middle">目标服务器</text>
  <text x="550" y="110" font-size="10.5" fill="#dc2626" text-anchor="middle">看到的来源 IP 是代理</text>
  <text x="30" y="140" font-size="11" fill="#64748b">典型用途：抓包改包、访问受限资源、统一出口审计。服务端不知道真实客户端是谁。</text>

  <line x1="20" y1="158" x2="660" y2="158" stroke="#cbd5e1" stroke-width="1"/>

  <!-- reverse -->
  <text x="20" y="184" font-size="13" font-weight="700" fill="#d98324">反向代理：站在服务端一侧，替一群服务器出面</text>
  <rect x="30" y="198" width="120" height="46" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="90" y="220" font-size="11.5" fill="#1f2d3d" text-anchor="middle">客户端</text>
  <text x="90" y="236" font-size="10.5" fill="#dc2626" text-anchor="middle">以为这就是服务器</text>
  <line x1="152" y1="221" x2="228" y2="221" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="230" y="190" width="150" height="62" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="305" y="212" font-size="11.5" fill="#1f2d3d" text-anchor="middle">反向代理 / 网关</text>
  <text x="305" y="228" font-size="10.5" fill="#475569" text-anchor="middle">Nginx · SLB · APISIX</text>
  <text x="305" y="244" font-size="10.5" fill="#475569" text-anchor="middle">负载均衡 / TLS 卸载</text>

  <line x1="382" y1="204" x2="448" y2="188" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="382" y1="221" x2="448" y2="221" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="382" y1="238" x2="448" y2="254" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="450" y="172" width="190" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="545" y="192" font-size="11" fill="#166534" text-anchor="middle">应用实例 1</text>
  <rect x="450" y="206" width="190" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="545" y="226" font-size="11" fill="#166534" text-anchor="middle">应用实例 2</text>
  <rect x="450" y="240" width="190" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="545" y="260" font-size="11" fill="#166534" text-anchor="middle">应用实例 3</text>
  <text x="30" y="288" font-size="11" fill="#64748b">典型用途：负载均衡、灰度分流、限流熔断、统一鉴权、HTTPS 卸载、跨域反代。客户端不知道后面有几台机器。</text>

  <!-- test implications -->
  <rect x="30" y="306" width="300" height="94" rx="8" fill="#eef6ff" stroke="#2f6fd0"/>
  <text x="45" y="326" font-size="12.5" font-weight="700" fill="#1f2d3d">测试里的正向代理</text>
  <text x="45" y="345" font-size="11.5" fill="#475569">· 手机 Wi-Fi 设代理 → Charles 抓 App 包</text>
  <text x="45" y="363" font-size="11.5" fill="#475569">· requests 的 proxies 参数走 mitmproxy</text>
  <text x="45" y="381" font-size="11.5" fill="#475569">· Mock：代理层直接返回构造的响应</text>

  <rect x="350" y="306" width="300" height="94" rx="8" fill="#fff4e6" stroke="#d98324"/>
  <text x="365" y="326" font-size="12.5" font-weight="700" fill="#1f2d3d">测试里的反向代理</text>
  <text x="365" y="345" font-size="11.5" fill="#475569">· 502 = 后端挂了；504 = 后端太慢超时</text>
  <text x="365" y="363" font-size="11.5" fill="#475569">· 真实客户端 IP 看 X-Forwarded-For</text>
  <text x="365" y="381" font-size="11.5" fill="#475569">· 压测先确认瓶颈在 Nginx 还是应用</text>

  <text x="20" y="428" font-size="11.5" fill="#64748b">一句话记忆：正向代理「客户端知道、服务端不知道」；反向代理「服务端知道、客户端不知道」。</text>
  <text x="20" y="450" font-size="11.5" fill="#64748b">两者在 HTTP 报文上的区别：正向代理请求行是完整 URL（GET http://host/path），反向代理仍是相对路径（GET /path）。</text>
</svg>
