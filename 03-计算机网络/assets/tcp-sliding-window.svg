<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#f8fafc"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">TCP 滑动窗口：发送方视角的四个区域</text>

  <!-- window before -->
  <text x="20" y="58" font-size="13" font-weight="700" fill="#1e293b">收到 ack=4 之前</text>
  <g>
    <rect x="30" y="70" width="90" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="75" y="92" font-size="11.5" fill="#166534" text-anchor="middle">1-3 已确认</text>
    <rect x="120" y="70" width="120" height="34" rx="4" fill="#ffe0c2" stroke="#d98324"/>
    <text x="180" y="92" font-size="11.5" fill="#1f2d3d" text-anchor="middle">4-6 已发未确认</text>
    <rect x="240" y="70" width="150" height="34" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
    <text x="315" y="92" font-size="11.5" fill="#1f2d3d" text-anchor="middle">7-9 可发（窗口内）</text>
    <rect x="390" y="70" width="150" height="34" rx="4" fill="#e2e8f0" stroke="#64748b"/>
    <text x="465" y="92" font-size="11.5" fill="#475569" text-anchor="middle">10+ 不可发</text>
  </g>
  <line x1="120" y1="116" x2="390" y2="116" stroke="#2f6fd0" stroke-width="1.5"/>
  <line x1="120" y1="110" x2="120" y2="122" stroke="#2f6fd0" stroke-width="1.5"/>
  <line x1="390" y1="110" x2="390" y2="122" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="255" y="134" font-size="11.5" fill="#2f6fd0" text-anchor="middle">发送窗口 = min(接收窗口 rwnd, 拥塞窗口 cwnd)</text>

  <!-- window after -->
  <text x="20" y="172" font-size="13" font-weight="700" fill="#1e293b">收到 ack=7（1-6 全部确认）后，窗口右滑</text>
  <g>
    <rect x="30" y="184" width="210" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="135" y="206" font-size="11.5" fill="#166534" text-anchor="middle">1-6 已确认</text>
    <rect x="240" y="184" width="150" height="34" rx="4" fill="#ffe0c2" stroke="#d98324"/>
    <text x="315" y="206" font-size="11.5" fill="#1f2d3d" text-anchor="middle">7-9 已发未确认</text>
    <rect x="390" y="184" width="150" height="34" rx="4" fill="#d3e5ff" stroke="#2f6fd0"/>
    <text x="465" y="206" font-size="11.5" fill="#1f2d3d" text-anchor="middle">10-12 可发</text>
    <rect x="540" y="184" width="100" height="34" rx="4" fill="#e2e8f0" stroke="#64748b"/>
    <text x="590" y="206" font-size="11.5" fill="#475569" text-anchor="middle">13+ 不可发</text>
  </g>
  <line x1="215" y1="236" x2="275" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="240" font-size="11.5" fill="#64748b">窗口整体右移，滑动的动力是「收到 ACK」</text>

  <!-- retransmit -->
  <text x="20" y="282" font-size="13" font-weight="700" fill="#1e293b">丢包时：累计确认 + 快速重传</text>
  <rect x="30" y="296" width="120" height="28" rx="6" fill="#d3e5ff" stroke="#2f6fd0"/>
  <text x="90" y="315" font-size="11.5" fill="#1f2d3d" text-anchor="middle">发 seq=4,5,6,7</text>
  <line x1="152" y1="310" x2="188" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="296" width="130" height="28" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="255" y="315" font-size="11.5" fill="#991b1b" text-anchor="middle">seq=5 在途中丢失</text>
  <line x1="322" y1="310" x2="358" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="296" width="170" height="28" rx="6" fill="#ffe0c2" stroke="#d98324"/>
  <text x="445" y="315" font-size="11.5" fill="#1f2d3d" text-anchor="middle">接收方连发 3 个 ack=5</text>
  <line x1="445" y1="326" x2="445" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="350" width="230" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="445" y="369" font-size="11.5" fill="#166534" text-anchor="middle">发送方不等超时，立刻重传 seq=5</text>

  <text x="20" y="404" font-size="11.5" fill="#64748b">累计确认：ack=5 表示「5 之前的都收到了，我下一个想要 5」，所以单个 ACK 丢了不要紧，后一个 ACK 能覆盖。</text>
  <text x="20" y="424" font-size="11.5" fill="#64748b">流量控制（rwnd）防的是「接收方缓冲区被撑爆」；拥塞控制（cwnd）防的是「把中间网络压垮」，两者取小值生效。</text>
  <text x="20" y="448" font-size="11.5" fill="#64748b">测试关注点：rwnd 长期为 0 说明接收端应用读得慢；大量重传说明链路质量差或带宽打满。</text>
</svg>
